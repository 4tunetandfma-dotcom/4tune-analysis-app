      .analysis-viewer {
  display: flex;
  flex-direction: column;
  gap: 7px;
  height: calc(100dvh - 12px);
  min-height: 0;
  padding: 8px;
  overflow: hidden;
  border-radius: 16px;
}

body.analysis-detail-mode .app {
  padding: 6px 9px;
}

body.analysis-detail-mode .brand {
  display: none;
}

.analysis-detail-shell {
  min-height: 0;
}

.analysis-canvas-wrap {
  position: relative;
  overflow: hidden;
  width: calc(100% - 8px);
  margin: 0 auto;
  flex: 0 0 auto;
  border-radius: 14px;
  background: #eef3f6;
  border: 1px solid var(--line);
}

.analysis-canvas {
  display: block;
  width: 100%;
  height: 215px;
  touch-action: none;
}

.analysis-back-button {
  position: absolute;
  top: 7px;
  left: 7px;
  z-index: 3;
  width: auto;
  min-height: 28px;
  padding: 0 9px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 9px;
  background: rgba(23,79,67,.82);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  box-shadow: 0 3px 10px rgba(23,79,67,.18);
}

.analysis-overlay {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 4px 7px;
  border-radius: 9px;
  background: rgba(11, 57, 84, 0.75);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  pointer-events: none;
}

.analysis-controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  flex: 0 0 auto;
  gap: 5px;
}

.analysis-control-button {
  min-height: 32px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--navy);
  font-size: 11px;
  font-weight: 900;
}

.analysis-control-button.primary-control {
  border-color: var(--navy);
  background: var(--navy);
  color: #fff;
}

.analysis-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  flex: 0 0 auto;
  gap: 4px;
  padding: 3px;
  border-radius: 11px;
  background: #e5edf1;
}

.analysis-tab-button {
  min-height: 31px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
}

.analysis-tab-button.active {
  background: #fff;
  color: var(--navy);
  box-shadow: 0 5px 14px rgba(11, 57, 84, 0.12);
}

.analysis-tab-panel {
  display: none;
  min-height: 0;
}

.analysis-tab-panel.active {
  display: grid;
  flex: 1 1 auto;
  align-content: start;
  gap: 8px;
  min-height: 0;
  padding: 2px 3px 6px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

@media(max-height:740px) {
  .analysis-canvas { height: 195px; }
}

.analysis-setting {
  display: grid;
  gap: 7px;
}

.analysis-setting-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.analysis-setting input[type="range"] {
  width: 100%;
  accent-color: var(--blue);
}

.analysis-toggle-list {
  display: grid;
  gap: 5px;
}

.analysis-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 37px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
}

.analysis-toggle input {
  width: 20px;
  min-height: 20px;
  margin: 0;
  padding: 0;
  accent-color: var(--blue);
}

.analysis-metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.analysis-metric {
  padding: 14px 8px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fff;
  text-align: center;
}

.analysis-metric small {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.analysis-metric strong {
  color: var(--navy);
  font-size: 21px;
}

.analysis-metric strong span {
  font-size: 11px;
}

.analysis-metric.speed {
  grid-column: 1 / -1;
  border-color: transparent;
  background: linear-gradient(145deg, var(--navy), var(--blue));
}

.analysis-metric.speed small {
  color: #c9eadf;
}

.analysis-metric.speed strong {
  color: #fff;
  font-size: 28px;
}

.analysis-section-selector {
  position: sticky;
  top: 0;
  z-index: 2;
  display: grid;
  gap: 5px;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(243,248,245,.96);
  box-shadow: 0 4px 10px rgba(23,79,67,.06);
}

.analysis-section-selector label {
  color: var(--navy);
  font-size: 10px;
  font-weight: 900;
}

.analysis-section-select {
  min-height: 36px;
  padding: 6px 10px;
  border-color: #bfd2da;
  border-radius: 9px;
  background: #fff;
  color: var(--navy);
  font-size: 12px;
  font-weight: 900;
}

.analysis-section-content {
  display: grid;
  gap: 10px;
}

.analysis-result-list {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
}

.analysis-result-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 41px;
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}

.analysis-result-row:first-child {
  border-top: 0;
}

.analysis-result-label {
  color: var(--text);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.45;
  white-space: pre-line;
}

.analysis-result-value {
  color: var(--navy);
  font-size: 16px;
  font-weight: 900;
  text-align: right;
  white-space: nowrap;
}

/* 分析項目の説明画像 */
.analysis-result-label-wrap {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 7px;
}

.analysis-help-button {
  display: inline-grid;
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  min-height: 22px;
  padding: 0;
  place-items: center;
  border: 1px solid #8dbbab;
  border-radius: 50%;
  background: #edf6f2;
  color: var(--blue);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
}

.analysis-help-button:active {
  transform: scale(.94);
  background: #dceee7;
}

.analysis-metric-label {
  display: flex !important;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.analysis-metric-label .analysis-help-button {
  flex-basis: 20px;
  width: 20px;
  height: 20px;
  min-height: 20px;
  font-size: 13px;
}

.analysis-help-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
  background: rgba(8, 28, 24, .72);
  backdrop-filter: blur(4px);
}

.analysis-help-modal.hidden {
  display: none;
}

.analysis-help-dialog {
  position: relative;
  overflow: hidden;
  width: min(100%, 620px);
  max-height: calc(100dvh - 36px);
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
}

.analysis-help-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 49px;
  padding: 9px 10px 9px 15px;
  border-bottom: 1px solid var(--line);
}

.analysis-help-title {
  overflow: hidden;
  margin: 0;
  color: var(--navy);
  font-size: 14px;
  font-weight: 900;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.analysis-help-close {
  display: grid;
  flex: 0 0 34px;
  width: 34px;
  height: 34px;
  min-height: 34px;
  padding: 0;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: #edf3f1;
  color: var(--navy);
  font-size: 21px;
  line-height: 1;
}

.analysis-help-image-wrap {
  overflow: auto;
  max-height: calc(100dvh - 105px);
  background: #eef3f1;
}

.analysis-help-image {
  display: block;
  width: 100%;
  height: auto;
  background: #fff;
}

.analysis-help-loading,
.analysis-help-error {
  padding: 35px 18px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  text-align: center;
}

body.analysis-help-modal-open {
  overflow: hidden;
}

.analysis-comparison-head,
.analysis-comparison-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 64px 64px;
  gap: 8px;
  align-items: center;
}

.analysis-comparison-head {
  padding: 8px 12px;
  background: #edf6f2;
  color: var(--navy);
  font-size: 11px;
  font-weight: 900;
  text-align: center;
}

.analysis-comparison-row {
  min-height: 41px;
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}

.analysis-section-comment {
  padding: 10px 12px;
  border-left: 4px solid var(--aqua);
  border-radius: 10px;
  background: #edf6f2;
  color: #365f54;
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.analysis-comment-title {
  display: block;
  margin-bottom: 4px;
  color: var(--navy);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .04em;
}

.light-frame-label {
  fill: #18323f;
  font-size: 11px;
  font-weight: 800;
}
.analysis-graph-card {
  display: grid;
  gap: 9px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #fff;
}

.analysis-graph-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
}

.analysis-graph-title-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.analysis-graph-order-buttons {
  display: flex;
  gap: 4px;
}

.analysis-graph-order-button {
  display: grid;
  width: 28px;
  min-height: 28px;
  padding: 0;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f5f8fa;
  color: var(--navy);
  font-size: 13px;
  font-weight: 900;
}

.analysis-graph-order-button:disabled {
  opacity: 0.3;
  cursor: default;
}

.analysis-graph-header h4 {
  margin: 0;
  color: var(--navy);
  font-size: 14px;
}

.analysis-graph-header span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}

.analysis-graph-canvas-wrap {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 170px;
  border-radius: 12px;
  background: #f5f8fa;
}

.analysis-graph-canvas {
  display: block;
  width: 100%;
  height: 170px;
}

.analysis-joint-select {
  width: 100%;
  min-height: 42px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}

.analysis-graph-value {
  color: var(--blue);
  font-size: 12px;
  font-weight: 900;
}

.race-graph-screen {
  display: grid;
  gap: 10px;
}

.race-graph-controls {
  display: grid;
  gap: 8px;
  padding: 12px;
}

.race-graph-select-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.race-graph-select-grid .field:first-child {
  grid-column: 1 / -1;
}

.race-graph-controls select {
  min-height: 39px;
  padding: 7px 9px;
  font-size: 11px;
}

.race-graph-link-row {
  display: flex;
  justify-content: flex-end;
}

.race-analysis-link {
  width: auto;
  min-height: 32px;
  padding: 0 10px;
  font-size: 10px;
}

.race-graph-card {
  display: grid;
  gap: 7px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
}

.race-graph-card h3 {
  margin: 0;
  color: var(--navy);
  font-size: 13px;
}

.race-graph-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
}

.race-graph-legend span::before {
  display: inline-block;
  width: 14px;
  height: 3px;
  margin-right: 4px;
  border-radius: 99px;
  background: var(--blue);
  content: "";
  vertical-align: middle;
}

.race-graph-legend .comparison::before {
  background: #e8751a;
}

.race-chart-canvas {
  display: block;
  width: 100%;
  height: 190px;
  border-radius: 10px;
  background: #f7faf9;
}

.comparison-filter-card { gap: 12px; }
.comparison-filter-group { display:grid; gap:6px; }
.comparison-filter-label { color:var(--muted); font-size:11px; font-weight:900; letter-spacing:.06em; }
.comparison-segmented { display:grid; grid-template-columns:repeat(2,1fr); padding:4px; border:1px solid #cddbd6; border-radius:14px; background:#eaf1ef; }
.comparison-segmented button { min-height:40px; padding:7px 10px; border:0; border-radius:10px; background:transparent; color:#587068; font-weight:900; box-shadow:none; }
.comparison-segmented button.active { background:#fff; color:var(--green); box-shadow:0 2px 9px rgba(20,67,55,.14); }
.comparison-compact-head { margin:-4px -4px 0; padding:6px 7px 7px; border-bottom:1px solid var(--line); }
.comparison-compact-head h2 { margin:0 0 2px; font-size:16px; }
.comparison-compact-head p { margin:0; font-size:10px; line-height:1.35; }
.comparison-compact-head .secondary { min-height:31px; padding:0 9px; font-size:11px; }
.comparison-graph-card { gap:5px; padding:9px 11px 11px; }
.comparison-graph-card .analysis-graph-header { min-height:26px; }
.comparison-graph-card h4 { margin:0; font-size:12px; line-height:1.1; }
.comparison-metric-select { margin-bottom:10px; }

@media(max-width:430px) {
  .race-graph-select-grid { grid-template-columns: 1fr; }
  .race-graph-select-grid .field:first-child { grid-column: auto; }
}

      const $=(selector,root=document)=>root.querySelector(selector);
      const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
      const escapeHtml=(value)=>String(value??"").replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
      function lock(message="処理中..."){ $("#loadingText").textContent=message; $("#loading").classList.remove("hidden"); }
      function unlock(){ $("#loading").classList.add("hidden"); }
      function showError(message){ const box=$("#formError")||$("#pageError"); if(box){box.textContent=String(message||"エラーが発生しました");box.classList.add("visible");box.scrollIntoView({behavior:"smooth",block:"center"});}else alert(message); }

      async function apiPost(action,payload={}){
        const response=await fetch(CONFIG.GAS_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,idToken:STATE.idToken,payload})});
        if(!response.ok) throw new Error(`通信エラー: HTTP ${response.status}`);
        const data=await response.json();
        if(!data.success) throw new Error(data.message||"処理に失敗しました");
        return data;
      }

      async function startApp(){
        lock("LINEに接続中...");
        try{
          await liff.init({liffId:CONFIG.LIFF_ID});
          if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
          STATE.idToken=liff.getIDToken();
          if(!STATE.idToken) throw new Error("LINE認証情報を取得できません。LIFFのScopeでopenidを確認してください");
          STATE.profile=await liff.getProfile();
          lock("登録情報を確認中...");
          STATE.data=await apiPost("bootstrap");
          if(STATE.data.registered){renderHome();handleFriendInviteFromUrl_();}else{renderRegistration();}
        }catch(error){console.error(error);renderFatal(error.message||"アプリを起動できませんでした");}
        finally{unlock();}
      }

      function renderFatal(message){
        $("#screen").innerHTML=`<section class="card stack"><div><h2>起動できませんでした</h2><p class="muted">設定または通信状況を確認してください</p></div><div id="pageError" class="error visible">${escapeHtml(message)}</div><button class="primary" onclick="location.reload()">もう一度試す</button></section>`;
      }

      function renderRegistration(){
        const displayName=STATE.profile?.displayName||STATE.data?.profile?.displayName||"";
        $("#screen").innerHTML=`
          <div class="stack">
            <section class="card hero"><small>FIRST REGISTRATION</small><h2>最初に利用者情報を登録します</h2><p>登録内容は後から変更できます。指導者は選手を登録せずに開始できます。</p></section>
            <form id="registrationForm" class="stack" novalidate>
              <section class="card stack">
                <div class="section-title"><div><h2>申込者情報</h2><p>このLINEアカウントを利用する方</p></div></div>
                <div class="field"><label class="required" for="applicantName">申込者名</label><input id="applicantName" maxlength="80" autocomplete="name" value="${escapeHtml(displayName)}"></div>
                <div class="field"><label class="required">申込者区分</label><div class="choice-row">
                  ${["本人","保護者","指導者"].map((type,index)=>`<label class="choice"><input type="radio" name="applicantType" value="${type}" ${index===0?"checked":""}><span>${type}</span></label>`).join("")}
                </div></div>
                <div class="grid-2">
                  <div class="field"><label for="guardianName">保護者名（任意）</label><input id="guardianName" maxlength="80"></div>
                  <div class="field"><label for="role">役職（任意）</label><input id="role" maxlength="80" placeholder="例：監督、コーチ"></div>
                </div>
              </section>

              <section class="card stack">
                <div class="section-title"><div><h2>選手情報</h2><p>複数人登録できます</p></div><button id="addAthleteButton" class="secondary" style="width:auto;min-height:38px;padding:0 12px" type="button">＋追加</button></div>
                <div id="athleteList" class="stack"></div>
                <p id="coachNote" class="notice hidden">指導者は選手を登録せずに開始できます。選手は後から追加または招待できます。</p>
              </section>

              <section class="card stack">
                <div class="notice">現在はテスト構築中です。利用規約とプライバシーポリシーの本文は、正式公開前に追加します。</div>
                <div id="formError" class="error"></div>
                <button id="submitButton" class="primary" type="submit">登録して開始する</button>
              </section>
            </form>
          </div>`;
        addAthleteRow({name:displayName});
        $("#addAthleteButton").addEventListener("click",()=>addAthleteRow());
        $$('input[name="applicantType"]').forEach((input)=>input.addEventListener("change",handleApplicantType));
        $("#applicantName").addEventListener("input",()=>{if(getApplicantType()==="本人"&&$$('.athlete-card').length===1){$('.athlete-name').value=$("#applicantName").value;}});
        $("#registrationForm").addEventListener("submit",submitRegistration);

      function getApplicantType(){return $('input[name="applicantType"]:checked')?.value||"";}

        const type=getApplicantType();
        $("#coachNote").classList.toggle("hidden",type!=="指導者");

      }

      async function loadHomeTaskSummary() {
        const card = $("#homeTaskCard");
        if (!card) return;

        try {
          const result = await apiPost("getApplications");
          const applications = result.applications || [];
          const actionable = applications
            .map((application) => ({
              application,
              progressIndex: getApplicationProgressIndex(application),
            }))
            .filter((item) => item.progressIndex < 5)
            .sort((a, b) => {
              const priority = (item) => {
                const statuses = (item.application.athletes || [])
                  .map((athlete) => athlete.status || "")
                  .join(" ");
                if (/動画提出待ち|未提出|動画待ち/.test(statuses)) return 0;
                if (item.progressIndex === 3) return 1;
                return 2;
              };
              return priority(a) - priority(b);
            })[0];

          if (!actionable) {
            card.innerHTML = `
              <strong>現在、対応が必要な申し込みはありません</strong>
              <p>新しい案内がある場合は、ここに優先表示します。</p>
            `;
            return;
          }

          const application = actionable.application;
          card.innerHTML = `
            <strong>${escapeHtml(getApplicationNextAction(application, actionable.progressIndex))}</strong>
            <p>${escapeHtml(application.phase)}｜${escapeHtml(application.productName)}コース・${escapeHtml(application.applicationId)}</p>
            <button class="secondary" style="margin-top:10px;min-height:40px" type="button">申し込み状況を確認</button>
          `;
          $("button", card)?.addEventListener("click", openApplications);
        } catch (error) {
          console.error("ホームの進捗確認に失敗しました", error);
          card.innerHTML = `
            <strong>申し込み状況を取得できませんでした</strong>
            <p>「申し込み状況」から、もう一度確認してください。</p>
          `;
        }
      }

          console.error(error);
          showError(error.message);

          unlock();

      function renderTeamComparison_(){const data=STATE.teamComparison||{},dates=data.dates||[],records=(data.records||[]).filter(r=>r.phase===STATE.teamPhase);const labels=[];const seen=new Set();records.forEach(r=>(r.items||[]).forEach(i=>{if(!seen.has(i.label)){seen.add(i.label);labels.push(i.label);}}));$("#screen").innerHTML=`<div class="stack"><section class="card stack"><div class="section-title"><div><h2>チーム比較</h2><p>ファイル名の日付が同じPro分析</p></div><button class="secondary" style="width:auto;min-height:38px;padding:0 12px" onclick="renderTeamDashboard()">戻る</button></div><div class="field"><label>分析日</label><select onchange="openTeamComparison_(this.value)">${dates.map(d=>`<option value="${d}" ${d===data.selectedDate?"selected":""}>${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6,8)}</option>`).join("")}</select></div><div class="team-compare-toolbar"><select onchange="STATE.teamPhase=this.value;renderTeamComparison_()"><option ${STATE.teamPhase==="最高速"?"selected":""}>最高速</option><option ${STATE.teamPhase==="スタート"?"selected":""}>スタート</option></select><select onchange="STATE.teamSort=this.value;renderTeamComparison_()"><option value="desc" ${STATE.teamSort==="desc"?"selected":""}>数値が高い順</option><option value="asc" ${STATE.teamSort==="asc"?"selected":""}>数値が低い順</option></select></div><button class="secondary" onclick="openTeamComparison_('${escapeHtml(data.selectedDate||"")}',true)">集計を更新</button></section>${labels.length?labels.map(label=>renderTeamMetricChart_(label,records)).join(""):'<section class="card"><p class="muted">${escapeHtml(data.selectedDate||"指定日")}・${escapeHtml(STATE.teamPhase)}の比較データはありません。ファイル名がYYYYMMDDで始まるPro分析を確認してください。</p></section>'}</div>`;}

      function calculateClientPrice(){const product=selectedProduct(),athletes=selectedAthletes(),type=$('input[name="applicationType"]:checked')?.value||"個人";if(!product)return null;const groupApplied=type==="団体"&&product.groupDiscountEnabled&&athletes.length>=product.groupMinimum;const groupTotal=groupApplied?product.groupDiscount*athletes.length:0;const campaignTotal=product.campaignEnabled?Math.max(0,product.normalPrice-product.price)*athletes.length:0;const visitFeePerAthlete=product.deliveryMethod==="Visit"?(athletes.length>=20?product.visitFee20Plus:athletes.length>=10?product.visitFee10To19:product.visitFee1To9):0;const visitFeeTotal=visitFeePerAthlete*athletes.length;return{product,count:athletes.length,groupApplied,groupTotal,campaignTotal,visitFeePerAthlete,visitFeeTotal,total:Math.max(0,product.price*athletes.length-groupTotal+visitFeeTotal)};}

function drawRaceLineChart_(canvas, mainSeries, comparisonSeries, unit) {
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  const context = canvas.getContext("2d");
  context.setTransform(ratio, 0, 0, ratio, 0, 0);

  const width = rect.width;
  const height = rect.height;
  const padding = { left: 38, right: 12, top: 13, bottom: 30 };
  context.clearRect(0, 0, width, height);
  context.fillStyle = "#f7faf9";
  context.fillRect(0, 0, width, height);

  const labels = Array.from(new Set([
    ...mainSeries.map((item) => item.label),
    ...comparisonSeries.map((item) => item.label),
  ]));
  const allValues = [...mainSeries, ...comparisonSeries]
    .map((item) => Number(item.value))
    .filter(Number.isFinite);
  if (!labels.length || !allValues.length) return;

  let minValue = Math.min(...allValues);
  let maxValue = Math.max(...allValues);
  const span = Math.max(0.1, maxValue - minValue);
  minValue = Math.max(0, minValue - span * 0.15);
  maxValue += span * 0.15;
  if (maxValue === minValue) maxValue = minValue + 1;

  const plotWidth = width - padding.left - padding.right;
  const plotHeight = height - padding.top - padding.bottom;
  const xAt = (index) => padding.left + (labels.length === 1 ? plotWidth / 2 : index * plotWidth / (labels.length - 1));
  const yAt = (value) => padding.top + (maxValue - value) * plotHeight / (maxValue - minValue);

  context.font = "9px sans-serif";
  context.textBaseline = "middle";
  for (let tick = 0; tick <= 4; tick += 1) {
    const value = minValue + (maxValue - minValue) * tick / 4;
    const y = yAt(value);
    context.beginPath();
    context.moveTo(padding.left, y);
    context.lineTo(width - padding.right, y);
    context.strokeStyle = "#dce8e4";
    context.lineWidth = 1;
    context.stroke();
    context.fillStyle = "#637b74";
    context.textAlign = "right";
    context.fillText(`${value.toFixed(2)}${tick === 4 && unit ? ` ${unit}` : ""}`, padding.left - 5, y);
  }

  labels.forEach((label, index) => {
    context.fillStyle = "#637b74";
    context.textAlign = "center";
    context.textBaseline = "top";
    context.fillText(label, xAt(index), height - padding.bottom + 8);
  });

  const drawSeries = (series, color) => {
    const valueMap = new Map(series.map((item) => [item.label, Number(item.value)]));
    context.beginPath();
    let started = false;
    labels.forEach((label, index) => {
      const value = valueMap.get(label);
      if (!Number.isFinite(value)) return;
      const x = xAt(index);
      const y = yAt(value);
      if (started) context.lineTo(x, y);
      else { context.moveTo(x, y); started = true; }
    });
    context.strokeStyle = color;
    context.lineWidth = 2.2;
    context.lineJoin = "round";
    context.stroke();

    labels.forEach((label, index) => {
      const value = valueMap.get(label);
      if (!Number.isFinite(value)) return;
      context.beginPath();
      context.arc(xAt(index), yAt(value), 3.2, 0, Math.PI * 2);
      context.fillStyle = "#fff";
      context.fill();
      context.strokeStyle = color;
      context.lineWidth = 2;
      context.stroke();
    });
  };

  drawSeries(mainSeries, "#246b58");
  if (comparisonSeries.length) drawSeries(comparisonSeries, "#e8751a");
}

function renderAnalysisSections(sections, fallbackMetrics) {
  if (!Array.isArray(sections) || !sections.length) {

  const activeKey = ANALYSIS_VIEW_STATE.activeMetricSection || sections[0].key;
  const activeSection = sections.find((section) => section.key === activeKey) || sections[0];

  return `
    <div class="analysis-section-selector">
      <label for="analysisSectionSelect">表示する項目</label>
      <select id="analysisSectionSelect" class="analysis-section-select">

          >
            ${escapeHtml(section.title)}
          </option>
        `).join("")}
      </select>
    </div>

    <div id="analysisSectionContent" class="analysis-section-content">
      ${renderAnalysisSectionContent(activeSection)}
    </div>
  `;
}

function renderAnalysisSectionContent(section) {
  const items = Array.isArray(section?.items) ? section.items : [];
  const rows = section?.comparison
    ? `
        <div class="analysis-result-list">
          <div class="analysis-comparison-head">
            <span></span><span>右</span><span>左</span>
          </div>
          ${items.map((item) => `
            <div class="analysis-comparison-row">
              ${renderAnalysisResultLabel(item.label)}
              <span class="analysis-result-value">${escapeHtml(item.right || "-")}</span>
              <span class="analysis-result-value">${escapeHtml(item.left || "-")}</span>
            </div>
          `).join("")}
        </div>
      `
    : `
        <div class="analysis-result-list">
          ${items.map((item) => `
            <div class="analysis-result-row">
              ${renderAnalysisResultLabel(item.label)}
              <span class="analysis-result-value">${escapeHtml(item.value || "-")}</span>
            </div>
          `).join("")}
        </div>
      `;

  return `
    ${rows}
    ${section?.comment ? `
      <div class="analysis-section-comment"><strong class="analysis-comment-title">コメント</strong>${escapeHtml(section.comment)}</div>
    ` : ""}
  `;
}

function renderAnalysisResultLabel(label) {
  const safeLabel = String(label || "");

  return `

function getAnalysisHelpImageUrl(label) {
  const fileName = `${analysisHelpFileName(label)}.png`;
  const baseUrl = String(CONFIG.HELP_IMAGE_BASE_URL || "").replace(/\/+$/, "") + "/";
  return `${baseUrl}${encodeURIComponent(fileName)}?v=${encodeURIComponent(CONFIG.HELP_IMAGE_VERSION || "1")}`;
}

function openAnalysisHelpFromButton(button) {
  const encodedLabel = button?.dataset?.analysisHelpLabel || "";
  let label = "";

  try {
    label = decodeURIComponent(encodedLabel);
  } catch (error) {
    label = encodedLabel;
  }

  openAnalysisHelp(label);
}

function openAnalysisHelp(label) {
  const modal = $("#analysisHelpModal");
  const title = $("#analysisHelpTitle");
  const imageWrap = $("#analysisHelpImageWrap");
  if (!modal || !title || !imageWrap) return;

  const safeLabel = String(label || "項目の説明");
  const imageUrl = getAnalysisHelpImageUrl(safeLabel);
  title.textContent = safeLabel;
  imageWrap.innerHTML = `<div class="analysis-help-loading">説明画像を読み込み中...</div>`;

  const image = new Image();
  image.className = "analysis-help-image";
  image.alt = `${safeLabel}の説明`;
  image.onload = () => {
    imageWrap.innerHTML = "";
    imageWrap.appendChild(image);
  };
  image.onerror = () => handleAnalysisHelpImageError(safeLabel);
  image.src = imageUrl;

  modal.classList.remove("hidden");
  document.body.classList.add("analysis-help-modal-open");
}

function closeAnalysisHelp() {
  const modal = $("#analysisHelpModal");
  const imageWrap = $("#analysisHelpImageWrap");
  if (modal) modal.classList.add("hidden");
  if (imageWrap) imageWrap.innerHTML = "";
  document.body.classList.remove("analysis-help-modal-open");
}

function handleAnalysisHelpBackdrop(event) {
  if (event.target?.id === "analysisHelpModal") closeAnalysisHelp();
}

function handleAnalysisHelpImageError(label) {
  const imageWrap = $("#analysisHelpImageWrap");
  if (!imageWrap) return;

  const expectedName = `${analysisHelpFileName(label)}.png`;
  imageWrap.innerHTML = `
    <div class="analysis-help-error">
      説明画像を読み込めませんでした<br>
      GitHubに「${escapeHtml(expectedName)}」があるか確認してください
    </div>
  `;
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeAnalysisHelp();
});

function selectAnalysisMetricSection(sectionKey) {
  const sections = ANALYSIS_VIEW_STATE.data?.displaySections || [];
  const section = sections.find((item) => item.key === sectionKey);
  if (!section) return;

  ANALYSIS_VIEW_STATE.activeMetricSection = section.key;

  const select = $("#analysisSectionSelect");
  if (select && select.value !== section.key) select.value = section.key;

  const content = $("#analysisSectionContent");
  if (content) content.innerHTML = renderAnalysisSectionContent(section);
}

function analysisMetricHtml(
  label,
  value,
  unit,
  digits,
  emphasized = false,
) {
  return `
    <div
      class="analysis-metric ${
        emphasized ? "speed" : ""
      }"
    >
      <small class="analysis-metric-label">
        <button
          class="analysis-help-button"
          type="button"
          data-analysis-help-label="${escapeHtml(encodeURIComponent(label))}"
          aria-label="${escapeHtml(label)}の説明を見る"
          title="${escapeHtml(label)}の説明を見る"
          onclick="openAnalysisHelpFromButton(this)"
        >i</button>
        <span>${escapeHtml(label)}</span>
      </small>

      <strong>
        ${formatAnalysisValue(
          value,
          digits,
        )}

        <span>
          ${escapeHtml(unit)}
        </span>
      </strong>
    </div>
  `;
}

function bindAnalysisViewerEvents() {
  $$("[data-analysis-tab]").forEach(
    (button) => {
      button.addEventListener(
        "click",
        () =>
          selectAnalysisTab(
            button.dataset.analysisTab,
          ),
      );
    },
  );

  const scaleRange =
    $("#analysisScaleRange");

  if (scaleRange) {
    scaleRange.addEventListener(
      "input",
      () => {
        ANALYSIS_VIEW_STATE.scale =
          Number(scaleRange.value);

        $("#analysisScaleValue")
          .textContent =
            `${scaleRange.value}%`;

        drawCurrentAnalysisView();
      },
    );
  }

  const speedRange =
    $("#analysisSpeedRange");

  if (speedRange) {
    speedRange.addEventListener(
      "input",
      () => {
        ANALYSIS_VIEW_STATE.speed =
          Number(speedRange.value);

        $("#analysisSpeedValue")
          .textContent =
            `${Number(
              speedRange.value,
            ).toFixed(2)}倍`;

        if (
          ANALYSIS_VIEW_STATE.playing
        ) {
          stopAnalysisPlayback();
          startAnalysisPlayback();
        }
      },
    );
  }

  const jointSelect =
    $("#analysisJointSelect");

  if (jointSelect) {
    jointSelect.addEventListener(
      "change",
      () => {
        ANALYSIS_VIEW_STATE
          .selectedJoint =
            Number(
              jointSelect.value,
            ) || 0;

        drawAnalysisGraphs();
        drawCurrentAnalysisView();
      },
    );
  }

  bindAnalysisToggle_("analysisCenterToggle", "showCenterOfMass");
  bindAnalysisToggle_("analysisToeToggle", "showToeTrajectory");
  bindAnalysisToggle_("analysisJointToggle", "showJointHighlight");

  $$('[data-graph-move]').forEach((button) => {
    button.addEventListener("click", () => {
      const card = button.closest('[data-analysis-graph]');
      if (!card) return;
      moveAnalysisGraph_(
        card.dataset.analysisGraph,
        button.dataset.graphMove,
      );
    });
  });

  const sectionSelect = $("#analysisSectionSelect");
  if (sectionSelect) {
    sectionSelect.addEventListener("change", () => {
      selectAnalysisMetricSection(sectionSelect.value);
    });
  }

  applyAnalysisGraphOrder_();
}

function moveAnalysisGraph_(graphKey, direction) {
  const order = [...ANALYSIS_VIEW_STATE.graphOrder];
  const currentIndex = order.indexOf(graphKey);
  const nextIndex = direction === "up"
    ? currentIndex - 1
    : currentIndex + 1;

  if (
    currentIndex < 0 ||
    nextIndex < 0 ||
    nextIndex >= order.length
  ) return;

  [order[currentIndex], order[nextIndex]] =
    [order[nextIndex], order[currentIndex]];

  ANALYSIS_VIEW_STATE.graphOrder = order;
  applyAnalysisGraphOrder_();
  resizeAnalysisGraphCanvases();
  drawAnalysisGraphs();
}

function applyAnalysisGraphOrder_() {
  const container = document.getElementById("analysisGraphCards");
  if (!container) return;

  ANALYSIS_VIEW_STATE.graphOrder.forEach((graphKey) => {
    const card = container.querySelector(
      `[data-analysis-graph="${graphKey}"]`,
    );
    if (card) container.appendChild(card);
  });

  const cards = Array.from(
    container.querySelectorAll('[data-analysis-graph]'),
  );
  cards.forEach((card, index) => {
    const up = card.querySelector('[data-graph-move="up"]');
    const down = card.querySelector('[data-graph-move="down"]');
    if (up) up.disabled = index === 0;
    if (down) down.disabled = index === cards.length - 1;
  });
}

function bindAnalysisToggle_(elementId, stateKey) {
  const element = document.getElementById(elementId);
  if (!element) return;

  element.addEventListener("change", () => {
    ANALYSIS_VIEW_STATE[stateKey] = element.checked;
    drawCurrentAnalysisView();
  });
}

function selectAnalysisTab(tabName) {
  ANALYSIS_VIEW_STATE.activeTab =
    tabName;

  $$("[data-analysis-tab]").forEach(
    (button) => {
      button.classList.toggle(
        "active",
        button.dataset.analysisTab ===
          tabName,
      );
    },
  );

  $$(".analysis-tab-panel").forEach(
    (panel) =>
      panel.classList.remove("active"),
  );

  const panels = {
    controls: "#analysisTabControls",
    metrics: "#analysisTabMetrics",
    graphs: "#analysisTabGraphs",
  };

  const target =
    $(panels[tabName]);

  if (target) {
    target.classList.add("active");
  }

  if (tabName === "graphs") {
    window.requestAnimationFrame(
      () => {
        resizeAnalysisGraphCanvases();
        drawAnalysisGraphs();
      },
    );
  }
}

function toggleAnalysisPlayback() {
  if (ANALYSIS_VIEW_STATE.playing) {
    stopAnalysisPlayback();
  } else {
    startAnalysisPlayback();
  }
}

function startAnalysisPlayback() {
  const data =
    ANALYSIS_VIEW_STATE.data;

  if (
    !data ||
    !Array.isArray(data.frames) ||
    !data.frames.length
  ) {
    return;
  }

  ANALYSIS_VIEW_STATE.playing = true;

  const button =
    $("#analysisPlayButton");

  if (button) {
    button.textContent = "停止";
  }

  scheduleNextAnalysisFrame();
}

function scheduleNextAnalysisFrame() {
  if (!ANALYSIS_VIEW_STATE.playing) {
    return;
  }

  const fps =
    Number(
      ANALYSIS_VIEW_STATE.data?.fps,
    ) || 30;

  const speed =
    ANALYSIS_VIEW_STATE.speed || 1;

  const delay =
    Math.max(
      4,
      1000 / fps / speed,
    );

  ANALYSIS_VIEW_STATE.timerId =
    window.setTimeout(
      () => {
        const frames =
          ANALYSIS_VIEW_STATE.data
            .frames;

        ANALYSIS_VIEW_STATE.currentFrame =
          (
            ANALYSIS_VIEW_STATE
              .currentFrame + 1
          ) % frames.length;

        drawCurrentAnalysisView();
        scheduleNextAnalysisFrame();
      },
      delay,
    );
}

function stopAnalysisPlayback() {
  ANALYSIS_VIEW_STATE.playing = false;

  if (
    ANALYSIS_VIEW_STATE.timerId
  ) {
    clearTimeout(
      ANALYSIS_VIEW_STATE.timerId,
    );

    ANALYSIS_VIEW_STATE.timerId =
      null;
  }

  const button =
    $("#analysisPlayButton");

  if (button) {
    button.textContent = "再生";
  }
}

function previousAnalysisFrame() {
  stopAnalysisPlayback();

  const frames =
    ANALYSIS_VIEW_STATE.data
      ?.frames || [];

  if (!frames.length) {
    return;
  }

  ANALYSIS_VIEW_STATE.currentFrame =
    (
      ANALYSIS_VIEW_STATE
        .currentFrame -
      1 +
      frames.length
    ) % frames.length;

  drawCurrentAnalysisView();
}

function nextAnalysisFrame() {
  stopAnalysisPlayback();

  const frames =
    ANALYSIS_VIEW_STATE.data
      ?.frames || [];

  if (!frames.length) {
    return;
  }

  ANALYSIS_VIEW_STATE.currentFrame =
    (
      ANALYSIS_VIEW_STATE
        .currentFrame + 1
    ) % frames.length;

  drawCurrentAnalysisView();
}

function resetAnalysisView() {
  stopAnalysisPlayback();

  ANALYSIS_VIEW_STATE.currentFrame = 0;
  ANALYSIS_VIEW_STATE.speed = 1;
  ANALYSIS_VIEW_STATE.scale = 100;

  const scale =
    $("#analysisScaleRange");

  const speed =
    $("#analysisSpeedRange");

  if (scale) {
    scale.value = "100";
  }

  if (speed) {
    speed.value = "1";
  }

  const scaleValue =
    $("#analysisScaleValue");

  const speedValue =
    $("#analysisSpeedValue");

  if (scaleValue) {
    scaleValue.textContent = "100%";
  }

  if (speedValue) {
    speedValue.textContent =
      "1.00倍";
  }

  drawCurrentAnalysisView();
}

function leaveAnalysisDetail() {
  stopAnalysisPlayback();
  document.body.classList.remove("analysis-detail-mode");

  window.removeEventListener(
    "resize",
    handleAnalysisResize,
  );

  openAnalysisResults();
}

function handleAnalysisResize() {
  resizeAnalysisCanvas();
  drawCurrentAnalysisView();

  if (
    ANALYSIS_VIEW_STATE.activeTab ===
    "graphs"
  ) {
    resizeAnalysisGraphCanvases();
    drawAnalysisGraphs();
  }
}   

function resizeAnalysisCanvas() {
  const canvas =
    $("#analysisCanvas");

  if (!canvas) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(
      1,
      Math.round(
        rect.width * ratio,
      ),
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        rect.height * ratio,
      ),
    );

  const context =
    canvas.getContext("2d");

  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0,
  );
}

function drawCurrentAnalysisView() {
  const canvas =
    $("#analysisCanvas");

  const data =
    ANALYSIS_VIEW_STATE.data;

  if (!canvas || !data) {
    return;
  }

  const context =
    canvas.getContext("2d");

  const width =
    canvas.getBoundingClientRect()
      .width;

  const height =
    canvas.getBoundingClientRect()
      .height;

  context.clearRect(
    0,
    0,
    width,
    height,
  );

  context.fillStyle = "#eef3f6";

  context.fillRect(
    0,
    0,
    width,
    height,
  );

  drawAnalysisWatermark_(
    context,
    width,
    height,
  );

  const isLight =
    String(data.plan || "")
      .toLowerCase() === "light";

  if (isLight) {
    drawLightAnalysis(
      context,
      width,
      height,
      data,
    );
  } else {
    drawProAnalysis(
      context,
      width,
      height,
      data,
    );
  }

  if (
    ANALYSIS_VIEW_STATE.activeTab ===
    "graphs"
  ) {
    drawAnalysisGraphs();
  }
}

function drawAnalysisWatermark_(context, width, height) {
  if (!ANALYSIS_WATERMARK_IMAGE.complete || !ANALYSIS_WATERMARK_IMAGE.naturalWidth) {
    return;
  }

  const maxWidth = width * 0.48;
  const maxHeight = height * 0.62;
  const imageRatio =
    ANALYSIS_WATERMARK_IMAGE.naturalWidth /
    ANALYSIS_WATERMARK_IMAGE.naturalHeight;

  let drawWidth = maxWidth;
  let drawHeight = drawWidth / imageRatio;

  if (drawHeight > maxHeight) {
    drawHeight = maxHeight;
    drawWidth = drawHeight * imageRatio;
  }

  context.save();
  context.globalAlpha = 0.075;
  context.drawImage(
    ANALYSIS_WATERMARK_IMAGE,
    (width - drawWidth) / 2,
    (height - drawHeight) / 2,
    drawWidth,
    drawHeight,
  );
  context.restore();
}

function drawProAnalysis(
  context,
  width,
  height,
  data,
) {
  const frames =
    data.frames || [];

  const frame =
    frames[
      ANALYSIS_VIEW_STATE.currentFrame
    ];

  if (!frame) {
    drawNoAnalysisData(
      context,
      width,
      height,
    );

    return;
  }

  const convertPoint = drawStickFrame(
    context,
    frame.points,
    {
      left: 24,
      top: 10,
      width: width - 48,
      height: height - 22,
      scale:
        ANALYSIS_VIEW_STATE.scale /
        100,
      referenceFrames: frames.map((item) => item.points),
    },
  );

  if (convertPoint) {
    drawAnalysisAuxiliary_(
      context,
      data,
      ANALYSIS_VIEW_STATE.currentFrame,
      convertPoint,
      true,
    );
  }

  const overlay =
    $("#analysisOverlay");

  if (overlay) {
    overlay.textContent =
      `Frame ${frame.frame} / ` +
      `${data.frameCount}　` +
      `${Number(
        frame.time || 0,
      ).toFixed(3)}秒`;
  }
}

function drawLightAnalysis(
  context,
  width,
  height,
  data,
) {
  const frames =
    data.frames || [];

  let lightFrames =
    Array.isArray(data.lightFrames)
      ? [...data.lightFrames]
      : [];

  if (
    String(data.direction || "") ===
    "左"
  ) {
    lightFrames.reverse();
  }

  if (!lightFrames.length) {
    drawNoAnalysisData(
      context,
      width,
      height,
    );

    return;
  }

  const gap = 5;

  const itemWidth =
    (
      width -
      gap * (
        lightFrames.length + 1
      )
    ) / lightFrames.length;

  lightFrames.forEach(
    (item, index) => {
      const frame =
        frames[item.frame - 1];

      if (!frame) {
        return;
      }

      const left =
        gap +
        index *
          (itemWidth + gap);

      const convertPoint = drawStickFrame(
        context,
        frame.points,
        {
          left: left + 2,
          top: 27,
          width: itemWidth - 4,
          height: height - 34,
          scale: 1,
          referenceFrames: frames.map((item) => item.points),
        },
      );

      if (convertPoint) {
        drawAnalysisAuxiliary_(
          context,
          data,
          item.frame - 1,
          convertPoint,
          false,
        );
      }

      context.fillStyle =
        "#18323f";

      context.font =
        "800 9px sans-serif";

      context.textAlign =
        "center";

      context.fillText(
        item.label,
        left + itemWidth / 2,
        20,
      );
    },
  );

  const overlay =
    $("#analysisOverlay");

  if (overlay) {
    overlay.textContent =
      `${lightFrames.length}局面`;
  }
}

function drawStickFrame(
  context,
  points,
  area,
) {
  const validPoints =
    (points || []).filter(
      (point) =>
        point &&
        Number.isFinite(point.x) &&
        Number.isFinite(point.y),
    );

  if (!validPoints.length) {
    return null;
  }

  const hipCenter = getGreaterTrochanterCenter_(points);
  if (!hipCenter) return null;

  const referenceBounds = getHipRelativeBounds_(
    area.referenceFrames || [points],
  );

  const rangeX = Math.max(
    0.001,
    referenceBounds.maxX - referenceBounds.minX,
  );

  const rangeY = Math.max(
    0.001,
    referenceBounds.maxY - referenceBounds.minY,
  );

  const baseScale =
    Math.min(
      area.width / rangeX,
      area.height / rangeY,
    ) * 0.72;

  const scale =
    baseScale *
    (area.scale || 1);

  const centerX =
    area.left +
    area.width / 2 -
    (referenceBounds.minX + referenceBounds.maxX) / 2 * scale;

  const centerY =
    area.top +
    area.height / 2 +
    (referenceBounds.minY + referenceBounds.maxY) / 2 * scale;

  const convertPoint =
    (point) => ({
      x:
        centerX +
        (
          point.x -
          hipCenter.x
        ) *
          scale,

      y:
        centerY -
        (point.y - hipCenter.y) * scale,
    });

  const comparisonColor = area.stickColor || "";
  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.center,
    comparisonColor || "#263238",
    convertPoint,
  );

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.right,
    comparisonColor || "#1565c0",
    convertPoint,
  );

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.left,
    comparisonColor || "#e53935",
    convertPoint,
  );

  points.forEach(
    (point, index) => {
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y)
      ) {
        return;
      }

      const converted =
        convertPoint(point);

      context.beginPath();

      context.arc(
        converted.x,
        converted.y,
        2.7,
        0,
        Math.PI * 2,
      );

      context.fillStyle = comparisonColor || getStickPointColor(index);

      context.fill();
    },
  );

  return convertPoint;
}

function getGreaterTrochanterCenter_(points) {
  const right = points?.[13];
  const left = points?.[19];
  const isValid = (point) =>
    point &&
    Number.isFinite(point.x) &&
    Number.isFinite(point.y);

  if (isValid(right) && isValid(left)) {
    return {
      x: (right.x + left.x) / 2,
      y: (right.y + left.y) / 2,
    };
  }
  if (isValid(right)) return { x: right.x, y: right.y };
  if (isValid(left)) return { x: left.x, y: left.y };
  return null;
}

function getHipRelativeBounds_(referenceFrames) {
  const relativePoints = [];

  (referenceFrames || []).forEach((framePoints) => {
    const hipCenter = getGreaterTrochanterCenter_(framePoints);
    if (!hipCenter) return;

    (framePoints || []).forEach((point) => {
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y)
      ) return;

      relativePoints.push({
        x: point.x - hipCenter.x,
        y: point.y - hipCenter.y,
      });
    });
  });

  if (!relativePoints.length) {
    return { minX: -1, maxX: 1, minY: -1, maxY: 1 };
  }

  return {
    minX: Math.min(...relativePoints.map((point) => point.x)),
    maxX: Math.max(...relativePoints.map((point) => point.x)),
    minY: Math.min(...relativePoints.map((point) => point.y)),
    maxY: Math.max(...relativePoints.map((point) => point.y)),
  };
}

function drawAnalysisAuxiliary_(
  context,
  data,
  frameIndex,
  convertPoint,
  allowTrajectory,
) {
  if (
    allowTrajectory &&
    ANALYSIS_VIEW_STATE.showToeTrajectory
  ) {
    drawToeTrajectory_(context, data, frameIndex, convertPoint);
  }

  if (ANALYSIS_VIEW_STATE.showCenterOfMass) {
    drawCenterOfMassPoint_(context, data, frameIndex, convertPoint);
  }

  if (ANALYSIS_VIEW_STATE.showJointHighlight) {
    drawSelectedJointHighlight_(context, data, frameIndex, convertPoint);
  }
}

function drawToeTrajectory_(context, data, frameIndex, convertPoint) {
  const firstFoot = String(data.firstFoot || "右");
  const pointIndex = firstFoot === "左" ? 14 : 8;
  const color = firstFoot === "左" ? "rgba(229,57,53,.38)" : "rgba(21,101,192,.38)";
  const currentPoints = data.frames?.[frameIndex]?.points;
  const currentHipCenter = getGreaterTrochanterCenter_(currentPoints);
  if (!currentHipCenter) return;

  let started = false;

  context.beginPath();
  (data.frames || []).forEach((frame) => {
    const point = frame.points?.[pointIndex];
    const frameHipCenter = getGreaterTrochanterCenter_(frame.points);
    if (
      !point ||
      !Number.isFinite(point.x) ||
      !Number.isFinite(point.y) ||
      !frameHipCenter
    ) {
      started = false;
      return;
    }

    const hipRelativePoint = {
      x: currentHipCenter.x + point.x - frameHipCenter.x,
      y: currentHipCenter.y + point.y - frameHipCenter.y,
    };
    const converted = convertPoint(hipRelativePoint);
    if (started) context.lineTo(converted.x, converted.y);
    else {
      context.moveTo(converted.x, converted.y);
      started = true;
    }
  });

  context.strokeStyle = color;
  context.lineWidth = 1.5;
  context.lineCap = "round";
  context.lineJoin = "round";
  context.stroke();
}

function drawCenterOfMassPoint_(context, data, frameIndex, convertPoint) {
  const point = data.centerOfMass?.[frameIndex];
  if (!point || !Number.isFinite(Number(point.x)) || !Number.isFinite(Number(point.y))) return;

  const converted = convertPoint({ x: Number(point.x), y: Number(point.y) });
  context.beginPath();
  context.arc(converted.x, converted.y, 5, 0, Math.PI * 2);
  context.fillStyle = "#f6c344";
  context.fill();
  context.strokeStyle = "#7a5a00";
  context.lineWidth = 1.5;
  context.stroke();
}

function drawSelectedJointHighlight_(context, data, frameIndex, convertPoint) {
  const jointPointIndexes = [2, 3, 6, 7, 13, 12, 11, 19, 18, 17];
  const pointIndex = jointPointIndexes[ANALYSIS_VIEW_STATE.selectedJoint];
  const point = data.frames?.[frameIndex]?.points?.[pointIndex];
  if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;

  const converted = convertPoint(point);
  const color = getJointGraphColor(ANALYSIS_VIEW_STATE.selectedJoint);
  context.beginPath();
  context.arc(converted.x, converted.y, 8, 0, Math.PI * 2);
  context.strokeStyle = color;
  context.lineWidth = 2.5;
  context.stroke();
}

function drawStickConnections(
  context,
  points,
  connections,
  color,
  convertPoint,
) {
  context.strokeStyle = color;
  context.lineWidth = 2.3;
  context.lineCap = "round";
  context.lineJoin = "round";

  connections.forEach(
    ([startIndex, endIndex]) => {
      const start =
        points[startIndex];

      const end =
        points[endIndex];

      if (
        !start ||
        !end ||
        !Number.isFinite(start.x) ||
        !Number.isFinite(start.y) ||
        !Number.isFinite(end.x) ||
        !Number.isFinite(end.y)
      ) {
        return;
      }

      const convertedStart =
        convertPoint(start);

      const convertedEnd =
        convertPoint(end);

      context.beginPath();

      context.moveTo(
        convertedStart.x,
        convertedStart.y,
      );

      context.lineTo(
        convertedEnd.x,
        convertedEnd.y,
      );

      context.stroke();
    },
  );
}

function getStickPointColor(index) {
  if (
    [0, 1, 2, 3, 8, 9, 10, 11, 12, 13]
      .includes(index)
  ) {
    return "#1565c0";
  }

  if (
    [4, 5, 6, 7, 14, 15, 16, 17, 18, 19]
      .includes(index)
  ) {
    return "#e53935";
  }

  return "#263238";
}

function drawGroundLine(
  context,
  width,
  y,
) {
  context.beginPath();

  context.moveTo(12, y);
  context.lineTo(width - 12, y);

  context.strokeStyle =
    "#b8c7ce";

  context.lineWidth = 1;

  context.stroke();
}

function drawNoAnalysisData(
  context,
  width,
  height,
) {
  context.fillStyle =
    "#667b85";

  context.font =
    "700 13px sans-serif";

  context.textAlign =
    "center";

  context.fillText(
    "スティックデータを表示できません",
    width / 2,
    height / 2,
  );
}

      function resizeAnalysisGraphCanvases() {
  [
    "centerOfMassGraphCanvas",
    "jointAngleGraphCanvas",
    "jointVelocityGraphCanvas",
  ].forEach((id) => {
    const canvas =
      document.getElementById(id);

    if (!canvas) {
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    if (
      rect.width <= 0 ||
      rect.height <= 0
    ) {
      return;
    }

    const ratio =
      window.devicePixelRatio || 1;

    canvas.width =
      Math.round(
        rect.width * ratio,
      );

    canvas.height =
      Math.round(
        rect.height * ratio,
      );

    canvas
      .getContext("2d")
      .setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0,
      );
  });
}

function drawAnalysisGraphs() {
  const data =
    ANALYSIS_VIEW_STATE.data;

  if (!data) {
    return;
  }

  const frameIndex =
    ANALYSIS_VIEW_STATE.currentFrame;

  const selectedJoint =
    ANALYSIS_VIEW_STATE.selectedJoint;

  const centerValues =
    (data.centerOfMass || []).map(
      (item) =>
        Number.isFinite(
          Number(item.y),
        )
          ? Number(item.y)
          : null,
    );

  const angleValues =
    getAnalysisGraphSeries(
      data.jointAngles,
      selectedJoint,
    );

  const velocityValues =
    getAnalysisGraphSeries(
      data.angularVelocities,
      selectedJoint,
    );

  drawAnalysisLineGraph(
    "centerOfMassGraphCanvas",
    centerValues,
    frameIndex,
    {
      color: "#246b58",
      zeroLine: false,
    },
  );

  drawAnalysisLineGraph(
    "jointAngleGraphCanvas",
    angleValues,
    frameIndex,
    {
      color:
        getJointGraphColor(
          selectedJoint,
        ),
      zeroLine: false,
    },
  );

  drawAnalysisLineGraph(
    "jointVelocityGraphCanvas",
    velocityValues,
    frameIndex,
    {
      color:
        getJointGraphColor(
          selectedJoint,
        ),
      zeroLine: true,
    },
  );

  setAnalysisGraphCurrentValues(
    centerValues,
    angleValues,
    velocityValues,
    frameIndex,
  );
}

function getAnalysisGraphSeries(
  graphData,
  jointIndex,
) {
  if (
    !graphData ||
    !Array.isArray(graphData.frames)
  ) {
    return [];
  }

  return graphData.frames.map(
    (frame) => {
      const value =
        frame.values?.[jointIndex];

      return Number.isFinite(
        Number(value),
      )
        ? Number(value)
        : null;
    },
  );
}

function drawAnalysisLineGraph(
  canvasId,
  values,
  currentIndex,
  options = {},
) {
  const canvas =
    document.getElementById(
      canvasId,
    );

  if (!canvas) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const width = rect.width;
  const height = rect.height;

  if (
    width <= 0 ||
    height <= 0
  ) {
    return;
  }

  const context =
    canvas.getContext("2d");

  context.clearRect(
    0,
    0,
    width,
    height,
  );

  context.fillStyle = "#f5f8fa";

  context.fillRect(
    0,
    0,
    width,
    height,
  );

  const numericValues =
    values.filter(
      (value) =>
        Number.isFinite(value),
    );

  if (!numericValues.length) {
    context.fillStyle =
      "#667b85";

    context.font =
      "700 12px sans-serif";

    context.textAlign =
      "center";

    context.fillText(
      "表示できるデータがありません",
      width / 2,
      height / 2,
    );

    return;
  }

  let minimum = Math.min(
    ...numericValues,
  );

  let maximum = Math.max(
    ...numericValues,
  );

  if (options.zeroLine) {
    minimum = Math.min(minimum, 0);
    maximum = Math.max(maximum, 0);
  }

  if (minimum === maximum) {
    minimum -= 1;
    maximum += 1;
  }

  const margin = {
    left: 42,
    right: 12,
    top: 14,
    bottom: 24,
  };

  const graphWidth =
    width -
    margin.left -
    margin.right;

  const graphHeight =
    height -
    margin.top -
    margin.bottom;

  const range =
    maximum - minimum;

  minimum -= range * 0.08;
  maximum += range * 0.08;

  const finalRange =
    maximum - minimum;

  const getX =
    (index) =>
      margin.left +
      (
        index /
        Math.max(
          1,
          values.length - 1,
        )
      ) *
        graphWidth;

  const getY =
    (value) =>
      margin.top +
      (
        (maximum - value) /
        finalRange
      ) *
        graphHeight;

  drawAnalysisGraphGrid(
    context,
    margin,
    graphWidth,
    graphHeight,
    minimum,
    maximum,
    getY,
    options.zeroLine,
  );

  context.beginPath();

  let started = false;

  values.forEach(
    (value, index) => {
      if (!Number.isFinite(value)) {
        started = false;
        return;
      }

      const x = getX(index);
      const y = getY(value);

      if (!started) {
        context.moveTo(x, y);
        started = true;
      } else {
        context.lineTo(x, y);
      }
    },
  );

  context.strokeStyle =
    options.color || "#246b58";

  context.lineWidth = 2.2;
  context.lineJoin = "round";
  context.lineCap = "round";
  context.stroke();

  const safeCurrentIndex =
    Math.max(
      0,
      Math.min(
        values.length - 1,
        currentIndex,
      ),
    );

  const markerX =
    getX(safeCurrentIndex);

  context.beginPath();

  context.moveTo(
    markerX,
    margin.top,
  );

  context.lineTo(
    markerX,
    margin.top + graphHeight,
  );

  context.strokeStyle =
    "rgba(196,61,75,.85)";

  context.lineWidth = 1.5;
  context.stroke();

  const currentValue =
    values[safeCurrentIndex];

  if (
    Number.isFinite(currentValue)
  ) {
    const markerY =
      getY(currentValue);

    context.beginPath();

    context.arc(
      markerX,
      markerY,
      4,
      0,
      Math.PI * 2,
    );

    context.fillStyle =
      "#c43d4b";

    context.fill();
  }

  context.fillStyle =
    "#667b85";

  context.font =
    "700 9px sans-serif";

  context.textAlign = "left";

  context.fillText(
    "1",
    margin.left,
    height - 7,
  );

  context.textAlign = "right";

  context.fillText(
    String(values.length),
    margin.left + graphWidth,
    height - 7,
  );
}

function drawAnalysisGraphGrid(
  context,
  margin,
  graphWidth,
  graphHeight,
  minimum,
  maximum,
  getY,
  showZeroLine,
) {
  context.font =
    "700 9px sans-serif";

  context.fillStyle =
    "#667b85";

  context.textAlign = "right";

  const divisions = 4;

  for (
    let index = 0;
    index <= divisions;
    index += 1
  ) {
    const ratio =
      index / divisions;

    const value =
      maximum -
      (maximum - minimum) *
        ratio;

    const y =
      margin.top +
      graphHeight * ratio;

    context.beginPath();

    context.moveTo(
      margin.left,
      y,
    );

    context.lineTo(
      margin.left + graphWidth,
      y,
    );

    context.strokeStyle =
      "rgba(102,123,133,.16)";

    context.lineWidth = 1;
    context.stroke();

    context.fillText(
      formatGraphAxisValue(value),
      margin.left - 5,
      y + 3,
    );
  }

  if (
    showZeroLine &&
    minimum <= 0 &&
    maximum >= 0
  ) {
    const zeroY = getY(0);

    context.beginPath();

    context.moveTo(
      margin.left,
      zeroY,
    );

    context.lineTo(
      margin.left + graphWidth,
      zeroY,
    );

    context.strokeStyle =
      "rgba(24,50,63,.55)";

    context.lineWidth = 1.2;
    context.stroke();
  }
}

function formatGraphAxisValue(value) {
  const absoluteValue =
    Math.abs(value);

  if (absoluteValue >= 1000) {
    return Math.round(value)
      .toString();
  }

  if (absoluteValue >= 100) {
    return value.toFixed(0);
  }

  if (absoluteValue >= 10) {
    return value.toFixed(1);
  }

  return value.toFixed(2);
}

function getJointGraphColor(index) {
  const rightIndexes = [
    0, 1, 4, 5, 6,
  ];

  const leftIndexes = [
    2, 3, 7, 8, 9,
  ];

  if (rightIndexes.includes(index)) {
    return "#1565c0";
  }

  if (leftIndexes.includes(index)) {
    return "#e53935";
  }

  return "#263238";
}

function setAnalysisGraphCurrentValues(
  centerValues,
  angleValues,
  velocityValues,
  frameIndex,
) {
  const centerElement =
    $("#centerOfMassGraphValue");

  const angleElement =
    $("#jointAngleGraphValue");

  const velocityElement =
    $("#jointVelocityGraphValue");

  const centerValue =
    centerValues[frameIndex];

  const angleValue =
    angleValues[frameIndex];

  const velocityValue =
    velocityValues[frameIndex];

  if (centerElement) {
    centerElement.textContent =
      Number.isFinite(centerValue)
        ? `${centerValue.toFixed(3)}m`
        : "-";
  }

  if (angleElement) {
    angleElement.textContent =
      Number.isFinite(angleValue)
        ? `${angleValue.toFixed(1)}°`
        : "-";
  }

  if (velocityElement) {
    velocityElement.textContent =
      Number.isFinite(velocityValue)
        ? `${velocityValue.toFixed(1)}°/秒`
        : "-";
  }
}

    >
      <div class="analysis-help-dialog">
        <div class="analysis-help-header">
          <h3 id="analysisHelpTitle" class="analysis-help-title">項目の説明</h3>
          <button
            class="analysis-help-close"
            type="button"
            aria-label="説明を閉じる"
            onclick="closeAnalysisHelp()"
          >×</button>
        </div>

      </div>
