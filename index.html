<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b3954">
    <title>4TUNE 動作分析</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        --navy:#0b3954; --blue:#176b87; --aqua:#4fb3bf; --bg:#f3f7f9;
        --card:#fff; --text:#18323f; --muted:#667b85; --line:#dbe6eb;
        --success:#18865a; --danger:#c43d4b; --warning:#b76a00;
        --shadow:0 12px 32px rgba(11,57,84,.10);
      }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#eaf3f6 0,var(--bg) 260px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
      button,input,select,textarea{font:inherit} button{cursor:pointer}
      .app{width:min(100%,680px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
      .brand{display:flex;align-items:center;gap:12px;margin:4px 4px 18px}.brand-mark{display:grid;width:46px;height:46px;place-items:center;border-radius:14px;background:var(--navy);color:#fff;font-weight:900;box-shadow:var(--shadow)}
      .brand h1{margin:0;font-size:19px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
      .admin-header-button{width:auto;min-height:36px;margin-left:auto;padding:0 11px;border:0;border-radius:11px;background:linear-gradient(145deg,#e8751a,#a94b08);color:#fff;font-size:11px;font-weight:900;box-shadow:0 6px 15px rgba(169,75,8,.2)}
      .card{padding:18px;border:1px solid rgba(219,230,235,.95);border-radius:21px;background:rgba(255,255,255,.97);box-shadow:var(--shadow)}
      .stack{display:grid;gap:14px}.hidden{display:none!important}
      .hero{background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff}.hero small{color:#bce9ef;font-weight:800;letter-spacing:.08em}.hero h2{margin:7px 0 0;font-size:24px;line-height:1.35}.hero p{margin:9px 0 0;color:#d9edf2;font-size:13px;line-height:1.7}
      .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2,.section-title h3{margin:0;font-size:18px}.section-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
      .field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800}.required::after{content:" 必須";color:var(--danger);font-size:10px}
      input,select,textarea{width:100%;min-height:46px;border:1px solid #cad9df;border-radius:12px;background:#fff;color:var(--text);padding:10px 12px;outline:none}textarea{min-height:86px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(79,179,191,.16)}
      .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.muted{color:var(--muted);font-size:11px;line-height:1.6}
      .choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:grid;min-height:44px;place-items:center;border:1px solid var(--line);border-radius:12px;background:#f8fafb;font-size:12px;font-weight:800}.choice input:checked+span{border-color:var(--blue);background:#e8f3f6;color:var(--blue)}
      .athlete-card{position:relative;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fbfdfe}.athlete-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.athlete-head strong{font-size:14px}.remove{border:0;background:transparent;color:var(--danger);font-size:12px;font-weight:800}
      .primary,.secondary{width:100%;min-height:48px;border-radius:14px;font-weight:850}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid #bfd2da;background:#fff;color:var(--blue)}.primary:disabled,.secondary:disabled{cursor:not-allowed;opacity:.5}
      .notice{padding:12px;border-radius:12px;background:#eef6f8;color:#365e6c;font-size:12px;line-height:1.65}.error{display:none;padding:12px;border-radius:12px;background:#fdecef;color:#8e2834;font-size:12px;line-height:1.65;white-space:pre-wrap}.error.visible{display:block}
      .profile-line{display:flex;align-items:center;gap:11px}.avatar{width:48px;height:48px;border-radius:50%;background:#e6eef1;object-fit:cover}.profile-line strong{display:block}.profile-line span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
      .task-card{padding:15px;border-radius:16px;background:linear-gradient(135deg,#fff7e8,#fff);border:1px solid #f0d7ae}.task-card strong{font-size:13px}.task-card p{margin:5px 0 0;color:#79511a;font-size:11px}
      .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu-button{min-height:92px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left}.menu-button b{display:block;color:var(--navy);font-size:14px}.menu-button span{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.45}.menu-button.primary-menu{border:0;background:linear-gradient(145deg,var(--blue),var(--navy));color:#fff}.menu-button.primary-menu b,.menu-button.primary-menu span{color:#fff}
      .athlete-summary{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.athlete-summary:first-child{border-top:0}.athlete-summary b{font-size:14px}.athlete-summary span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.pill{align-self:flex-start;padding:5px 8px;border-radius:99px;background:#e5f4ef;color:var(--success);font-size:10px;font-weight:800}
      .product-grid,.select-list{display:grid;gap:10px}.product-option,.athlete-option{position:relative}.product-option input,.athlete-option input{position:absolute;opacity:0;pointer-events:none}.product-box,.athlete-box{display:block;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.product-option input:checked+.product-box,.athlete-option input:checked+.athlete-box{border-color:var(--blue);background:#eaf5f7;box-shadow:0 0 0 2px rgba(23,107,135,.08)}.product-top,.athlete-box{display:flex;justify-content:space-between;gap:12px}.product-box b,.athlete-box b{font-size:14px}.product-box small,.athlete-box small{display:block;margin-top:5px;color:var(--muted)}.price{color:var(--blue);font-size:17px;font-weight:900}.old-price{display:block;color:var(--muted);font-size:10px;text-decoration:line-through;text-align:right}
      .shooting-card{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fbfdfe}.shooting-card h4{margin:0 0 12px;font-size:14px}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.summary-row:first-child{border-top:0}.summary-row.total{margin-top:4px;padding-top:13px;font-size:16px;font-weight:900}.discount{color:var(--success)}
      .progress-track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:2px 0 4px}.progress-step{display:grid;gap:6px;min-width:0;text-align:center}.progress-dot{position:relative;height:7px;border-radius:99px;background:#dbe6eb}.progress-step.done .progress-dot{background:var(--success)}.progress-step.current .progress-dot{background:var(--blue);box-shadow:0 0 0 3px rgba(23,107,135,.13)}.progress-label{overflow:hidden;color:var(--muted);font-size:9px;font-weight:800;white-space:nowrap}.progress-step.done .progress-label,.progress-step.current .progress-label{color:var(--navy)}.progress-next{padding:12px;border:1px solid #cfe1e7;border-radius:13px;background:#eef6f8}.progress-next small{display:block;margin-bottom:3px;color:var(--blue);font-size:10px;font-weight:900}.progress-next b{font-size:13px;line-height:1.5}.athlete-status-list{display:grid;gap:8px}
      .admin-screen{--admin:#e8751a;--admin-dark:#a94b08;--admin-soft:#fff2e7}.admin-screen .admin-hero{background:linear-gradient(145deg,var(--admin-dark),var(--admin));color:#fff}.admin-screen .admin-hero p,.admin-screen .admin-hero small{color:#ffe2ca}.admin-menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.admin-menu-button{min-height:82px;padding:12px;border:1px solid #f0c6a5;border-radius:15px;background:#fff8f2;color:var(--admin-dark);text-align:left;font-weight:900}.admin-menu-button span{display:block;margin-top:5px;color:#9a6845;font-size:10px}.admin-menu-button.active{border-color:var(--admin);background:linear-gradient(145deg,var(--admin),var(--admin-dark));color:#fff}.admin-menu-button.active span{color:#ffe2ca}.admin-summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.admin-summary{padding:13px;border:1px solid #f0d4bf;border-radius:14px;background:#fff}.admin-summary small{display:block;color:#9a6845;font-size:10px;font-weight:800}.admin-summary strong{display:block;margin-top:4px;color:var(--admin-dark);font-size:23px}.admin-application{padding:14px;border:1px solid #f0d4bf;border-radius:16px;background:#fff}.admin-status-row{display:flex;flex-wrap:wrap;gap:6px}.admin-status-chip{padding:5px 8px;border-radius:99px;background:var(--admin-soft);color:var(--admin-dark);font-size:10px;font-weight:800}.admin-status-chip.payment{background:#fff0d5;color:#8a5700}.admin-status-chip.analysis{background:#ffe5d1;color:#a94b08}.admin-section-title{margin:0;color:var(--admin-dark);font-size:17px}
      .home-screen{gap:8px}.home-screen .home-hero{padding:11px 15px;border-radius:16px}.home-screen .home-hero small{font-size:9px}.home-screen .home-hero h2{margin-top:3px;font-size:19px}.home-screen .home-hero p{margin-top:3px;font-size:11px;line-height:1.4}.home-screen .home-profile{padding:9px 13px;border-radius:15px}.home-screen .home-profile .avatar{width:36px;height:36px}.home-screen .task-card{padding:9px 12px;border-radius:13px}.home-screen .task-card strong{font-size:12px}.home-screen .task-card p{margin-top:2px;font-size:10px;line-height:1.35}.home-screen .task-card .secondary{min-height:32px!important;margin-top:6px!important;font-size:10px}.home-screen .home-menu-card{padding:10px 12px;border-radius:16px}.home-screen .home-menu-card .section-title{margin-bottom:7px}.home-screen .home-menu-card .section-title h3{font-size:14px}.home-screen .home-menu-card .section-title p{display:none}.home-screen .menu-grid{gap:6px}.home-screen .menu-button{min-height:61px;padding:8px 10px;border-radius:12px}.home-screen .menu-button b{font-size:12px}.home-screen .menu-button span{margin-top:3px;font-size:9px;line-height:1.3}.home-screen .home-athletes{max-height:112px;overflow:auto;padding:9px 12px;border-radius:16px}.home-screen .home-athletes .section-title{margin-bottom:3px}.home-screen .home-athletes .section-title h3{font-size:14px}.home-screen .athlete-summary{padding:6px 0}.home-screen .athlete-summary b{font-size:12px}.home-screen .athlete-summary span{margin-top:2px;font-size:9px}
      .loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(243,247,249,.94);backdrop-filter:blur(5px)}.loading.hidden{display:none}.loading-box{text-align:center}.spinner{width:46px;height:46px;margin:0 auto 13px;border:4px solid #d5e6eb;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}.loading p{margin:0;color:var(--navy);font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
      @media(max-width:430px){.grid-2{grid-template-columns:1fr}.choice-row{grid-template-columns:1fr 1fr 1fr}.card{padding:16px}}
      .analysis-viewer {
  display: grid;
  gap: 12px;
}

.analysis-canvas-wrap {
  position: relative;
  overflow: hidden;
  width: 100%;
  border-radius: 18px;
  background: #eef3f6;
  border: 1px solid var(--line);
}

.analysis-canvas {
  display: block;
  width: 100%;
  height: 330px;
  touch-action: none;
}

.analysis-overlay {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 9px;
  border-radius: 9px;
  background: rgba(11, 57, 84, 0.75);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  pointer-events: none;
}

.analysis-controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.analysis-control-button {
  min-height: 42px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
  color: var(--navy);
  font-size: 13px;
  font-weight: 900;
}

.analysis-control-button.primary-control {
  border-color: var(--navy);
  background: var(--navy);
  color: #fff;
}

.analysis-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 5px;
  border-radius: 15px;
  background: #e5edf1;
}

.analysis-tab-button {
  min-height: 40px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
}

.analysis-tab-button.active {
  background: #fff;
  color: var(--navy);
  box-shadow: 0 5px 14px rgba(11, 57, 84, 0.12);
}

.analysis-tab-panel {
  display: none;
}

.analysis-tab-panel.active {
  display: grid;
  gap: 12px;
}

.analysis-setting {
  display: grid;
  gap: 7px;
}

.analysis-setting-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.analysis-setting input[type="range"] {
  width: 100%;
  accent-color: var(--blue);
}

.analysis-toggle-list {
  display: grid;
  gap: 8px;
}

.analysis-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
}

.analysis-toggle input {
  width: 20px;
  min-height: 20px;
  margin: 0;
  padding: 0;
  accent-color: var(--blue);
}

.analysis-metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.analysis-metric {
  padding: 14px 8px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fff;
  text-align: center;
}

.analysis-metric small {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.analysis-metric strong {
  color: var(--navy);
  font-size: 21px;
}

.analysis-metric strong span {
  font-size: 11px;
}

.analysis-metric.speed {
  grid-column: 1 / -1;
  border-color: transparent;
  background: linear-gradient(145deg, var(--navy), var(--blue));
}

.analysis-metric.speed small {
  color: #bce9ef;
}

.analysis-metric.speed strong {
  color: #fff;
  font-size: 28px;
}

.light-frame-label {
  fill: #18323f;
  font-size: 11px;
  font-weight: 800;
}
.analysis-graph-card {
  display: grid;
  gap: 9px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #fff;
}

.analysis-graph-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
}

.analysis-graph-title-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.analysis-graph-order-buttons {
  display: flex;
  gap: 4px;
}

.analysis-graph-order-button {
  display: grid;
  width: 28px;
  min-height: 28px;
  padding: 0;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #f5f8fa;
  color: var(--navy);
  font-size: 13px;
  font-weight: 900;
}

.analysis-graph-order-button:disabled {
  opacity: 0.3;
  cursor: default;
}

.analysis-graph-header h4 {
  margin: 0;
  color: var(--navy);
  font-size: 14px;
}

.analysis-graph-header span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}

.analysis-graph-canvas-wrap {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 170px;
  border-radius: 12px;
  background: #f5f8fa;
}

.analysis-graph-canvas {
  display: block;
  width: 100%;
  height: 170px;
}

.analysis-joint-select {
  width: 100%;
  min-height: 42px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}

.analysis-graph-value {
  color: var(--blue);
  font-size: 12px;
  font-weight: 900;
}
    </style>
  </head>
  <body>
    <div id="loading" class="loading"><div class="loading-box"><div class="spinner"></div><p id="loadingText">読み込み中...</p></div></div>
    <main class="app">
      <header class="brand"><div class="brand-mark">4T</div><div><h1>4TUNE 動作分析</h1><p>走りを「感覚」から「データ」へ</p></div><button id="adminHeaderButton" class="admin-header-button hidden" type="button" onclick="openAdminDashboard()">管理者画面</button></header>
      <div id="screen"></div>
    </main>

    <script>
      const ANALYSIS_VIEW_STATE = {
  data: null,
  currentFrame: 0,
  playing: false,
  timerId: null,
  speed: 1,
  scale: 100,
  activeTab: "controls",
  selectedJoint: 0,
  showCenterOfMass: true,
  showToeTrajectory: true,
  showJointHighlight: true,
  graphOrder: ["center", "angle", "velocity"],
};

const ANALYSIS_CONNECTIONS = {
  right: [
    [0, 1],
    [1, 2],
    [2, 3],
    [8, 9],
    [9, 10],
    [10, 11],
    [11, 12],
    [12, 13],
  ],

  left: [
    [4, 5],
    [5, 6],
    [6, 7],
    [14, 15],
    [15, 16],
    [16, 17],
    [17, 18],
    [18, 19],
  ],

  center: [
    [3, 7],
    [3, 22],
    [7, 22],
    [3, 13],
    [7, 19],
    [13, 19],
    [22, 21],
    [21, 20],
  ],
};
      const CONFIG=Object.freeze({
        LIFF_ID:"2011019778-43fXNNSl",
        GAS_URL:"https://script.google.com/macros/s/AKfycbyJ4ymLEm7orQhn3EcN4uAj7bFZaHQiGGEN-HcYSEcyjICs9bB7OC5GVsKH6lx8eBiiqw/exec"
      });
      const STATE={idToken:null,profile:null,data:null,products:[],analysisResults:[],adminDashboard:null,adminSection:"applications",submitting:false};
      const $=(selector,root=document)=>root.querySelector(selector);
      const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
      const escapeHtml=(value)=>String(value??"").replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
      function lock(message="処理中..."){ $("#loadingText").textContent=message; $("#loading").classList.remove("hidden"); }
      function unlock(){ $("#loading").classList.add("hidden"); }
      function showError(message){ const box=$("#formError")||$("#pageError"); if(box){box.textContent=String(message||"エラーが発生しました");box.classList.add("visible");box.scrollIntoView({behavior:"smooth",block:"center"});}else alert(message); }

      async function apiPost(action,payload={}){
        const response=await fetch(CONFIG.GAS_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,idToken:STATE.idToken,payload})});
        if(!response.ok) throw new Error(`通信エラー: HTTP ${response.status}`);
        const data=await response.json();
        if(!data.success) throw new Error(data.message||"処理に失敗しました");
        return data;
      }

      async function startApp(){
        lock("LINEに接続中...");
        try{
          await liff.init({liffId:CONFIG.LIFF_ID});
          if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
          STATE.idToken=liff.getIDToken();
          if(!STATE.idToken) throw new Error("LINE認証情報を取得できません。LIFFのScopeでopenidを確認してください");
          STATE.profile=await liff.getProfile();
          lock("登録情報を確認中...");
          STATE.data=await apiPost("bootstrap");
          STATE.data.registered?renderHome():renderRegistration();
        }catch(error){console.error(error);renderFatal(error.message||"アプリを起動できませんでした");}
        finally{unlock();}
      }

      function renderFatal(message){
        $("#screen").innerHTML=`<section class="card stack"><div><h2>起動できませんでした</h2><p class="muted">設定または通信状況を確認してください</p></div><div id="pageError" class="error visible">${escapeHtml(message)}</div><button class="primary" onclick="location.reload()">もう一度試す</button></section>`;
      }

      function renderRegistration(){
        const displayName=STATE.profile?.displayName||STATE.data?.profile?.displayName||"";
        $("#screen").innerHTML=`
          <div class="stack">
            <section class="card hero"><small>FIRST REGISTRATION</small><h2>最初に利用者情報を登録します</h2><p>登録内容は後から変更できます。指導者は選手を登録せずに開始できます。</p></section>
            <form id="registrationForm" class="stack" novalidate>
              <section class="card stack">
                <div class="section-title"><div><h2>申込者情報</h2><p>このLINEアカウントを利用する方</p></div></div>
                <div class="field"><label class="required" for="applicantName">申込者名</label><input id="applicantName" maxlength="80" autocomplete="name" value="${escapeHtml(displayName)}"></div>
                <div class="field"><label class="required">申込者区分</label><div class="choice-row">
                  ${["本人","保護者","指導者"].map((type,index)=>`<label class="choice"><input type="radio" name="applicantType" value="${type}" ${index===0?"checked":""}><span>${type}</span></label>`).join("")}
                </div></div>
                <div class="grid-2">

      async function submitRegistration(event){

            <section class="card home-profile"><div class="profile-line"><img class="avatar" src="${escapeHtml(STATE.profile?.pictureUrl||"")}" alt=""><div><strong>${escapeHtml(customer.applicantName)}</strong><span>${escapeHtml(customer.applicantType||"")}として登録済み</span></div></div></section>

      async function loadHomeTaskSummary() {
        const card = $("#homeTaskCard");
        if (!card) return;

        try {
          const result = await apiPost("getApplications");
          const applications = result.applications || [];
          const actionable = applications
            .map((application) => ({
              application,
              progressIndex: getApplicationProgressIndex(application),
            }))
            .filter((item) => item.progressIndex < 5)
            .sort((a, b) => {
              const priority = (item) => {
                const statuses = (item.application.athletes || [])
                  .map((athlete) => athlete.status || "")
                  .join(" ");
                if (/動画提出待ち|未提出|動画待ち/.test(statuses)) return 0;
                if (item.progressIndex === 3) return 1;
                return 2;
              };
              return priority(a) - priority(b);
            })[0];

          if (!actionable) {
            card.innerHTML = `
              <strong>現在、対応が必要な申し込みはありません</strong>
              <p>新しい案内がある場合は、ここに優先表示します。</p>
            `;
            return;
          }

          const application = actionable.application;
          card.innerHTML = `
            <strong>${escapeHtml(getApplicationNextAction(application, actionable.progressIndex))}</strong>
            <p>${escapeHtml(application.phase)}｜${escapeHtml(application.productName)}コース・${escapeHtml(application.applicationId)}</p>
            <button class="secondary" style="margin-top:10px;min-height:40px" type="button">申し込み状況を確認</button>

          $("button", card)?.addEventListener("click", openApplications);
        } catch (error) {
          console.error("ホームの進捗確認に失敗しました", error);

            <strong>申し込み状況を取得できませんでした</strong>
            <p>「申し込み状況」から、もう一度確認してください。</p>
          `;
        }
      }
      async function openApplication(){

        catch(error){console.error(error);alert(error.message||"商品情報を読み込めませんでした");}
        finally{unlock();}
      }
      function renderApplicationForm(){
        const athletes=STATE.data.athletes||[];if(!athletes.length){alert("先に選手を登録してください");return;}
        $("#screen").innerHTML=`<form id="applicationForm" class="stack" novalidate>
          <section class="card"><div class="section-title"><div><h2>新規申し込み</h2><p>動画確認後に振込をご案内します</p></div><button class="secondary" style="width:auto;min-height:38px;padding:0 12px" type="button" onclick="renderHome()">戻る</button></div><div class="field"><label class="required">申し込み区分</label><div class="choice-row" style="grid-template-columns:1fr 1fr"><label class="choice"><input type="radio" name="applicationType" value="個人" checked><span>個人</span></label><label class="choice"><input type="radio" name="applicationType" value="団体"><span>団体</span></label></div></div></section>
          <section class="card"><div class="section-title"><div><h3>分析内容</h3><p>現在受付中のコース</p></div></div><div class="product-grid">${STATE.products.map((product,index)=>`<label class="product-option"><input type="radio" name="productId" value="${escapeHtml(product.productId)}" ${index===0?"checked":""}><span class="product-box"><span class="product-top"><span><b>${escapeHtml(product.phase)}｜${escapeHtml(product.name)}コース</b><small>${String(product.plan).toLowerCase()==="pro"?"全コマ分析＋PDFコメント":"5局面分析"}</small></span><span><span class="price">${formatYen(product.price)}</span>${product.campaignEnabled&&product.normalPrice>product.price?`<span class="old-price">${formatYen(product.normalPrice)}</span>`:""}</span></span>${product.groupDiscountEnabled?`<small>${product.groupMinimum}名以上で1人${formatYen(product.groupDiscount)}引き</small>`:""}</span></label>`).join("")}</div></section>
          <section class="card"><div class="section-title"><div><h3>対象選手</h3><p id="athleteSelectionNote">個人は1名選択</p></div></div><div class="select-list">${athletes.map((athlete,index)=>`<label class="athlete-option"><input type="checkbox" name="athleteId" value="${escapeHtml(athlete.athleteId)}" ${index===0?"checked":""}><span class="athlete-box"><span><b>${escapeHtml(athlete.name)}</b><small>${escapeHtml(athlete.affiliation)}</small></span><span class="pill">選択</span></span></label>`).join("")}</div></section>
          <section class="card"><div class="section-title"><div><h3>撮影情報</h3><p>選手ごとに入力</p></div></div><div id="shootingList" class="stack"></div></section>
          <section class="card stack"><div class="section-title"><div><h3>料金確認</h3><p>申し込み時点の金額を保存します</p></div></div><div id="priceSummary"></div><div class="notice">この段階では振込不要です。動画を確認後、LINEで振込をご案内します。</div><div id="formError" class="error"></div><button id="applicationSubmit" class="primary" type="submit">この内容で申し込む</button></section>
        </form>`;
        $$('input[name="applicationType"],input[name="productId"],input[name="athleteId"]').forEach((input)=>input.addEventListener("change",handleApplicationChange));
        $("#applicationForm").addEventListener("submit",submitApplication);handleApplicationChange();
      }
      function handleApplicationChange(event){
        const type=$('input[name="applicationType"]:checked')?.value||"個人";const inputs=$$('input[name="athleteId"]');
        if(type==="個人"){if(event?.target?.name==="athleteId"&&event.target.checked)inputs.forEach((input)=>{if(input!==event.target)input.checked=false;});if(!inputs.some((input)=>input.checked)&&inputs[0])inputs[0].checked=true;$("#athleteSelectionNote").textContent="個人は1名選択";}else{$("#athleteSelectionNote").textContent="団体は2名以上。5名以上で団体割";}
        renderShootingInputs();updatePriceSummary();
      }
      function selectedAthletes(){const ids=new Set($$('input[name="athleteId"]:checked').map((input)=>input.value));return(STATE.data.athletes||[]).filter((athlete)=>ids.has(athlete.athleteId));}
      function selectedProduct(){const id=$('input[name="productId"]:checked')?.value;return STATE.products.find((product)=>product.productId===id)||null;}
      function renderShootingInputs(){
        const old={};$$('.shooting-card').forEach((card)=>{old[card.dataset.athleteId]={shootingDate:$('.shooting-date',card)?.value||"",calibrationDistance:$('.calibration-distance',card)?.value||"",fps:$('.shooting-fps',card)?.value||"",direction:$('.shooting-direction',card)?.value||"",notes:$('.shooting-notes',card)?.value||""};});const today=new Date().toISOString().slice(0,10);
        $("#shootingList").innerHTML=selectedAthletes().map((athlete)=>{const v=old[athlete.athleteId]||{};return`<div class="shooting-card" data-athlete-id="${escapeHtml(athlete.athleteId)}"><h4>${escapeHtml(athlete.name)}</h4><div class="grid-2"><div class="field"><label class="required">撮影日</label><input class="shooting-date" type="date" max="${today}" value="${escapeHtml(v.shootingDate||"")}"></div><div class="field"><label class="required">目印間の距離(m)</label><input class="calibration-distance" type="number" inputmode="decimal" min="0.01" max="100" step="0.01" placeholder="例：2.00" value="${escapeHtml(v.calibrationDistance||"")}"><small class="muted">動画内に映した目印間の実測値</small></div></div><div class="grid-2"><div class="field"><label class="required">実際のfps</label><input class="shooting-fps" type="number" inputmode="decimal" min="30" max="240" step="0.01" placeholder="例：202.97" value="${escapeHtml(v.fps||"")}"><small class="muted">動画情報に表示された数値を入力</small></div><div class="field"><label class="required">進行方向</label><select class="shooting-direction"><option value="">選択</option><option ${v.direction==="左から右"?"selected":""}>左から右</option><option ${v.direction==="右から左"?"selected":""}>右から左</option></select></div></div><div class="field"><label>補足事項（任意）</label><textarea class="shooting-notes" maxlength="500">${escapeHtml(v.notes||"")}</textarea></div></div>`;}).join("")||'<p class="muted">対象選手を選択してください</p>';
      }
      function calculateClientPrice(){const product=selectedProduct(),athletes=selectedAthletes(),type=$('input[name="applicationType"]:checked')?.value||"個人";if(!product)return null;const groupApplied=type==="団体"&&product.groupDiscountEnabled&&athletes.length>=product.groupMinimum;const groupTotal=groupApplied?product.groupDiscount*athletes.length:0;const campaignTotal=product.campaignEnabled?Math.max(0,product.normalPrice-product.price)*athletes.length:0;return{product,count:athletes.length,groupApplied,groupTotal,campaignTotal,total:Math.max(0,product.price*athletes.length-groupTotal)};}
      function updatePriceSummary(){const price=calculateClientPrice();if(!price){$("#priceSummary").innerHTML="";return;}$("#priceSummary").innerHTML=`<div class="summary-row"><span>${escapeHtml(price.product.name)} × ${price.count}名</span><b>${formatYen(price.product.price*price.count)}</b></div>${price.campaignTotal?`<div class="summary-row discount"><span>キャンペーン割引</span><b>通常価格より−${formatYen(price.campaignTotal)}</b></div>`:""}${price.groupApplied?`<div class="summary-row discount"><span>団体割</span><b>−${formatYen(price.groupTotal)}</b></div>`:""}<div class="summary-row total"><span>予定金額</span><b>${formatYen(price.total)}</b></div>`;}
      function collectApplicationAthletes(){return $$('.shooting-card').map((card)=>({athleteId:card.dataset.athleteId,shootingDate:$('.shooting-date',card).value,calibrationDistance:$('.calibration-distance',card).value,fps:$('.shooting-fps',card).value,direction:$('.shooting-direction',card).value,notes:$('.shooting-notes',card).value.trim()}));}
      async function submitApplication(event){event.preventDefault();if(STATE.submitting)return;$("#formError").classList.remove("visible");const payload={applicationType:$('input[name="applicationType"]:checked')?.value||"",productId:$('input[name="productId"]:checked')?.value||"",athletes:collectApplicationAthletes()};STATE.submitting=true;$("#applicationSubmit").disabled=true;lock("申し込みを登録中...");try{const result=await apiPost("createApplication",payload);renderApplicationComplete(result.application);}catch(error){console.error(error);showError(error.message);}finally{STATE.submitting=false;unlock();const button=$("#applicationSubmit");if(button)button.disabled=false;}}
      function renderApplicationComplete(application){$("#screen").innerHTML=`<div class="stack"><section class="card hero"><small>APPLICATION ACCEPTED</small><h2>申し込みを受け付けました</h2><p>続けて、選手ごとに分析動画を提出してください。</p></section><section class="card stack"><div><b>申込ID</b><p style="margin:5px 0 0;color:var(--blue);font-weight:900">${escapeHtml(application.applicationId)}</p></div><div class="summary-row"><span>${escapeHtml(application.phase)}｜${escapeHtml(application.productName)}</span><b>${application.count}名</b></div>${application.groupDiscountApplied?`<div class="summary-row discount"><span>団体割</span><b>−${formatYen(application.groupDiscountTotal)}</b></div>`:""}<div class="summary-row total"><span>予定金額</span><b>${formatYen(application.total)}</b></div><div class="notice">まだ振り込まないでください。動画確認後に振込先と確定金額をご案内します。</div></section><section class="card stack"><div class="section-title"><div><h3>動画を提出</h3><p>Googleアカウントへのログインが必要です</p></div></div>${application.athletes.map((athlete)=>`<button class="primary" type="button" data-upload-url="${escapeHtml(athlete.uploadUrl)}">${escapeHtml(athlete.name)}の動画を提出</button>`).join("")}<button class="secondary" type="button" onclick="reloadHome()">ホームへ戻る</button></section></div>`;$$('[data-upload-url]').forEach((button)=>button.addEventListener("click",()=>openUploadForm(button.dataset.uploadUrl)));}
      function openUploadForm(url){if(window.liff?.openWindow)liff.openWindow({url,external:true});else window.open(url,"_blank","noopener");}
      async function openApplications(){lock("申し込み状況を読み込み中...");try{const result=await apiPost("getApplications");renderApplications(result.applications||[]);}catch(error){console.error(error);alert(error.message||"申し込み状況を読み込めませんでした");}finally{unlock();}}
      const APPLICATION_PROGRESS_STEPS = [
        "申込受付", "動画提出", "内容確認", "入金", "分析中", "完了",
      ];

      function getApplicationProgressIndex(application) {
        const athleteStatuses = (application.athletes || [])
          .map((athlete) => athlete.status || "")
          .join(" ");
        const statusText = [
          application.progressStatus,
          application.paymentStatus,
          athleteStatuses,
        ].join(" ");

        if (/公開|完了|返却済/.test(statusText)) return 5;
        if (/分析中|解析中|作成中/.test(statusText)) return 4;
        if (/入金済|支払済|決済済/.test(statusText)) return 4;
        if (/動画提出待ち|未提出|動画待ち/.test(statusText)) return 1;
        if (/入金待ち|振込待ち|支払待ち|決済待ち|入金案内/.test(statusText)) return 3;
        if (/確認中|確認待ち|動画受領|提出済/.test(statusText)) return 2;
        return 0;
      }

      function getApplicationNextAction(application, progressIndex) {
        const waitingAthletes = (application.athletes || [])
          .filter((athlete) => /動画提出待ち|未提出|動画待ち/.test(athlete.status || ""));

        if (waitingAthletes.length) {
          return `${waitingAthletes.map((athlete) => athlete.name).join("、")}さんの動画を提出してください`;
        }
        if (progressIndex === 0) return "受付内容の確認をお待ちください";
        if (progressIndex === 1) return "動画提出フォームから動画を提出してください";
        if (progressIndex === 2) return "動画の確認完了までお待ちください";
        if (progressIndex === 3) return "LINEで届く入金案内をご確認ください";
        if (progressIndex === 4) return "分析結果の公開までお待ちください";
        return "分析結果画面から結果を確認できます";
      }

      function renderApplicationProgress(application) {
        const currentIndex = getApplicationProgressIndex(application);
        return `
          <div class="progress-track" aria-label="分析進捗">
            ${APPLICATION_PROGRESS_STEPS.map((label, index) => `
              <div class="progress-step ${index < currentIndex ? "done" : ""} ${index === currentIndex ? "current" : ""}">
                <div class="progress-dot"></div>
                <div class="progress-label">${label}</div>
              </div>
            `).join("")}
          </div>
          <div class="progress-next">
            <small>次に行うこと</small>
            <b>${escapeHtml(getApplicationNextAction(application, currentIndex))}</b>
          </div>
        `;
      }

      function renderApplications(applications) {
        $("#screen").innerHTML = `
          <div class="stack">
            <section class="card">
              <div class="section-title">
                <div><h2>申し込み状況</h2><p>動画・入金・分析の進行状況</p></div>

              </div>
            </section>
            ${applications.length ? applications.map((application) => `
              <section class="card stack">
                <div class="section-title">
                  <div>
                    <h3>${escapeHtml(application.phase)}｜${escapeHtml(application.productName)}コース</h3>
                    <p>${escapeHtml(application.appliedAt)}・${escapeHtml(application.applicationId)}</p>
                  </div>
                  <span class="pill">${escapeHtml(application.progressStatus || "申込受付")}</span>
                </div>
                ${renderApplicationProgress(application)}
                <div>
                  <div class="summary-row"><span>申し込み</span><b>${escapeHtml(application.applicationType)}・${application.count}名</b></div>
                  <div class="summary-row"><span>入金状態</span><b>${escapeHtml(application.paymentStatus || "未入金")}</b></div>
                  <div class="summary-row total"><span>予定金額</span><b>${formatYen(application.total)}</b></div>
                </div>
                <div class="athlete-status-list">
                  ${(application.athletes || []).map((athlete) => `
                    <div class="shooting-card">
                      <div class="athlete-head">
                        <strong>${escapeHtml(athlete.name)}</strong>

    );
  }

    $("#analysisSpeedRange");

          Number(speedRange.value);

            ).toFixed(2)}倍`;

        if (
          ANALYSIS_VIEW_STATE.playing
        ) {
          stopAnalysisPlayback();

        }
      },
    );
  }

  const jointSelect =
    $("#analysisJointSelect");

  if (jointSelect) {
    jointSelect.addEventListener(
      "change",
      () => {
        ANALYSIS_VIEW_STATE
          .selectedJoint =
            Number(
              jointSelect.value,
            ) || 0;

        drawAnalysisGraphs();
        drawCurrentAnalysisView();
      },
    );
  }

  bindAnalysisToggle_("analysisToeToggle", "showToeTrajectory");
  bindAnalysisToggle_("analysisJointToggle", "showJointHighlight");

  $$('[data-graph-move]').forEach((button) => {
    button.addEventListener("click", () => {
      const card = button.closest('[data-analysis-graph]');
      if (!card) return;
      moveAnalysisGraph_(
        card.dataset.analysisGraph,
        button.dataset.graphMove,
      );
    });
  });

  applyAnalysisGraphOrder_();
}

function moveAnalysisGraph_(graphKey, direction) {
  const order = [...ANALYSIS_VIEW_STATE.graphOrder];
  const currentIndex = order.indexOf(graphKey);
  const nextIndex = direction === "up"
    ? currentIndex - 1
    : currentIndex + 1;

  if (
    currentIndex < 0 ||
    nextIndex < 0 ||
    nextIndex >= order.length
  ) return;

  [order[currentIndex], order[nextIndex]] =
    [order[nextIndex], order[currentIndex]];

  ANALYSIS_VIEW_STATE.graphOrder = order;
  applyAnalysisGraphOrder_();
  resizeAnalysisGraphCanvases();
  drawAnalysisGraphs();
}

function applyAnalysisGraphOrder_() {
  const container = document.getElementById("analysisGraphCards");
  if (!container) return;

  ANALYSIS_VIEW_STATE.graphOrder.forEach((graphKey) => {
    const card = container.querySelector(
      `[data-analysis-graph="${graphKey}"]`,
    );
    if (card) container.appendChild(card);
  });

  const cards = Array.from(
    container.querySelectorAll('[data-analysis-graph]'),
  );
  cards.forEach((card, index) => {
    const up = card.querySelector('[data-graph-move="up"]');
    const down = card.querySelector('[data-graph-move="down"]');
    if (up) up.disabled = index === 0;
    if (down) down.disabled = index === cards.length - 1;
  });
}

function bindAnalysisToggle_(elementId, stateKey) {
  const element = document.getElementById(elementId);
  if (!element) return;

  element.addEventListener("change", () => {
    ANALYSIS_VIEW_STATE[stateKey] = element.checked;
    drawCurrentAnalysisView();
  });
}

function toggleAnalysisPlayback() {
  if (ANALYSIS_VIEW_STATE.playing) {
    stopAnalysisPlayback();
  } else {
    startAnalysisPlayback();
  }
}

function startAnalysisPlayback() {
  const data =
    ANALYSIS_VIEW_STATE.data;

  if (
    !data ||
    !Array.isArray(data.frames) ||
    !data.frames.length
  ) {
    return;
  }

  ANALYSIS_VIEW_STATE.playing = true;

  const button =
    $("#analysisPlayButton");

  if (button) {
    button.textContent = "停止";
  }

  scheduleNextAnalysisFrame();
}

function scheduleNextAnalysisFrame() {
  if (!ANALYSIS_VIEW_STATE.playing) {
    return;
  }

  const fps =
    Number(
      ANALYSIS_VIEW_STATE.data?.fps,
    ) || 30;

  const speed =
    ANALYSIS_VIEW_STATE.speed || 1;

  const delay =
    Math.max(
      4,
      1000 / fps / speed,
    );

  ANALYSIS_VIEW_STATE.timerId =
    window.setTimeout(
      () => {
        const frames =
          ANALYSIS_VIEW_STATE.data
            .frames;

        ANALYSIS_VIEW_STATE.currentFrame =
          (
            ANALYSIS_VIEW_STATE
              .currentFrame + 1
          ) % frames.length;

        drawCurrentAnalysisView();
        scheduleNextAnalysisFrame();
      },
      delay,
    );
}

function stopAnalysisPlayback() {
  ANALYSIS_VIEW_STATE.playing = false;

  if (
    ANALYSIS_VIEW_STATE.timerId
  ) {
    clearTimeout(
      ANALYSIS_VIEW_STATE.timerId,
    );

    ANALYSIS_VIEW_STATE.timerId =
      null;
  }

  const button =
    $("#analysisPlayButton");

  if (button) {
    button.textContent = "再生";
  }
}

function previousAnalysisFrame() {
  stopAnalysisPlayback();

  const frames =
    ANALYSIS_VIEW_STATE.data
      ?.frames || [];

  if (!frames.length) {
    return;
  }

  ANALYSIS_VIEW_STATE.currentFrame =
    (
      ANALYSIS_VIEW_STATE
        .currentFrame -
      1 +
      frames.length
    ) % frames.length;

  drawCurrentAnalysisView();
}

function nextAnalysisFrame() {
  stopAnalysisPlayback();

  const frames =
    ANALYSIS_VIEW_STATE.data
      ?.frames || [];

  if (!frames.length) {
    return;
  }

  ANALYSIS_VIEW_STATE.currentFrame =
    (
      ANALYSIS_VIEW_STATE
        .currentFrame + 1
    ) % frames.length;

  drawCurrentAnalysisView();
}

function resetAnalysisView() {

  }

}

function handleAnalysisResize() {

  ) {

    drawAnalysisGraphs();

function resizeAnalysisCanvas() {
  const canvas =
    $("#analysisCanvas");

  if (!canvas) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(
      1,
      Math.round(
        rect.width * ratio,
      ),
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        rect.height * ratio,
      ),
    );

  const context =
    canvas.getContext("2d");

  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0,
  );
}

function drawCurrentAnalysisView() {
  const canvas =
    $("#analysisCanvas");

  const data =
    ANALYSIS_VIEW_STATE.data;

  if (!canvas || !data) {
    return;
  }

  const context =
    canvas.getContext("2d");

  const width =
    canvas.getBoundingClientRect()
      .width;

  const height =
    canvas.getBoundingClientRect()
      .height;

  context.clearRect(
    0,
    0,
    width,
    height,
  );

  context.fillStyle = "#eef3f6";

  context.fillRect(
    0,
    0,
    width,
    height,
  );

  const isLight =
    String(data.plan || "")
      .toLowerCase() === "light";

  if (isLight) {
    drawLightAnalysis(
      context,
      width,
      height,
      data,
    );
  } else {
    drawProAnalysis(
      context,
      width,
      height,
      data,
    );
  }

  if (
    ANALYSIS_VIEW_STATE.activeTab ===
    "graphs"
  ) {
    drawAnalysisGraphs();
  }
}

function drawProAnalysis(
  context,
  width,
  height,
  data,
) {
  const frames =
    data.frames || [];

  const frame =
    frames[
      ANALYSIS_VIEW_STATE.currentFrame
    ];

  if (!frame) {
    drawNoAnalysisData(
      context,
      width,
      height,
    );

    return;
  }

  drawGroundLine(
    context,
    width,
    height - 35,
  );

  const convertPoint = drawStickFrame(

function drawLightAnalysis(
  context,
  width,
  height,
  data,
) {
  const frames =
    data.frames || [];

  let lightFrames =
    Array.isArray(data.lightFrames)
      ? [...data.lightFrames]
      : [];

  if (
    String(data.direction || "") ===
    "左"
  ) {
    lightFrames.reverse();
  }

  if (!lightFrames.length) {
    drawNoAnalysisData(
      context,
      width,
      height,
    );

    return;
  }

  const gap = 5;

  const itemWidth =
    (
      width -
      gap * (
        lightFrames.length + 1
      )
    ) / lightFrames.length;

  drawGroundLine(
    context,
    width,
    height - 37,
  );

  lightFrames.forEach(
    (item, index) => {
      const frame =
        frames[item.frame - 1];

      if (!frame) {
        return;
      }

      const left =
        gap +
        index *
          (itemWidth + gap);

      const convertPoint = drawStickFrame(
        context,
        frame.points,
        {
          left: left + 2,
          top: 34,
          width: itemWidth - 4,
          height: height - 78,
          scale: 1,
          referenceFrames: frames.map((item) => item.points),
        },
      );

      if (convertPoint) {
        drawAnalysisAuxiliary_(
          context,
          data,
          item.frame - 1,
          convertPoint,
          false,
        );
      }

      context.fillStyle =
        "#18323f";

      context.font =
        "800 9px sans-serif";

      context.textAlign =
        "center";

      context.fillText(
        item.label,
        left + itemWidth / 2,
        20,
      );
    },
  );

  const overlay =
    $("#analysisOverlay");

  if (overlay) {
    overlay.textContent =
      `${lightFrames.length}局面`;
  }
}

function drawStickFrame(
  context,
  points,
  area,
) {
  const validPoints =
    (points || []).filter(
      (point) =>
        point &&
        Number.isFinite(point.x) &&
        Number.isFinite(point.y),
    );

  if (!validPoints.length) {
    return null;
  }

  const hipCenter = getGreaterTrochanterCenter_(points);
  if (!hipCenter) return null;

  const referenceBounds = getHipRelativeBounds_(
    area.referenceFrames || [points],
  );

  const rangeX = Math.max(
    0.001,
    referenceBounds.maxX - referenceBounds.minX,
  );

  const rangeY = Math.max(
    0.001,
    referenceBounds.maxY - referenceBounds.minY,
  );

  const baseScale =
    Math.min(
      area.width / rangeX,
      area.height / rangeY,
    ) * 0.82;

  const scale =
    baseScale *
    (area.scale || 1);

  const centerX =
    area.left +
    area.width / 2 -
    (referenceBounds.minX + referenceBounds.maxX) / 2 * scale;

  const centerY =
    area.top +
    area.height / 2 +
    (referenceBounds.minY + referenceBounds.maxY) / 2 * scale;

  const convertPoint =
    (point) => ({
      x:
        centerX +
        (
          point.x -
          hipCenter.x
        ) *
          scale,

      y:
        centerY -
        (point.y - hipCenter.y) * scale,
    });

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.center,
    "#263238",
    convertPoint,
  );

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.right,
    "#1565c0",
    convertPoint,
  );

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.left,
    "#e53935",
    convertPoint,
  );

  points.forEach(
    (point, index) => {
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y)
      ) {
        return;
      }

      const converted =
        convertPoint(point);

      context.beginPath();

      context.arc(
        converted.x,
        converted.y,
        2.7,
        0,
        Math.PI * 2,
      );

      context.fillStyle =
        getStickPointColor(index);

      context.fill();
    },
  );

  return convertPoint;
}

function getGreaterTrochanterCenter_(points) {
  const right = points?.[13];
  const left = points?.[19];
  const isValid = (point) =>
    point &&
    Number.isFinite(point.x) &&
    Number.isFinite(point.y);

  if (isValid(right) && isValid(left)) {
    return {
      x: (right.x + left.x) / 2,
      y: (right.y + left.y) / 2,
    };
  }
  if (isValid(right)) return { x: right.x, y: right.y };
  if (isValid(left)) return { x: left.x, y: left.y };
  return null;
}

function getHipRelativeBounds_(referenceFrames) {
  const relativePoints = [];

  (referenceFrames || []).forEach((framePoints) => {
    const hipCenter = getGreaterTrochanterCenter_(framePoints);
    if (!hipCenter) return;

    (framePoints || []).forEach((point) => {
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y)
      ) return;

      relativePoints.push({
        x: point.x - hipCenter.x,
        y: point.y - hipCenter.y,
      });
    });
  });

  if (!relativePoints.length) {
    return { minX: -1, maxX: 1, minY: -1, maxY: 1 };
  }

  return {
    minX: Math.min(...relativePoints.map((point) => point.x)),
    maxX: Math.max(...relativePoints.map((point) => point.x)),
    minY: Math.min(...relativePoints.map((point) => point.y)),
    maxY: Math.max(...relativePoints.map((point) => point.y)),
  };
}

function drawAnalysisAuxiliary_(
  context,
  data,
  frameIndex,
  convertPoint,
  allowTrajectory,
) {
  if (
    allowTrajectory &&
    ANALYSIS_VIEW_STATE.showToeTrajectory
  ) {
    drawToeTrajectory_(context, data, frameIndex, convertPoint);
  }

  if (ANALYSIS_VIEW_STATE.showCenterOfMass) {
    drawCenterOfMassPoint_(context, data, frameIndex, convertPoint);
  }

  if (ANALYSIS_VIEW_STATE.showJointHighlight) {
    drawSelectedJointHighlight_(context, data, frameIndex, convertPoint);
  }
}

function drawToeTrajectory_(context, data, frameIndex, convertPoint) {
  const firstFoot = String(data.firstFoot || "右");
  const pointIndex = firstFoot === "左" ? 14 : 8;
  const color = firstFoot === "左" ? "rgba(229,57,53,.38)" : "rgba(21,101,192,.38)";
  const currentPoints = data.frames?.[frameIndex]?.points;
  const currentHipCenter = getGreaterTrochanterCenter_(currentPoints);
  if (!currentHipCenter) return;

  let started = false;

  context.beginPath();
  (data.frames || []).forEach((frame) => {
    const point = frame.points?.[pointIndex];
    const frameHipCenter = getGreaterTrochanterCenter_(frame.points);
    if (
      !point ||
      !Number.isFinite(point.x) ||
      !Number.isFinite(point.y) ||
      !frameHipCenter
    ) {
      started = false;
      return;
    }

    const hipRelativePoint = {
      x: currentHipCenter.x + point.x - frameHipCenter.x,
      y: currentHipCenter.y + point.y - frameHipCenter.y,
    };
    const converted = convertPoint(hipRelativePoint);
    if (started) context.lineTo(converted.x, converted.y);
    else {
      context.moveTo(converted.x, converted.y);
      started = true;
    }
  });

  context.strokeStyle = color;
  context.lineWidth = 1.5;
  context.lineCap = "round";
  context.lineJoin = "round";
  context.stroke();
}

function drawCenterOfMassPoint_(context, data, frameIndex, convertPoint) {
  const point = data.centerOfMass?.[frameIndex];
  if (!point || !Number.isFinite(Number(point.x)) || !Number.isFinite(Number(point.y))) return;

  const converted = convertPoint({ x: Number(point.x), y: Number(point.y) });
  context.beginPath();
  context.arc(converted.x, converted.y, 5, 0, Math.PI * 2);
  context.fillStyle = "#f6c344";
  context.fill();
  context.strokeStyle = "#7a5a00";
  context.lineWidth = 1.5;
  context.stroke();
}

function drawSelectedJointHighlight_(context, data, frameIndex, convertPoint) {
  const jointPointIndexes = [2, 3, 6, 7, 13, 12, 11, 19, 18, 17];
  const pointIndex = jointPointIndexes[ANALYSIS_VIEW_STATE.selectedJoint];
  const point = data.frames?.[frameIndex]?.points?.[pointIndex];
  if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;

  const converted = convertPoint(point);
  const color = getJointGraphColor(ANALYSIS_VIEW_STATE.selectedJoint);
  context.beginPath();
  context.arc(converted.x, converted.y, 8, 0, Math.PI * 2);
  context.strokeStyle = color;
  context.lineWidth = 2.5;
  context.stroke();
}

function drawStickConnections(
  context,
  points,
  connections,
  color,
  convertPoint,
) {
  context.strokeStyle = color;
  context.lineWidth = 3;
  context.lineCap = "round";
  context.lineJoin = "round";

  connections.forEach(
    ([startIndex, endIndex]) => {
      const start =
        points[startIndex];

      const end =
        points[endIndex];

      if (
        !start ||
        !end ||
        !Number.isFinite(start.x) ||
        !Number.isFinite(start.y) ||
        !Number.isFinite(end.x) ||
        !Number.isFinite(end.y)
      ) {
        return;
      }

      const convertedStart =
        convertPoint(start);

      const convertedEnd =
        convertPoint(end);

      context.beginPath();

      context.moveTo(
        convertedStart.x,
        convertedStart.y,
      );

      context.lineTo(
        convertedEnd.x,
        convertedEnd.y,
      );

      context.stroke();
    },
  );
}

function getStickPointColor(index) {
  if (
    [0, 1, 2, 3, 8, 9, 10, 11, 12, 13]
      .includes(index)
  ) {
    return "#1565c0";
  }

  if (
    [4, 5, 6, 7, 14, 15, 16, 17, 18, 19]
      .includes(index)
  ) {
    return "#e53935";
  }

  return "#263238";
}

function drawGroundLine(
  context,
  width,
  y,
) {
  context.beginPath();

  context.moveTo(12, y);
  context.lineTo(width - 12, y);

  context.strokeStyle =
    "#b8c7ce";

  context.lineWidth = 1;

  context.stroke();
}

    "スティックデータを表示できません",
    width / 2,
    height / 2,
  );
}

      function resizeAnalysisGraphCanvases() {
  [
    "centerOfMassGraphCanvas",
    "jointAngleGraphCanvas",
    "jointVelocityGraphCanvas",
  ].forEach((id) => {
    const canvas =
      document.getElementById(id);

    if (!canvas) {
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    if (
      rect.width <= 0 ||
      rect.height <= 0
    ) {
      return;
    }

    const ratio =
      window.devicePixelRatio || 1;

    canvas.width =
      Math.round(
        rect.width * ratio,
      );

    canvas.height =
      Math.round(
        rect.height * ratio,
      );

    canvas
      .getContext("2d")
      .setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0,
      );
  });
}

function drawAnalysisGraphs() {
  const data =
    ANALYSIS_VIEW_STATE.data;

  if (!data) {
    return;
  }

  const frameIndex =
    ANALYSIS_VIEW_STATE.currentFrame;

  const selectedJoint =
    ANALYSIS_VIEW_STATE.selectedJoint;

  const centerValues =
    (data.centerOfMass || []).map(
      (item) =>
        Number.isFinite(
          Number(item.y),
        )
          ? Number(item.y)
          : null,
    );

  const angleValues =
    getAnalysisGraphSeries(
      data.jointAngles,
      selectedJoint,
    );

  const velocityValues =
    getAnalysisGraphSeries(
      data.angularVelocities,
      selectedJoint,
    );

  drawAnalysisLineGraph(
    "centerOfMassGraphCanvas",
    centerValues,
    frameIndex,
    {
      color: "#176b87",
      zeroLine: false,
    },
  );

  drawAnalysisLineGraph(
    "jointAngleGraphCanvas",
    angleValues,
    frameIndex,
    {
      color:
        getJointGraphColor(
          selectedJoint,
        ),
      zeroLine: false,
    },
  );

  drawAnalysisLineGraph(
    "jointVelocityGraphCanvas",
    velocityValues,
    frameIndex,
    {
      color:
        getJointGraphColor(
          selectedJoint,
        ),
      zeroLine: true,
    },
  );

  setAnalysisGraphCurrentValues(
    centerValues,
    angleValues,
    velocityValues,
    frameIndex,
  );
}

function getAnalysisGraphSeries(
  graphData,
  jointIndex,
) {
  if (
    !graphData ||
    !Array.isArray(graphData.frames)
  ) {
    return [];
  }

  return graphData.frames.map(
    (frame) => {
      const value =
        frame.values?.[jointIndex];

      return Number.isFinite(
        Number(value),
      )
        ? Number(value)
        : null;
    },
  );
}

function drawAnalysisLineGraph(
  canvasId,
  values,
  currentIndex,
  options = {},
) {
  const canvas =
    document.getElementById(
      canvasId,
    );

  if (!canvas) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const width = rect.width;
  const height = rect.height;

  if (
    width <= 0 ||
    height <= 0
  ) {
    return;
  }

  const context =
    canvas.getContext("2d");

  context.clearRect(
    0,
    0,
    width,
    height,
  );

  context.fillStyle = "#f5f8fa";

  context.fillRect(
    0,
    0,
    width,
    height,
  );

  const numericValues =
    values.filter(
      (value) =>
        Number.isFinite(value),
    );

  if (!numericValues.length) {
    context.fillStyle =
      "#667b85";

    context.font =
      "700 12px sans-serif";

    context.textAlign =
      "center";

    context.fillText(
      "表示できるデータがありません",
      width / 2,
      height / 2,
    );

    return;
  }

  let minimum = Math.min(
    ...numericValues,
  );

  let maximum = Math.max(
    ...numericValues,
  );

  if (options.zeroLine) {
    minimum = Math.min(minimum, 0);
    maximum = Math.max(maximum, 0);
  }

  if (minimum === maximum) {
    minimum -= 1;
    maximum += 1;
  }

  const margin = {
    left: 42,
    right: 12,
    top: 14,
    bottom: 24,
  };

  const graphWidth =
    width -
    margin.left -
    margin.right;

  const graphHeight =
    height -
    margin.top -
    margin.bottom;

  const range =
    maximum - minimum;

  minimum -= range * 0.08;
  maximum += range * 0.08;

  const finalRange =
    maximum - minimum;

  const getX =
    (index) =>
      margin.left +
      (
        index /
        Math.max(
          1,
          values.length - 1,
        )
      ) *
        graphWidth;

  const getY =
    (value) =>
      margin.top +
      (
        (maximum - value) /
        finalRange
      ) *
        graphHeight;

  drawAnalysisGraphGrid(
    context,
    margin,
    graphWidth,
    graphHeight,
    minimum,
    maximum,
    getY,
    options.zeroLine,
  );

  context.beginPath();

  let started = false;

  values.forEach(
    (value, index) => {
      if (!Number.isFinite(value)) {
        started = false;
        return;
      }

      const x = getX(index);
      const y = getY(value);

      if (!started) {
        context.moveTo(x, y);
        started = true;
      } else {
        context.lineTo(x, y);
      }
    },
  );

  context.strokeStyle =
    options.color || "#176b87";

  context.lineWidth = 2.2;
  context.lineJoin = "round";
  context.lineCap = "round";
  context.stroke();

  const safeCurrentIndex =
    Math.max(
      0,
      Math.min(
        values.length - 1,
        currentIndex,
      ),
    );

  const markerX =
    getX(safeCurrentIndex);

  context.beginPath();

  context.moveTo(
    markerX,
    margin.top,
  );

  context.lineTo(
    markerX,
    margin.top + graphHeight,
  );

  context.strokeStyle =
    "rgba(196,61,75,.85)";

  context.lineWidth = 1.5;
  context.stroke();

  const currentValue =
    values[safeCurrentIndex];

  if (
    Number.isFinite(currentValue)
  ) {
    const markerY =
      getY(currentValue);

    context.beginPath();

    context.arc(
      markerX,
      markerY,
      4,
      0,
      Math.PI * 2,
    );

    context.fillStyle =
      "#c43d4b";

    context.fill();
  }

  context.fillStyle =
    "#667b85";

  context.font =
    "700 9px sans-serif";

  context.textAlign = "left";

  context.fillText(
    "1",
    margin.left,
    height - 7,
  );

  context.textAlign = "right";

  context.fillText(
    String(values.length),
    margin.left + graphWidth,
    height - 7,
  );
}

function drawAnalysisGraphGrid(
  context,
  margin,
  graphWidth,
  graphHeight,
  minimum,
  maximum,
  getY,
  showZeroLine,
) {
  context.font =
    "700 9px sans-serif";

  context.fillStyle =
    "#667b85";

  context.textAlign = "right";

  const divisions = 4;

  for (
    let index = 0;
    index <= divisions;
    index += 1
  ) {
    const ratio =
      index / divisions;

    const value =
      maximum -
      (maximum - minimum) *
        ratio;

    const y =
      margin.top +
      graphHeight * ratio;

    context.beginPath();

    context.moveTo(
      margin.left,
      y,
    );

    context.lineTo(
      margin.left + graphWidth,
      y,
    );

    context.strokeStyle =
      "rgba(102,123,133,.16)";

    context.lineWidth = 1;
    context.stroke();

    context.fillText(
      formatGraphAxisValue(value),
      margin.left - 5,
      y + 3,
    );
  }

  if (
    showZeroLine &&
    minimum <= 0 &&
    maximum >= 0
  ) {
    const zeroY = getY(0);

    context.beginPath();

    context.moveTo(
      margin.left,
      zeroY,
    );

    context.lineTo(
      margin.left + graphWidth,
      zeroY,
    );

    context.strokeStyle =
      "rgba(24,50,63,.55)";

    context.lineWidth = 1.2;
    context.stroke();
  }
}

function formatGraphAxisValue(value) {
  const absoluteValue =
    Math.abs(value);

  if (absoluteValue >= 1000) {
    return Math.round(value)
      .toString();
  }

  if (absoluteValue >= 100) {
    return value.toFixed(0);
  }

  if (absoluteValue >= 10) {
    return value.toFixed(1);
  }

  return value.toFixed(2);
}

function getJointGraphColor(index) {
  const rightIndexes = [
    0, 1, 4, 5, 6,
  ];

  const leftIndexes = [
    2, 3, 7, 8, 9,
  ];

  if (rightIndexes.includes(index)) {
    return "#1565c0";
  }

  if (leftIndexes.includes(index)) {
    return "#e53935";
  }

  return "#263238";
}

function setAnalysisGraphCurrentValues(
  centerValues,
  angleValues,
  velocityValues,
  frameIndex,
) {
  const centerElement =
    $("#centerOfMassGraphValue");

  const angleElement =
    $("#jointAngleGraphValue");

  const velocityElement =
    $("#jointVelocityGraphValue");

  const centerValue =
    centerValues[frameIndex];

  const angleValue =
    angleValues[frameIndex];

  const velocityValue =
    velocityValues[frameIndex];

  if (centerElement) {
    centerElement.textContent =
      Number.isFinite(centerValue)
        ? `${centerValue.toFixed(3)}m`
        : "-";
  }

  if (angleElement) {
    angleElement.textContent =
      Number.isFinite(angleValue)
        ? `${angleValue.toFixed(1)}°`
        : "-";
  }

  if (velocityElement) {
    velocityElement.textContent =
      Number.isFinite(velocityValue)
        ? `${velocityValue.toFixed(1)}°/秒`
        : "-";
  }
}
