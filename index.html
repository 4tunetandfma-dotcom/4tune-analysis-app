      .analysis-viewer {
  display: flex;
  flex-direction: column;
  gap: 7px;
  height: calc(100dvh - 12px);
  min-height: 0;
  padding: 8px;
  overflow: hidden;
  border-radius: 16px;
}

body.analysis-detail-mode .app {
  padding: 6px 9px;
}

body.analysis-detail-mode .brand {
  display: none;
}

.analysis-detail-shell {
  min-height: 0;
}

.analysis-canvas-wrap {
  position: relative;
  overflow: hidden;
  width: calc(100% - 8px);
  margin: 0 auto;
  flex: 0 0 auto;
  border-radius: 14px;
  background: #eef3f6;
  border: 1px solid var(--line);
}

.analysis-canvas {
  display: block;
  width: 100%;
  height: 215px;
  touch-action: none;
}

.analysis-back-button {
  position: absolute;
  top: 7px;
  left: 7px;
  z-index: 3;
  width: auto;
  min-height: 28px;
  padding: 0 9px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 9px;
  background: rgba(23,79,67,.82);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  box-shadow: 0 3px 10px rgba(23,79,67,.18);
}

.analysis-overlay {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 4px 7px;
  border-radius: 9px;
  background: rgba(11, 57, 84, 0.75);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  pointer-events: none;
}

.analysis-controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  flex: 0 0 auto;
  gap: 5px;
}

.analysis-control-button {
  min-height: 32px;
  padding: 0 5px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #fff;
  color: var(--navy);
  font-size: 11px;
  font-weight: 900;
}

.analysis-control-button.primary-control {
  border-color: var(--navy);
  background: var(--navy);
  color: #fff;
}

.analysis-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  flex: 0 0 auto;
  gap: 4px;
  padding: 3px;
  border-radius: 11px;
  background: #e5edf1;
}

.analysis-tab-button {
  min-height: 31px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
}

.analysis-tab-button.active {
  background: #fff;
  color: var(--navy);
  box-shadow: 0 5px 14px rgba(11, 57, 84, 0.12);
}

.analysis-tab-panel {
  display: none;
  min-height: 0;
}

.analysis-tab-panel.active {
  display: grid;
  flex: 1 1 auto;
  align-content: start;
  gap: 8px;
  min-height: 0;
  padding: 2px 3px 6px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

@media(max-height:740px) {
  .analysis-canvas { height: 195px; }
}

.analysis-setting {
  display: grid;
  gap: 7px;
}

.analysis-setting-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.analysis-setting input[type="range"] {
  width: 100%;
  accent-color: var(--blue);
}

.analysis-toggle-list {
  display: grid;
  gap: 5px;
}

.analysis-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 37px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
}

.analysis-toggle input {
  width: 20px;
  min-height: 20px;
  margin: 0;
  padding: 0;
  accent-color: var(--blue);
}

.analysis-metrics-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.analysis-metric {
  padding: 14px 8px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fff;
  text-align: center;
}

.analysis-metric small {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.analysis-metric strong {
  color: var(--navy);
  font-size: 21px;
}

.analysis-metric strong span {
  font-size: 11px;
}

.analysis-metric.speed {
  grid-column: 1 / -1;
  border-color: transparent;
  background: linear-gradient(145deg, var(--navy), var(--blue));
}

.analysis-metric.speed small {
  color: #c9eadf;
}

.analysis-metric.speed strong {
  color: #fff;
  font-size: 28px;
}

.analysis-section-selector {
  position: sticky;
  top: 0;
  z-index: 2;
  display: grid;
  gap: 5px;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: rgba(243,248,245,.96);
  box-shadow: 0 4px 10px rgba(23,79,67,.06);
}

.analysis-section-selector label {
  color: var(--navy);
  font-size: 10px;
  font-weight: 900;
}

.analysis-section-select {
  min-height: 36px;
  padding: 6px 10px;
  border-color: #bfd2da;
  border-radius: 9px;
  background: #fff;
  color: var(--navy);
  font-size: 12px;
  font-weight: 900;
}

.analysis-section-content {
  display: grid;
  gap: 10px;
}

.analysis-result-list {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
}

.analysis-result-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 41px;
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}

.analysis-result-row:first-child {
  border-top: 0;
}

.analysis-result-label {
  color: var(--text);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.45;
  white-space: pre-line;
}

.analysis-result-value {
  color: var(--navy);
  font-size: 16px;
  font-weight: 900;
  text-align: right;
  white-space: nowrap;
}

/* 分析項目の説明画像 */
.analysis-result-label-wrap {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 7px;
}

.analysis-help-button {
  display: inline-grid;
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  min-height: 22px;
  padding: 0;
  place-items: center;
  border: 1px solid #8dbbab;
  border-radius: 50%;
  background: #edf6f2;
  color: var(--blue);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;
  font-weight: 900;
  line-height: 1;
}

.analysis-help-button:active {
  transform: scale(.94);
  background: #dceee7;
}

.analysis-metric-label {
  display: flex !important;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.analysis-metric-label .analysis-help-button {
  flex-basis: 20px;
  width: 20px;
  height: 20px;
  min-height: 20px;
  font-size: 13px;
}

.analysis-help-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
  background: rgba(8, 28, 24, .72);
  backdrop-filter: blur(4px);
}

.analysis-help-modal.hidden {
  display: none;
}

.analysis-help-dialog {
  position: relative;
  overflow: hidden;
  width: min(100%, 620px);
  max-height: calc(100dvh - 36px);

      const API_READ_TTLS={getHomeSummary:30000,getRaceTicketDashboard:15000,getAthleteManagementData:30000,getFriendDashboard:30000,bootstrap:30000,getProducts:60000,getApplications:30000,getAnalysisResults:60000,getComparisonCandidates:60000,getComparisonAnalysisData:120000,getAnalysisData:120000,getRaceGraphData:60000,getTeamDashboard:60000,getTeamComparison:60000};
      const API_READ_CACHE=new Map(),API_INFLIGHT=new Map();let API_CACHE_EPOCH=0;
      function clearApiReadCache_(){API_CACHE_EPOCH++;API_READ_CACHE.clear();API_INFLIGHT.clear();STATE.raceGraphData=null;STATE.productsCachedAt=0;STATE.analysisResultsCachedAt=0;STATE.applicationsCachedAt=0;STATE.analysisData={};}
      function apiReadKey_(action,payload={}){const clean={...payload};delete clean.force;return JSON.stringify([STATE.idToken,action,clean]);}
      function seedApiRead_(action,payload,data){if(!data)return;API_READ_CACHE.set(apiReadKey_(action,payload),{data,at:Date.now()});while(API_READ_CACHE.size>20)API_READ_CACHE.delete(API_READ_CACHE.keys().next().value);}
      function invalidateForAction_(action){
        const groups={
          updateCoachTeam:["getTeamDashboard"],createAthleteRegistrationLink:["getTeamDashboard"],
          saveCoachAthlete:["bootstrap","getTeamDashboard","getProducts","getComparisonCandidates","getComparisonAnalysisData","getAnalysisData","getAnalysisResults","getAthleteManagementData","getRaceGraphData","getTeamComparison"],
          coachUpdateTeamAthlete:["bootstrap","getTeamDashboard","getProducts","getComparisonCandidates","getComparisonAnalysisData","getAnalysisData","getAnalysisResults","getAthleteManagementData","getRaceGraphData","getTeamComparison"],
          removeTeamMember:["getTeamDashboard","getProducts","getComparisonCandidates","getComparisonAnalysisData","getAnalysisData","getRaceGraphData","getTeamComparison"],
          joinTeamById:["getTeamDashboard","getProducts","getComparisonCandidates","getRaceGraphData","getTeamComparison"],
          leaveTeam:["getTeamDashboard","getProducts","getComparisonCandidates","getComparisonAnalysisData","getAnalysisData","getRaceGraphData","getTeamComparison"]
        };
        const affected=groups[action];if(!affected){clearApiReadCache_();return;}
        API_CACHE_EPOCH++;
        for(const key of API_READ_CACHE.keys())if(affected.includes(JSON.parse(key)[1]))API_READ_CACHE.delete(key);
        for(const key of API_INFLIGHT.keys())if(affected.includes(JSON.parse(key)[1]))API_INFLIGHT.delete(key);
        if(affected.includes("getRaceGraphData"))STATE.raceGraphData=null;
        if(affected.includes("getProducts"))STATE.productsCachedAt=0;
        if(affected.includes("getAnalysisResults"))STATE.analysisResultsCachedAt=0;
        if(affected.includes("getAnalysisData"))STATE.analysisData={};
      }
      function seedMutationResponse_(action,data){
        const team=data.teamDashboard||(typeof data.isCoach==="boolean"?data:null);
        if(team){const mode=team.isCoach?"coach":"join";seedApiRead_("getTeamDashboard",{mode},team);if(team.isCoach)seedApiRead_("getTeamDashboard",{},team);}
        if(data.bootstrap)seedApiRead_("bootstrap",{},data.bootstrap);
      }
      async function apiPost(action,payload={},options={}){
        const ttl=API_READ_TTLS[action]||0;
        const force=options.force===true||payload.force===true;
        const cachePayload={...payload};delete cachePayload.force;
        const key=JSON.stringify([STATE.idToken,action,cachePayload]);
        const isRead=action.startsWith("get")||action==="bootstrap"||action==="health";
        if(!isRead)invalidateForAction_(action);
        const epoch=API_CACHE_EPOCH;
        const cached=API_READ_CACHE.get(key);
        if(ttl&&!force&&cached&&Date.now()-cached.at<ttl)return cached.data;
        if(ttl&&!force&&API_INFLIGHT.has(key))return API_INFLIGHT.get(key);
        const run=(async()=>{
          const response=await fetch(CONFIG.GAS_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,idToken:STATE.idToken,payload})});
          if(!response.ok)throw new Error(`通信エラー: HTTP ${response.status}`);
          const data=await response.json();if(!data.success)throw new Error(data.message||"処理に失敗しました");
          if(!isRead&&epoch===API_CACHE_EPOCH)seedMutationResponse_(action,data);
          if(ttl&&epoch===API_CACHE_EPOCH){API_READ_CACHE.set(key,{data,at:Date.now()});while(API_READ_CACHE.size>20)API_READ_CACHE.delete(API_READ_CACHE.keys().next().value);}
          return data;
        })();
        if(ttl)API_INFLIGHT.set(key,run);
        try{return await run;}finally{if(API_INFLIGHT.get(key)===run)API_INFLIGHT.delete(key);}
      }

      async function getCachedApplications_(force=false){
        const fresh=STATE.applicationsCache&&Date.now()-STATE.applicationsCachedAt<VIEW_CACHE_TTL_MS;
        if(!force&&fresh)return STATE.applicationsCache;
        const result=await apiPost("getApplications",{},{force});
        STATE.applicationsCache=result.applications||[];
        STATE.applicationsCachedAt=Date.now();
        return STATE.applicationsCache;
      }

      const ATHLETE_REGISTRATION_TOKEN_KEY="4tuneAthleteRegistrationToken";

      function getAthleteRegistrationToken_(){
        const searchParams=new URLSearchParams(location.search);
        let token=searchParams.get("athleteRegister")||"";

        // LIFF認証後は元のクエリがliff.state内へ移される場合がある。
        if(!token){
          const liffState=searchParams.get("liff.state")||"";
          if(liffState){
            try{
              const restoredUrl=new URL(decodeURIComponent(liffState),location.origin);
              token=restoredUrl.searchParams.get("athleteRegister")||"";
            }catch(error){
              console.warn("liff.stateを解析できませんでした",error);
            }
          }
        }

        if(token){
          sessionStorage.setItem(ATHLETE_REGISTRATION_TOKEN_KEY,token);
          return token;
        }
        return sessionStorage.getItem(ATHLETE_REGISTRATION_TOKEN_KEY)||"";
      }

      function clearAthleteRegistrationToken_(){
        sessionStorage.removeItem(ATHLETE_REGISTRATION_TOKEN_KEY);
        history.replaceState({},document.title,location.pathname);
      }

      async function startApp(){
        // LINEログインへ移る前に、本人登録リンクのトークンを保持する。
        const athleteRegistrationToken=getAthleteRegistrationToken_();
        lock("LINEに接続中...");
        try{
          await liff.init({liffId:CONFIG.LIFF_ID});
          if(!liff.isLoggedIn()){
            getAthleteRegistrationToken_();
            liff.login({redirectUri:location.href});
            return;
          }
          STATE.idToken=liff.getIDToken();
          if(!STATE.idToken) throw new Error("LINE認証情報を取得できません。LIFFのScopeでopenidを確認してください");
          STATE.profile=await liff.getProfile();
          lock("登録情報を確認中...");
          STATE.data=await apiPost("bootstrap");
          const restoredAthleteRegistrationToken=athleteRegistrationToken||getAthleteRegistrationToken_();
          if(restoredAthleteRegistrationToken){await openAthleteRegistration_(restoredAthleteRegistrationToken);}
          else if(STATE.data.registered){renderHome();handleFriendInviteFromUrl_();}
          else{renderRegistration();}
        }catch(error){console.error(error);renderFatal(error.message||"アプリを起動できませんでした");}
        finally{unlock();}
      }

      }

      function renderAthleteCodeEntry_(){
        $("#screen").innerHTML=`<div class="stack"><section class="card hero"><small>ATHLETE REGISTRATION</small><h2>本人登録コード</h2><p>指導者から受け取った8文字のコードを入力してください。</p></section><form id="athleteCodeForm" class="card stack"><div class="field"><label class="required" for="athleteRegistrationCode">登録コード</label><input id="athleteRegistrationCode" maxlength="9" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="AB3K-7M2P" style="text-align:center;font-size:22px;font-weight:900;letter-spacing:.12em"></div><div id="formError" class="error"></div><button id="athleteCodeButton" class="primary" type="submit">コードを確認する</button><button class="secondary" type="button" onclick="renderRegistration()">戻る</button></form></div>`;
        $("#athleteRegistrationCode").addEventListener("input",formatAthleteRegistrationCode_);
        $("#athleteCodeForm").addEventListener("submit",submitAthleteRegistrationCode_);
      }

      function formatAthleteRegistrationCode_(event){
        const raw=event.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
        event.target.value=raw.length>4?`${raw.slice(0,4)}-${raw.slice(4)}`:raw;
      }

      async function submitAthleteRegistrationCode_(event){
        event.preventDefault();
        if(STATE.submitting)return;
        const code=$("#athleteRegistrationCode").value.toUpperCase().replace(/[^A-Z0-9]/g,"");

        STATE.submitting=true;$("#athleteCodeButton").disabled=true;lock("登録コードを確認中...");
        try{const invite=await apiPost("getAthleteRegistrationInvite",{token:code});renderAthleteRegistrationInvite_(invite,code);}
        catch(error){console.error(error);showError(error.message||"登録コードを確認できませんでした");}
        finally{STATE.submitting=false;unlock();const button=$("#athleteCodeButton");if(button)button.disabled=false;}
      }

        try{
          const invite=await apiPost("getAthleteRegistrationInvite",{token});

        }catch(error){
          console.error(error);
          alert(error.message||"登録リンクを確認できませんでした");

          if(STATE.data.registered)renderHome();else renderRegistration();

let MANUAL_PREVIEW_ID=0;
function drawManualPreviews_(){
 $$('[data-manual-stick]').forEach(canvas=>{
  const rect=canvas.getBoundingClientRect();if(rect.width<=0||rect.height<=0)return;
  const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);
  const context=canvas.getContext('2d');context.setTransform(ratio,0,0,ratio,0,0);context.fillStyle='#eef3f6';context.fillRect(0,0,rect.width,rect.height);
  const frames=MANUAL_SAMPLE_DATA.frames.map(frame=>frame.map(([x,y])=>({x,y})));
  drawGroundLine(context,rect.width,rect.height-12);
  drawStickFrame(context,frames[22],{left:4,top:0,width:rect.width-8,height:rect.height-8,referenceFrames:frames,scale:1});
 });
 $$('[data-manual-motion]').forEach(canvas=>{
  const rect=canvas.getBoundingClientRect();if(rect.width<=0||rect.height<=0)return;
  if(!canvas.id)canvas.id='manualMotionPreview'+(++MANUAL_PREVIEW_ID);
  const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*ratio);canvas.height=Math.round(rect.height*ratio);canvas.getContext('2d').setTransform(ratio,0,0,ratio,0,0);
  drawAnalysisLineGraph(canvas.id,MANUAL_SAMPLE_DATA.center,22,{color:'#246b58',zeroLine:false});
 });
 $$('[data-manual-race]').forEach(canvas=>{if(canvas.getBoundingClientRect().width<=0)return;const series=MANUAL_SAMPLE_DATA.raceValues.map((values,i)=>({color:COACH_RACE_COLORS[i],series:values.map((value,j)=>({label:MANUAL_SAMPLE_DATA.raceLabels[j],value}))}));drawRaceLineChart_(canvas,[],[],'m/s',series);});
}

      async function loadHomeTaskSummary() {
        const card = $("#homeTaskCard");
        if (!card) return;

        try {
          const summary=await apiPost("getHomeSummary");
          if($("#homeTaskCard")!==card)return;
          const applications=summary.applications||[];
          const raceData={applications:summary.raceApplications||[]};
          STATE.applicationsCache=applications;STATE.applicationsCachedAt=Date.now();
          seedApiRead_("getApplications",{},{success:true,applications});
          const raceActionable=(raceData.applications||[]).filter((item)=>!["キャンセル","完了","公開中"].includes(item.status)).map((item)=>({item,priority:item.videoSubmitted?2:0})).sort((a,b)=>a.priority-b.priority)[0];
          const actionable = applications
            .map((application) => ({
              application,
              progressIndex: getApplicationProgressIndex(application),
            }))
            .filter((item) => item.progressIndex < 5)
            .sort((a, b) => {
              const priority = (item) => {
                const statuses = (item.application.athletes || [])
                  .map((athlete) => athlete.status || "")
                  .join(" ");
                if (/動画提出待ち|未提出|動画待ち/.test(statuses)) return 0;
                if (item.progressIndex === 3) return 1;
                return 2;
              };
              return priority(a) - priority(b);
            })[0];

          if (raceActionable&&(!actionable||raceActionable.priority===0)) {
            const race=raceActionable.item;
            card.innerHTML=`<strong>${escapeHtml(race.videoSubmitted?"レース分析の完了をお待ちください":"レース動画を提出してください")}</strong><p>レース分析｜${escapeHtml(race.raceName)}・${escapeHtml(race.status)}</p><button class="secondary" style="margin-top:10px;min-height:40px" type="button">レース分析を確認</button>`;
            $("button",card)?.addEventListener("click",openRaceTicketDashboard);
            return;
          }

          if (!actionable) {
            card.classList.add("hm-task-clear");
            card.innerHTML = `
              <strong>現在、対応が必要な申し込みはありません</strong>
              
            `;
            return;
          }

          const application = actionable.application;
          card.innerHTML = `
            <strong>${escapeHtml(getApplicationNextAction(application, actionable.progressIndex))}</strong>
            <p>${escapeHtml(application.phase)}｜${escapeHtml(application.productName)}コース・${escapeHtml(application.applicationId)}</p>
            <button class="secondary" style="margin-top:10px;min-height:40px" type="button">申し込み状況を確認</button>
          `;
          $("button", card)?.addEventListener("click", openApplications);
        } catch (error) {
          if($("#homeTaskCard")!==card)return;
          console.error("ホームの進捗確認に失敗しました", error);
          card.innerHTML = `
            <strong>申し込み状況を取得できませんでした</strong>
            <p>「申し込み状況」から、もう一度確認してください。</p>
          `;
        }
      }

      async function openAthleteManagement() {
        document.body.classList.remove("analysis-detail-mode");
        lock("選手情報を読み込み中...");
        try {
          const [result,ticketData] = await Promise.all([apiPost("getAthleteManagementData"),apiPost("getRaceTicketDashboard")]);
          STATE.athleteManagement = result;
          STATE.raceTickets = ticketData;
          renderAthleteManagement();
        } catch (error) {
          console.error(error);
          alert(error.message || "選手情報を読み込めませんでした");
        } finally {
          unlock();
        }
      }

        try{

function teamComparisonChartLayout_(count,width,height){
 const shown=Math.min(Math.max(count,1),10),row=Math.min(76,Math.max(1,(height-25)/shown));

function drawTeamComparisonChart_(){
 const canvas=$('#tcChartCanvas'),viewport=$('#tcChartViewport');if(!canvas||!viewport)return;
 const records=STATE.teamComparison?.records||[],values=teamComparisonValues_(STATE.teamMetric,records),empty=$('#tcChartEmpty');
 $('#tcChartCount').textContent=`数値あり ${values.length}名 ／ 表示設定 ${records.length}名`;
 if(!values.length){canvas.classList.add('hidden');empty.classList.remove('hidden');empty.textContent=records.length?'この項目の数値データがありません。比較項目・日付を変更してください。':'表示する選手を選択してください。';return;}
 canvas.classList.remove('hidden');empty.classList.add('hidden');
 const rect=viewport.getBoundingClientRect(),layout=teamComparisonChartLayout_(values.length,viewport.clientWidth,rect.height),ratio=Math.min(window.devicePixelRatio||1,2);
 canvas.style.width=layout.width+'px';canvas.style.height=layout.height+'px';canvas.width=Math.round(layout.width*ratio);canvas.height=Math.round(layout.height*ratio);
 canvas.setAttribute('aria-label',`${STATE.teamMetric}：`+values.map(v=>`${v.name} ${v.value} (${teamComparisonDate_(v.date)})`).join('、'));
 const c=canvas.getContext('2d');c.setTransform(ratio,0,0,ratio,0,0);c.clearRect(0,0,layout.width,layout.height);
 const left=Math.min(95,layout.width*.29),right=Math.min(74,layout.width*.23),plot=Math.max(1,layout.width-left-right),min=Math.min(0,...values.map(v=>v.number)),max=Math.max(0,...values.map(v=>v.number)),span=max-min||1,x=v=>left+(v-min)/span*plot;
 c.font='9px sans-serif';c.textBaseline='middle';
 for(let tick=0;tick<=4;tick++){const value=min+span*tick/4,at=left+plot*tick/4;c.beginPath();c.moveTo(at,0);c.lineTo(at,layout.row*values.length);c.strokeStyle='#e2ebf1';c.lineWidth=1;c.stroke();c.fillStyle='#637b74';c.textAlign='center';c.fillText(Number(value.toFixed(2)).toString(),at,layout.row*values.length+12);}
 const fit=(text,maxWidth)=>{let t=String(text||'');while(t.length>1&&c.measureText(t).width>maxWidth)t=t.slice(0,-1);return t===String(text||'')?t:t+'…';};
 values.forEach((v,index)=>{const cy=layout.row*(index+.5),font=Math.max(7,Math.min(12,layout.row*.29)),twoLines=layout.row>=25;c.fillStyle='#173c32';c.textAlign='left';c.font=`bold ${font}px sans-serif`;c.fillText(fit(v.name,left-8),2,cy-(twoLines?6:0));if(twoLines){c.font=`${Math.max(7,font-2)}px sans-serif`;c.fillStyle='#637b74';c.fillText(teamComparisonDate_(v.date),2,cy+8);}const bar=Math.max(2,Math.min(23,layout.row*.4));c.fillStyle='#2374c6';c.fillRect(Math.min(x(0),x(v.number)),cy-bar/2,Math.abs(x(v.number)-x(0)),bar);c.fillStyle='#173c32';c.font=`bold ${font}px sans-serif`;c.fillText(fit(v.value,right-5),left+plot+6,cy);});

function drawRaceLineChart_(canvas, mainSeries, comparisonSeries, unit, extraSeries) {
  const chartSeries=extraSeries||[{series:mainSeries,color:"#246b58"},{series:comparisonSeries,color:"#e8751a"}];
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(rect.width * ratio));
  canvas.height = Math.max(1, Math.round(rect.height * ratio));
  const context = canvas.getContext("2d");
  context.setTransform(ratio, 0, 0, ratio, 0, 0);

  const width = rect.width;
  const height = rect.height;
  const padding = { left: 49, right: 17, top: 17, bottom: 33 };
  context.clearRect(0, 0, width, height);
  context.fillStyle = "#f7faf9";
  context.fillRect(0, 0, width, height);

  const labels = Array.from(new Set([
    ...chartSeries.flatMap(entry=>entry.series.map(item=>item.label)),
  ])).sort((a,b)=>String(a).localeCompare(String(b),"ja",{numeric:true}));
  const allValues = chartSeries.flatMap(entry=>entry.series)
    .map((item) => coachRaceNumber_(item.value))
    .filter(Number.isFinite);
  if (!labels.length || !allValues.length) return;

  let minValue = Math.min(...allValues);
  let maxValue = Math.max(...allValues);
  const span = Math.max(0.1, maxValue - minValue);
  minValue = Math.max(0, minValue - span * 0.15);
  maxValue += span * 0.15;
  if (maxValue === minValue) maxValue = minValue + 1;

  const plotWidth = width - padding.left - padding.right;
  const plotHeight = height - padding.top - padding.bottom;
  const xAt = (index) => padding.left + (labels.length === 1 ? plotWidth / 2 : index * plotWidth / (labels.length - 1));
  const yAt = (value) => padding.top + (maxValue - value) * plotHeight / (maxValue - minValue);

  context.font = "8.5px sans-serif";
  context.textBaseline = "middle";
  for (let tick = 0; tick <= 4; tick += 1) {
    const value = minValue + (maxValue - minValue) * tick / 4;
    const y = yAt(value);
    context.beginPath();
    context.moveTo(padding.left, y);
    context.lineTo(width - padding.right, y);
    context.strokeStyle = "#dce8e4";
    context.lineWidth = 1;
    context.stroke();
    context.fillStyle = "#637b74";
    context.textAlign = "right";
    context.fillText(`${value.toFixed(2)}${tick === 4 && unit ? ` ${unit}` : ""}`, padding.left - 5, y);
  }

  labels.forEach((label, index) => {
    context.fillStyle = "#637b74";
    context.textAlign = "center";
    context.textBaseline = "top";
    context.fillText(label, xAt(index), height - padding.bottom + 8);
  });

  const drawSeries = (series, color) => {
    const valueMap = new Map(series.map((item) => [item.label, coachRaceNumber_(item.value)]));
    context.beginPath();
    let started = false;
    labels.forEach((label, index) => {
      const value = valueMap.get(label);
      if (!Number.isFinite(value)){started=false;return;}
      const x = xAt(index);
      const y = yAt(value);
      if (started) context.lineTo(x, y);
      else { context.moveTo(x, y); started = true; }
    });
    context.strokeStyle = color;
    context.lineWidth = 2.2;
    context.lineJoin = "round";
    context.stroke();

    labels.forEach((label, index) => {
      const value = valueMap.get(label);
      if (!Number.isFinite(value)) return;
      context.beginPath();
      context.arc(xAt(index), yAt(value), 3.2, 0, Math.PI * 2);
      context.fillStyle = "#fff";
      context.fill();
      context.strokeStyle = color;
      context.lineWidth = 2;
      context.stroke();
    });
  };

  chartSeries.forEach(entry=>drawSeries(entry.series,entry.color));
}

async function openAnalysisDetail(
  analysisId,
) {
  const cached = STATE.analysisData[analysisId];
  if (cached) {
    renderAnalysisDetail(cached);
    return;
  }

  lock("分析データを読み込み中...");

  try {
    const result = await apiPost(
      "getAnalysisData",
      {
        analysisId,
      },
    );

    if (
      !result.success ||
      !result.analysis
    ) {
      throw new Error(
        result.message ||
          "分析データを読み込めませんでした",
      );
    }

    // 座標データは大きいため、端末内には直近2件だけ保持します。
    const cachedIds = Object.keys(STATE.analysisData);
    if (cachedIds.length >= 2) {
      delete STATE.analysisData[cachedIds[0]];
    }
    STATE.analysisData[analysisId] = result.analysis;
    renderAnalysisDetail(result.analysis);
  } catch (error) {
    console.error(error);

    alert(
      error.message ||
        "分析データを読み込めませんでした",
    );
  } finally {
    unlock();
  }
}

function getAnalysisHelpImageUrl(label) {
  const fileName = `${analysisHelpFileName(label)}.png`;
  const baseUrl = String(CONFIG.HELP_IMAGE_BASE_URL || "").replace(/\/+$/, "") + "/";
  return `${baseUrl}${encodeURIComponent(fileName)}?v=${encodeURIComponent(CONFIG.HELP_IMAGE_VERSION || "1")}`;
}

function openAnalysisHelpFromButton(button) {
  const encodedLabel = button?.dataset?.analysisHelpLabel || "";
  let label = "";

  try {
    label = decodeURIComponent(encodedLabel);
  } catch (error) {
    label = encodedLabel;
  }

  openAnalysisHelp(label);
}

function openAnalysisHelp(label) {
  const modal = $("#analysisHelpModal");
  const title = $("#analysisHelpTitle");
  const imageWrap = $("#analysisHelpImageWrap");
  if (!modal || !title || !imageWrap) return;

  const safeLabel = String(label || "項目の説明");
  const imageUrl = getAnalysisHelpImageUrl(safeLabel);
  title.textContent = safeLabel;
  imageWrap.innerHTML = `<div class="analysis-help-loading">説明画像を読み込み中...</div>`;

  const image = new Image();
  image.className = "analysis-help-image";
  image.alt = `${safeLabel}の説明`;
  image.onload = () => {
    imageWrap.innerHTML = "";
    imageWrap.appendChild(image);
  };
  image.onerror = () => handleAnalysisHelpImageError(safeLabel);
  image.src = imageUrl;

  modal.classList.remove("hidden");
  document.body.classList.add("analysis-help-modal-open");
}

function closeAnalysisHelp() {
  const modal = $("#analysisHelpModal");
  const imageWrap = $("#analysisHelpImageWrap");
  if (modal) modal.classList.add("hidden");
  if (imageWrap) imageWrap.innerHTML = "";
  document.body.classList.remove("analysis-help-modal-open");
}

function handleAnalysisHelpBackdrop(event) {
  if (event.target?.id === "analysisHelpModal") closeAnalysisHelp();
}

function handleAnalysisHelpImageError(label) {
  const imageWrap = $("#analysisHelpImageWrap");
  if (!imageWrap) return;

  const expectedName = `${analysisHelpFileName(label)}.png`;
  imageWrap.innerHTML = `
    <div class="analysis-help-error">
      説明画像を読み込めませんでした<br>
      GitHubに「${escapeHtml(expectedName)}」があるか確認してください
    </div>
  `;
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeAnalysisHelp();
});

function selectAnalysisMetricSection(sectionKey) {
  const sections = ANALYSIS_VIEW_STATE.data?.displaySections || [];
  const section = sections.find((item) => item.key === sectionKey);
  if (!section) return;

  ANALYSIS_VIEW_STATE.activeMetricSection = section.key;

  const select = $("#analysisSectionSelect");
  if (select && select.value !== section.key) select.value = section.key;

  const content = $("#analysisSectionContent");
  if (content) content.innerHTML = renderAnalysisSectionContent(section, ANALYSIS_VIEW_STATE.data?.plan);
}

function analysisMetricHtml(
  label,
  value,
  unit,
  digits,
  emphasized = false,
) {
  return `
    <div
      class="analysis-metric ${
        emphasized ? "speed" : ""
      }"
    >
      <small class="analysis-metric-label">
        <button
          class="analysis-help-button"
          type="button"
          data-analysis-help-label="${escapeHtml(encodeURIComponent(label))}"
          aria-label="${escapeHtml(label)}の説明を見る"
          title="${escapeHtml(label)}の説明を見る"
          onclick="openAnalysisHelpFromButton(this)"
        >i</button>
        <span>${escapeHtml(label)}</span>
      </small>

      <strong>
        ${formatAnalysisValue(
          value,
          digits,
        )}

        <span>
          ${escapeHtml(unit)}
        </span>
      </strong>
    </div>
  `;
}

function bindAnalysisViewerEvents() {
  $$("[data-analysis-tab]").forEach(
    (button) => {
      button.addEventListener(
        "click",
        () =>
          selectAnalysisTab(
            button.dataset.analysisTab,
          ),
      );
    },
  );

  const scaleRange =
    $("#analysisScaleRange");

  if (scaleRange) {
    scaleRange.addEventListener(
      "input",
      () => {
        ANALYSIS_VIEW_STATE.scale =
          Number(scaleRange.value);

        $("#analysisScaleValue")
          .textContent =
            `${scaleRange.value}%`;

        drawCurrentAnalysisView();
      },
    );
  }

  const speedRange =
    $("#analysisSpeedRange");

  if (speedRange) {
    speedRange.addEventListener(
      "input",
      () => {
        ANALYSIS_VIEW_STATE.speed =
          Number(speedRange.value);

        $("#analysisSpeedValue")
          .textContent =
            `${Number(
              speedRange.value,
            ).toFixed(2)}倍`;

        if (
          ANALYSIS_VIEW_STATE.playing
        ) {
          stopAnalysisPlayback();
          startAnalysisPlayback();
        }
      },
    );
  }

  const jointSelect =
    $("#analysisJointSelect");

  if (jointSelect) {
    jointSelect.addEventListener(
      "change",
      () => {
        ANALYSIS_VIEW_STATE
          .selectedJoint =
            Number(
              jointSelect.value,
            ) || 0;

        drawAnalysisGraphs();
        drawCurrentAnalysisView();
      },
    );
  }

  bindAnalysisToggle_("analysisCenterToggle", "showCenterOfMass");
  bindAnalysisToggle_("analysisToeToggle", "showToeTrajectory");
  bindAnalysisToggle_("analysisJointToggle", "showJointHighlight");

  $$('[data-graph-move]').forEach((button) => {
    button.addEventListener("click", () => {
      const card = button.closest('[data-analysis-graph]');
      if (!card) return;
      moveAnalysisGraph_(
        card.dataset.analysisGraph,
        button.dataset.graphMove,
      );
    });
  });

  const sectionSelect = $("#analysisSectionSelect");
  if (sectionSelect) {
    sectionSelect.addEventListener("change", () => {
      selectAnalysisMetricSection(sectionSelect.value);
    });
  }

  applyAnalysisGraphOrder_();
}

function moveAnalysisGraph_(graphKey, direction) {
  const order = [...ANALYSIS_VIEW_STATE.graphOrder];
  const currentIndex = order.indexOf(graphKey);
  const nextIndex = direction === "up"
    ? currentIndex - 1
    : currentIndex + 1;

  if (
    currentIndex < 0 ||
    nextIndex < 0 ||
    nextIndex >= order.length
  ) return;

  [order[currentIndex], order[nextIndex]] =
    [order[nextIndex], order[currentIndex]];

  ANALYSIS_VIEW_STATE.graphOrder = order;
  applyAnalysisGraphOrder_();
  resizeAnalysisGraphCanvases();
  drawAnalysisGraphs();
}

function applyAnalysisGraphOrder_() {
  const container = document.getElementById("analysisGraphCards");
  if (!container) return;

  ANALYSIS_VIEW_STATE.graphOrder.forEach((graphKey) => {
    const card = container.querySelector(
      `[data-analysis-graph="${graphKey}"]`,
    );
    if (card) container.appendChild(card);
  });

  const cards = Array.from(
    container.querySelectorAll('[data-analysis-graph]'),
  );
  cards.forEach((card, index) => {
    const up = card.querySelector('[data-graph-move="up"]');
    const down = card.querySelector('[data-graph-move="down"]');
    if (up) up.disabled = index === 0;
    if (down) down.disabled = index === cards.length - 1;
  });
}

function bindAnalysisToggle_(elementId, stateKey) {
  const element = document.getElementById(elementId);
  if (!element) return;

  element.addEventListener("change", () => {
    ANALYSIS_VIEW_STATE[stateKey] = element.checked;
    drawCurrentAnalysisView();
  });
}

function selectAnalysisTab(tabName) {
  ANALYSIS_VIEW_STATE.activeTab =
    tabName;

  $$("[data-analysis-tab]").forEach(
    (button) => {
      button.classList.toggle(
        "active",
        button.dataset.analysisTab ===
          tabName,
      );
    },
  );

  $$(".analysis-tab-panel").forEach(
    (panel) =>
      panel.classList.remove("active"),
  );

  const panels = {
    controls: "#analysisTabControls",
    metrics: "#analysisTabMetrics",
    graphs: "#analysisTabGraphs",
  };

  const target =
    $(panels[tabName]);

  if (target) {
    target.classList.add("active");
  }

  if (tabName === "graphs") {
    window.requestAnimationFrame(
      () => {
        resizeAnalysisGraphCanvases();
        drawAnalysisGraphs();
      },
    );
  }
}

function toggleAnalysisPlayback() {
  if (ANALYSIS_VIEW_STATE.playing) {
    stopAnalysisPlayback();
  } else {
    startAnalysisPlayback();
  }
}

function startAnalysisPlayback() {
  const data =
    ANALYSIS_VIEW_STATE.data;

  if (
    !data ||
    !Array.isArray(data.frames) ||
    !data.frames.length
  ) {
    return;
  }

  ANALYSIS_VIEW_STATE.playing = true;

  const button =
    $("#analysisPlayButton");

  if (button) {
    button.textContent = "停止";
  }

  scheduleNextAnalysisFrame();
}

function scheduleNextAnalysisFrame() {
  if (!ANALYSIS_VIEW_STATE.playing) {
    return;
  }

  const fps =
    Number(
      ANALYSIS_VIEW_STATE.data?.fps,
    ) || 30;

  const speed =
    ANALYSIS_VIEW_STATE.speed || 1;

  const delay =
    Math.max(
      4,
      1000 / fps / speed,
    );

  ANALYSIS_VIEW_STATE.timerId =
    window.setTimeout(
      () => {
        const frames =
          ANALYSIS_VIEW_STATE.data
            .frames;

        ANALYSIS_VIEW_STATE.currentFrame =
          (
            ANALYSIS_VIEW_STATE
              .currentFrame + 1
          ) % frames.length;

        drawCurrentAnalysisView();
        scheduleNextAnalysisFrame();
      },
      delay,
    );
}

function stopAnalysisPlayback() {
  ANALYSIS_VIEW_STATE.playing = false;

  if (
    ANALYSIS_VIEW_STATE.timerId
  ) {
    clearTimeout(
      ANALYSIS_VIEW_STATE.timerId,
    );

    ANALYSIS_VIEW_STATE.timerId =
      null;
  }

  const button =
    $("#analysisPlayButton");

  if (button) {
    button.textContent = "再生";
  }
}

function previousAnalysisFrame() {
  stopAnalysisPlayback();

  const frames =
    ANALYSIS_VIEW_STATE.data
      ?.frames || [];

  if (!frames.length) {
    return;
  }

  ANALYSIS_VIEW_STATE.currentFrame =
    (
      ANALYSIS_VIEW_STATE
        .currentFrame -
      1 +
      frames.length
    ) % frames.length;

  drawCurrentAnalysisView();
}

function nextAnalysisFrame() {
  stopAnalysisPlayback();

  const frames =
    ANALYSIS_VIEW_STATE.data
      ?.frames || [];

  if (!frames.length) {
    return;
  }

  ANALYSIS_VIEW_STATE.currentFrame =
    (
      ANALYSIS_VIEW_STATE
        .currentFrame + 1
    ) % frames.length;

  drawCurrentAnalysisView();
}

function resetAnalysisView() {
  stopAnalysisPlayback();

  ANALYSIS_VIEW_STATE.currentFrame = 0;
  ANALYSIS_VIEW_STATE.speed = 1;
  ANALYSIS_VIEW_STATE.scale = 100;

  const scale =
    $("#analysisScaleRange");

  const speed =
    $("#analysisSpeedRange");

  if (scale) {
    scale.value = "100";
  }

  if (speed) {
    speed.value = "1";
  }

  const scaleValue =
    $("#analysisScaleValue");

  const speedValue =
    $("#analysisSpeedValue");

  if (scaleValue) {
    scaleValue.textContent = "100%";
  }

  if (speedValue) {
    speedValue.textContent =
      "1.00倍";
  }

  drawCurrentAnalysisView();
}

function leaveAnalysisDetail() {
  stopAnalysisPlayback();
  document.body.classList.remove("analysis-detail-mode");

  window.removeEventListener(
    "resize",
    handleAnalysisResize,
  );

  if(STATE.coachRaceDetail){STATE.coachRaceDetail=false;renderRaceGraphScreen();return;}
  if(STATE.coachAnalysisAthleteId){renderCoachAthleteAnalyses_();return;}
  openAnalysisResults();
}

function handleAnalysisResize() {
  resizeAnalysisCanvas();
  drawCurrentAnalysisView();

  if (
    ANALYSIS_VIEW_STATE.activeTab ===
    "graphs"
  ) {
    resizeAnalysisGraphCanvases();
    drawAnalysisGraphs();
  }
}   

function resizeAnalysisCanvas() {
  const canvas =
    $("#analysisCanvas");

  if (!canvas) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(
      1,
      Math.round(
        rect.width * ratio,
      ),
    );

  canvas.height =
    Math.max(
      1,
      Math.round(
        rect.height * ratio,
      ),
    );

  const context =
    canvas.getContext("2d");

  context.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0,
  );
}

function drawCurrentAnalysisView() {
  syncAnalysisFramePosition_();
  const canvas =
    $("#analysisCanvas");

  const data =
    ANALYSIS_VIEW_STATE.data;

  if (!canvas || !data) {
    return;
  }

  const context =
    canvas.getContext("2d");

  const width =
    canvas.getBoundingClientRect()
      .width;

  const height =
    canvas.getBoundingClientRect()
      .height;

  context.clearRect(
    0,
    0,
    width,
    height,
  );

  context.fillStyle = "#eef3f6";

  context.fillRect(
    0,
    0,
    width,
    height,
  );

  drawAnalysisWatermark_(
    context,
    width,
    height,
  );

  const isLight =
    String(data.plan || "")
      .toLowerCase() === "light";

  if (isLight) {
    drawLightAnalysis(
      context,
      width,
      height,
      data,
    );
  } else {
    drawProAnalysis(
      context,
      width,
      height,
      data,
    );
  }

  if (
    ANALYSIS_VIEW_STATE.activeTab ===
    "graphs"
  ) {
    drawAnalysisGraphs();
  }
}

function drawAnalysisWatermark_(context, width, height) {
  if (!ANALYSIS_WATERMARK_IMAGE.complete || !ANALYSIS_WATERMARK_IMAGE.naturalWidth) {
    return;
  }

  const maxWidth = width * 0.48;
  const maxHeight = height * 0.62;
  const imageRatio =
    ANALYSIS_WATERMARK_IMAGE.naturalWidth /
    ANALYSIS_WATERMARK_IMAGE.naturalHeight;

  let drawWidth = maxWidth;
  let drawHeight = drawWidth / imageRatio;

  if (drawHeight > maxHeight) {
    drawHeight = maxHeight;
    drawWidth = drawHeight * imageRatio;
  }

  context.save();
  context.globalAlpha = 0.075;
  context.drawImage(
    ANALYSIS_WATERMARK_IMAGE,
    (width - drawWidth) / 2,
    (height - drawHeight) / 2,
    drawWidth,
    drawHeight,
  );
  context.restore();
}

function drawProAnalysis(
  context,
  width,
  height,
  data,
) {
  const frames =
    data.frames || [];

  const frame =
    frames[
      ANALYSIS_VIEW_STATE.currentFrame
    ];

  if (!frame) {
    drawNoAnalysisData(
      context,
      width,
      height,
    );

    return;
  }

  const convertPoint = drawStickFrame(
    context,
    frame.points,
    {
      left: 24,
      top: 10,
      width: width - 48,
      height: height - 22,
      scale:
        ANALYSIS_VIEW_STATE.scale /
        100,
      referenceFrames: frames.map((item) => item.points),
    },
  );

  if (convertPoint) {
    drawAnalysisAuxiliary_(
      context,
      data,
      ANALYSIS_VIEW_STATE.currentFrame,
      convertPoint,
      true,
    );
  }

  const overlay =
    $("#analysisOverlay");

  if (overlay) {
    overlay.textContent =
      `Frame ${frame.frame} / ` +
      `${data.frameCount}　` +
      `${Number(
        frame.time || 0,
      ).toFixed(3)}秒`;
  }
}

function drawLightAnalysis(
  context,
  width,
  height,
  data,
) {
  const frames =
    data.frames || [];

  let lightFrames =
    Array.isArray(data.lightFrames)
      ? [...data.lightFrames]
      : [];

  if (
    String(data.direction || "") ===
    "左"
  ) {
    lightFrames.reverse();
  }

  if (!lightFrames.length) {
    drawNoAnalysisData(
      context,
      width,
      height,
    );

    return;
  }

  const gap = 5;

  const itemWidth =
    (
      width -
      gap * (
        lightFrames.length + 1
      )
    ) / lightFrames.length;

  lightFrames.forEach(
    (item, index) => {
      const frame =
        frames[item.frame - 1];

      if (!frame) {
        return;
      }

      const left =
        gap +
        index *
          (itemWidth + gap);

      const convertPoint = drawStickFrame(
        context,
        frame.points,
        {
          left: left + 2,
          top: 27,
          width: itemWidth - 4,
          height: height - 34,
          scale: 1,
          referenceFrames: frames.map((item) => item.points),
        },
      );

      if (convertPoint) {
        drawAnalysisAuxiliary_(
          context,
          data,
          item.frame - 1,
          convertPoint,
          false,
        );
      }

      context.fillStyle =
        "#18323f";

      context.font =
        "800 9px sans-serif";

      context.textAlign =
        "center";

      context.fillText(
        item.label,
        left + itemWidth / 2,
        20,
      );
    },
  );

  const overlay =
    $("#analysisOverlay");

  if (overlay) {
    overlay.textContent =
      `${lightFrames.length}局面`;
  }
}

function drawStickFrame(
  context,
  points,
  area,
) {
  const validPoints =
    (points || []).filter(
      (point) =>
        point &&
        Number.isFinite(point.x) &&
        Number.isFinite(point.y),
    );

  if (!validPoints.length) {
    return null;
  }

  const hipCenter = getGreaterTrochanterCenter_(points);
  if (!hipCenter) return null;

  const referenceBounds = getHipRelativeBounds_(
    area.referenceFrames || [points],
  );

  const rangeX = Math.max(
    0.001,
    referenceBounds.maxX - referenceBounds.minX,
  );

  const rangeY = Math.max(
    0.001,
    referenceBounds.maxY - referenceBounds.minY,
  );

  const baseScale =
    Math.min(
      area.width / rangeX,
      area.height / rangeY,
    ) * 0.72;

  const scale =
    baseScale *
    (area.scale || 1);

  // 大転子中点を描画原点として固定します。
  // 比較時は両スティックの同一点が重なるため、姿勢差を直接比較できます。
  const centerX = area.left + area.width / 2;
  const centerY = area.top + area.height * 0.62;

  const convertPoint =
    (point) => ({
      x:
        centerX +
        (
          point.x -
          hipCenter.x
        ) *
          scale,

      y:
        centerY -
        (point.y - hipCenter.y) * scale,
    });

  const comparisonColor = area.stickColor || "";
  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.center,
    comparisonColor || "#263238",
    convertPoint,
  );

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.right,
    comparisonColor || "#1565c0",
    convertPoint,
  );

  drawStickConnections(
    context,
    points,
    ANALYSIS_CONNECTIONS.left,
    comparisonColor || "#e53935",
    convertPoint,
  );

  points.forEach(
    (point, index) => {
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y)
      ) {
        return;
      }

      const converted =
        convertPoint(point);

      context.beginPath();

      context.arc(
        converted.x,
        converted.y,
        2.7,
        0,
        Math.PI * 2,
      );

      context.fillStyle = comparisonColor || getStickPointColor(index);

      context.fill();
    },
  );

  return convertPoint;
}

function getGreaterTrochanterCenter_(points) {
  const right = points?.[13];
  const left = points?.[19];
  const isValid = (point) =>
    point &&
    Number.isFinite(point.x) &&
    Number.isFinite(point.y);

  if (isValid(right) && isValid(left)) {
    return {
      x: (right.x + left.x) / 2,
      y: (right.y + left.y) / 2,
    };
  }
  if (isValid(right)) return { x: right.x, y: right.y };
  if (isValid(left)) return { x: left.x, y: left.y };
  return null;
}

function getHipRelativeBounds_(referenceFrames) {
  const relativePoints = [];

  (referenceFrames || []).forEach((framePoints) => {
    const hipCenter = getGreaterTrochanterCenter_(framePoints);
    if (!hipCenter) return;

    (framePoints || []).forEach((point) => {
      if (
        !point ||
        !Number.isFinite(point.x) ||
        !Number.isFinite(point.y)
      ) return;

      relativePoints.push({
        x: point.x - hipCenter.x,
        y: point.y - hipCenter.y,
      });
    });
  });

  if (!relativePoints.length) {
    return { minX: -1, maxX: 1, minY: -1, maxY: 1 };
  }

  return {
    minX: Math.min(...relativePoints.map((point) => point.x)),
    maxX: Math.max(...relativePoints.map((point) => point.x)),
    minY: Math.min(...relativePoints.map((point) => point.y)),
    maxY: Math.max(...relativePoints.map((point) => point.y)),
  };
}

function drawAnalysisAuxiliary_(
  context,
  data,
  frameIndex,
  convertPoint,
  allowTrajectory,
) {
  if (
    allowTrajectory &&
    ANALYSIS_VIEW_STATE.showToeTrajectory
  ) {
    drawToeTrajectory_(context, data, frameIndex, convertPoint);
  }

  if (ANALYSIS_VIEW_STATE.showCenterOfMass) {
    drawCenterOfMassPoint_(context, data, frameIndex, convertPoint);
  }

  if (ANALYSIS_VIEW_STATE.showJointHighlight) {
    drawSelectedJointHighlight_(context, data, frameIndex, convertPoint);
  }
}

function drawToeTrajectory_(context, data, frameIndex, convertPoint) {
  const firstFoot = String(data.firstFoot || "右");
  const pointIndex = firstFoot === "左" ? 14 : 8;
  const color = firstFoot === "左" ? "rgba(229,57,53,.38)" : "rgba(21,101,192,.38)";
  const currentPoints = data.frames?.[frameIndex]?.points;
  const currentHipCenter = getGreaterTrochanterCenter_(currentPoints);
  if (!currentHipCenter) return;

  let started = false;

  context.beginPath();
  (data.frames || []).forEach((frame) => {
    const point = frame.points?.[pointIndex];
    const frameHipCenter = getGreaterTrochanterCenter_(frame.points);
    if (
      !point ||
      !Number.isFinite(point.x) ||
      !Number.isFinite(point.y) ||
      !frameHipCenter
    ) {
      started = false;
      return;
    }

    const hipRelativePoint = {
      x: currentHipCenter.x + point.x - frameHipCenter.x,
      y: currentHipCenter.y + point.y - frameHipCenter.y,
    };
    const converted = convertPoint(hipRelativePoint);
    if (started) context.lineTo(converted.x, converted.y);
    else {
      context.moveTo(converted.x, converted.y);
      started = true;
    }
  });

  context.strokeStyle = color;
  context.lineWidth = 1.5;
  context.lineCap = "round";
  context.lineJoin = "round";
  context.stroke();
}

function drawCenterOfMassPoint_(context, data, frameIndex, convertPoint) {
  const point = data.centerOfMass?.[frameIndex];
  if (!point || !Number.isFinite(Number(point.x)) || !Number.isFinite(Number(point.y))) return;

  const converted = convertPoint({ x: Number(point.x), y: Number(point.y) });
  context.beginPath();
  context.arc(converted.x, converted.y, 5, 0, Math.PI * 2);
  context.fillStyle = "#f6c344";
  context.fill();
  context.strokeStyle = "#7a5a00";
  context.lineWidth = 1.5;
  context.stroke();
}

function drawSelectedJointHighlight_(context, data, frameIndex, convertPoint) {
  const jointPointIndexes = [2, 3, 6, 7, 13, 12, 11, 19, 18, 17];
  const pointIndex = jointPointIndexes[ANALYSIS_VIEW_STATE.selectedJoint];
  const point = data.frames?.[frameIndex]?.points?.[pointIndex];
  if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;

  const converted = convertPoint(point);
  const color = getJointGraphColor(ANALYSIS_VIEW_STATE.selectedJoint);
  context.beginPath();
  context.arc(converted.x, converted.y, 8, 0, Math.PI * 2);
  context.strokeStyle = color;
  context.lineWidth = 2.5;

}

function drawStickConnections(
  context,
  points,
  connections,
  color,
  convertPoint,
) {
  context.strokeStyle = color;
  context.lineWidth = 2.3;
  context.lineCap = "round";
  context.lineJoin = "round";

  connections.forEach(
    ([startIndex, endIndex]) => {
      const start =
        points[startIndex];

      const end =
        points[endIndex];

      if (
        !start ||
        !end ||
        !Number.isFinite(start.x) ||
        !Number.isFinite(start.y) ||
        !Number.isFinite(end.x) ||
        !Number.isFinite(end.y)
      ) {
        return;
      }

      const convertedStart =
        convertPoint(start);

      const convertedEnd =
        convertPoint(end);

      context.beginPath();

      context.moveTo(
        convertedStart.x,
        convertedStart.y,
      );

      context.lineTo(
        convertedEnd.x,
        convertedEnd.y,
      );

      context.stroke();
    },
  );
}

function getStickPointColor(index) {
  if (
    [0, 1, 2, 3, 8, 9, 10, 11, 12, 13]
      .includes(index)
  ) {
    return "#1565c0";
  }

  if (
    [4, 5, 6, 7, 14, 15, 16, 17, 18, 19]
      .includes(index)
  ) {
    return "#e53935";
  }

  return "#263238";
}

function drawGroundLine(
  context,
  width,
  y,
) {
  context.beginPath();

  context.moveTo(12, y);
  context.lineTo(width - 12, y);

  context.strokeStyle =
    "#b8c7ce";

  context.lineWidth = 1;

  context.stroke();
}

function drawNoAnalysisData(
  context,
  width,
  height,
) {
  context.fillStyle =
    "#667b85";

  context.font =
    "700 13px sans-serif";

  context.textAlign =
    "center";

  context.fillText(
    "スティックデータを表示できません",

    height / 2,
  );
}

      function resizeAnalysisGraphCanvases() {
  [
    "centerOfMassGraphCanvas",
    "jointAngleGraphCanvas",
    "jointVelocityGraphCanvas",
  ].forEach((id) => {
    const canvas =
      document.getElementById(id);

    if (!canvas) {
      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    if (
      rect.width <= 0 ||
      rect.height <= 0
    ) {
      return;
    }

    const ratio =
      window.devicePixelRatio || 1;

    canvas.width =
      Math.round(
        rect.width * ratio,
      );

    canvas.height =
      Math.round(
        rect.height * ratio,
      );

    canvas
      .getContext("2d")
      .setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0,
      );
  });

function drawAnalysisGraphs() {
  const data =
    ANALYSIS_VIEW_STATE.data;

  if (!data) {
    return;
  }

  const frameIndex =
    ANALYSIS_VIEW_STATE.currentFrame;

  const selectedJoint =
    ANALYSIS_VIEW_STATE.selectedJoint;

  const centerValues =
    (data.centerOfMass || []).map(
      (item) =>
        Number.isFinite(
          Number(item.y),
        )
          ? Number(item.y)
          : null,
    );

  const angleValues =
    getAnalysisGraphSeries(
      data.jointAngles,
      selectedJoint,
    );

  const velocityValues =
    getAnalysisGraphSeries(
      data.angularVelocities,
      selectedJoint,
    );

  drawAnalysisLineGraph(
    "centerOfMassGraphCanvas",
    centerValues,
    frameIndex,
    {
      color: "#246b58",
      zeroLine: false,
    },
  );

  drawAnalysisLineGraph(
    "jointAngleGraphCanvas",
    angleValues,
    frameIndex,
    {
      color:
        getJointGraphColor(
          selectedJoint,
        ),
      zeroLine: false,
    },
  );

  drawAnalysisLineGraph(
    "jointVelocityGraphCanvas",
    velocityValues,
    frameIndex,
    {
      color:
        getJointGraphColor(
          selectedJoint,
        ),
      zeroLine: true,
    },
  );

  setAnalysisGraphCurrentValues(
    centerValues,
    angleValues,
    velocityValues,
    frameIndex,
  );
}

function getAnalysisGraphSeries(
  graphData,
  jointIndex,
) {
  if (
    !graphData ||
    !Array.isArray(graphData.frames)
  ) {
    return [];
  }

  return graphData.frames.map(
    (frame) => {
      const value =
        frame.values?.[jointIndex];

      return Number.isFinite(
        Number(value),
      )
        ? Number(value)
        : null;
    },
  );
}

function drawAnalysisLineGraph(
  canvasId,
  values,
  currentIndex,
  options = {},
) {
  const canvas =
    document.getElementById(
      canvasId,
    );

  if (!canvas) {
    return;
  }

  const rect =
    canvas.getBoundingClientRect();

  const width = rect.width;
  const height = rect.height;

  if (
    width <= 0 ||
    height <= 0
  ) {
    return;
  }

  const context =
    canvas.getContext("2d");

  context.clearRect(
    0,
    0,
    width,
    height,
  );

  context.fillStyle = "#f5f8fa";

  context.fillRect(
    0,
    0,
    width,
    height,
  );

  const numericValues =
    values.filter(
      (value) =>
        Number.isFinite(value),
    );

  if (!numericValues.length) {
    context.fillStyle =
      "#667b85";

    context.font =
      "700 12px sans-serif";

    context.textAlign =
      "center";

    context.fillText(
      "表示できるデータがありません",
      width / 2,
      height / 2,
    );

    return;
  }

  let minimum = Math.min(
    ...numericValues,
  );

  let maximum = Math.max(
    ...numericValues,
  );

  if (options.zeroLine) {
    minimum = Math.min(minimum, 0);
    maximum = Math.max(maximum, 0);
  }

  if (minimum === maximum) {
    minimum -= 1;
    maximum += 1;
  }

  const margin = {
    left: 42,
    right: 12,
    top: 14,
    bottom: 24,
  };

  const graphWidth =
    width -
    margin.left -
    margin.right;

  const graphHeight =
    height -
    margin.top -
    margin.bottom;

  const range =
    maximum - minimum;

  minimum -= range * 0.08;
  maximum += range * 0.08;

  const finalRange =
    maximum - minimum;

  const getX =
    (index) =>
      margin.left +
      (
        index /
        Math.max(
          1,
          values.length - 1,
        )
      ) *
        graphWidth;

  const getY =
    (value) =>
      margin.top +
      (
        (maximum - value) /
        finalRange
      ) *
        graphHeight;

  drawAnalysisGraphGrid(
    context,
    margin,
    graphWidth,
    graphHeight,
    minimum,
    maximum,
    getY,
    options.zeroLine,
  );

  context.beginPath();

  let started = false;

  values.forEach(
    (value, index) => {
      if (!Number.isFinite(value)) {
        started = false;
        return;
      }

      const x = getX(index);
      const y = getY(value);

      if (!started) {
        context.moveTo(x, y);
        started = true;
      } else {
        context.lineTo(x, y);
      }
    },
  );

  context.strokeStyle =
    options.color || "#246b58";

  context.lineWidth = 2.2;
  context.lineJoin = "round";
  context.lineCap = "round";
  context.stroke();

  const safeCurrentIndex =
    Math.max(
      0,
      Math.min(
        values.length - 1,
        currentIndex,
      ),
    );

  const markerX =
    getX(safeCurrentIndex);

  context.beginPath();

  context.moveTo(
    markerX,
    margin.top,
  );

  context.lineTo(
    markerX,
    margin.top + graphHeight,
  );

  context.strokeStyle =
    "rgba(196,61,75,.85)";

  context.lineWidth = 1.5;
  context.stroke();

  const currentValue =
    values[safeCurrentIndex];

  if (
    Number.isFinite(currentValue)
  ) {
    const markerY =
      getY(currentValue);

    context.beginPath();

    context.arc(
      markerX,
      markerY,
      4,
      0,
      Math.PI * 2,
    );

    context.fillStyle =
      "#c43d4b";

    context.fill();
  }

  context.fillStyle =
    "#667b85";

  context.font =
    "700 9px sans-serif";

  context.textAlign = "left";

  context.fillText(
    "1",
    margin.left,
    height - 7,
  );

  context.textAlign = "right";

  context.fillText(
    String(values.length),
    margin.left + graphWidth,
    height - 7,
  );
}

function drawAnalysisGraphGrid(
  context,
  margin,
  graphWidth,
  graphHeight,
  minimum,
  maximum,
  getY,
  showZeroLine,
) {
  context.font =
    "700 9px sans-serif";

  context.fillStyle =
    "#667b85";

  context.textAlign = "right";

  const divisions = 4;

  for (
    let index = 0;
    index <= divisions;
    index += 1
  ) {
    const ratio =
      index / divisions;

    const value =
      maximum -
      (maximum - minimum) *
        ratio;

    const y =
      margin.top +
      graphHeight * ratio;

    context.beginPath();

    context.moveTo(
      margin.left,
      y,
    );

    context.lineTo(
      margin.left + graphWidth,
      y,
    );

    context.strokeStyle =
      "rgba(102,123,133,.16)";

    context.lineWidth = 1;
    context.stroke();

    context.fillText(
      formatGraphAxisValue(value),
      margin.left - 5,
      y + 3,
    );
  }

  if (
    showZeroLine &&
    minimum <= 0 &&
    maximum >= 0
  ) {
    const zeroY = getY(0);

    context.beginPath();

    context.moveTo(
      margin.left,
      zeroY,
    );

    context.lineTo(
      margin.left + graphWidth,
      zeroY,
    );

    context.strokeStyle =
      "rgba(24,50,63,.55)";

    context.lineWidth = 1.2;
    context.stroke();
  }
}

function formatGraphAxisValue(value) {
  const absoluteValue =
    Math.abs(value);

  if (absoluteValue >= 1000) {
    return Math.round(value)
      .toString();
  }

  if (absoluteValue >= 100) {
    return value.toFixed(0);
  }

  if (absoluteValue >= 10) {
    return value.toFixed(1);
  }

  return value.toFixed(2);
}

function getJointGraphColor(index) {
  const rightIndexes = [
    0, 1, 4, 5, 6,
  ];

  const leftIndexes = [
    2, 3, 7, 8, 9,
  ];

  if (rightIndexes.includes(index)) {
    return "#1565c0";
  }

  if (leftIndexes.includes(index)) {
    return "#e53935";
  }

  return "#263238";
}

function setAnalysisGraphCurrentValues(
  centerValues,
  angleValues,
  velocityValues,
  frameIndex,
) {
  const centerElement =
    $("#centerOfMassGraphValue");

  const angleElement =
    $("#jointAngleGraphValue");

  const velocityElement =
    $("#jointVelocityGraphValue");

  const centerValue =
    centerValues[frameIndex];

  const angleValue =
    angleValues[frameIndex];

  const velocityValue =
    velocityValues[frameIndex];

  if (centerElement) {
    centerElement.textContent =
      Number.isFinite(centerValue)
        ? `${centerValue.toFixed(3)}m`
        : "-";
  }

  if (angleElement) {
    angleElement.textContent =
      Number.isFinite(angleValue)
        ? `${angleValue.toFixed(1)}°`
        : "-";
  }

  if (velocityElement) {
    velocityElement.textContent =
      Number.isFinite(velocityValue)
        ? `${velocityValue.toFixed(1)}°/秒`
        : "-";
  }
}
    </script>

    </div>
