<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b3954">
    <title>4TUNE 動作分析</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
      :root {
        --navy:#0b3954; --blue:#176b87; --aqua:#4fb3bf; --bg:#f3f7f9;
        --card:#fff; --text:#18323f; --muted:#667b85; --line:#dbe6eb;
        --success:#18865a; --danger:#c43d4b; --warning:#b76a00;
        --shadow:0 12px 32px rgba(11,57,84,.10);
      }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#eaf3f6 0,var(--bg) 260px);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
      button,input,select,textarea{font:inherit} button{cursor:pointer}
      .app{width:min(100%,680px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
      .brand{display:flex;align-items:center;gap:12px;margin:4px 4px 18px}.brand-mark{display:grid;width:46px;height:46px;place-items:center;border-radius:14px;background:var(--navy);color:#fff;font-weight:900;box-shadow:var(--shadow)}
      .brand h1{margin:0;font-size:19px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
      .card{padding:18px;border:1px solid rgba(219,230,235,.95);border-radius:21px;background:rgba(255,255,255,.97);box-shadow:var(--shadow)}
      .stack{display:grid;gap:14px}.hidden{display:none!important}
      .hero{background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff}.hero small{color:#bce9ef;font-weight:800;letter-spacing:.08em}.hero h2{margin:7px 0 0;font-size:24px;line-height:1.35}.hero p{margin:9px 0 0;color:#d9edf2;font-size:13px;line-height:1.7}
      .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2,.section-title h3{margin:0;font-size:18px}.section-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
      .field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800}.required::after{content:" 必須";color:var(--danger);font-size:10px}
      input,select,textarea{width:100%;min-height:46px;border:1px solid #cad9df;border-radius:12px;background:#fff;color:var(--text);padding:10px 12px;outline:none}textarea{min-height:86px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(79,179,191,.16)}
      .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.muted{color:var(--muted);font-size:11px;line-height:1.6}
      .choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:grid;min-height:44px;place-items:center;border:1px solid var(--line);border-radius:12px;background:#f8fafb;font-size:12px;font-weight:800}.choice input:checked+span{border-color:var(--blue);background:#e8f3f6;color:var(--blue)}
      .athlete-card{position:relative;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fbfdfe}.athlete-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.athlete-head strong{font-size:14px}.remove{border:0;background:transparent;color:var(--danger);font-size:12px;font-weight:800}
      .primary,.secondary{width:100%;min-height:48px;border-radius:14px;font-weight:850}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid #bfd2da;background:#fff;color:var(--blue)}.primary:disabled,.secondary:disabled{cursor:not-allowed;opacity:.5}
      .notice{padding:12px;border-radius:12px;background:#eef6f8;color:#365e6c;font-size:12px;line-height:1.65}.error{display:none;padding:12px;border-radius:12px;background:#fdecef;color:#8e2834;font-size:12px;line-height:1.65;white-space:pre-wrap}.error.visible{display:block}
      .profile-line{display:flex;align-items:center;gap:11px}.avatar{width:48px;height:48px;border-radius:50%;background:#e6eef1;object-fit:cover}.profile-line strong{display:block}.profile-line span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
      .task-card{padding:15px;border-radius:16px;background:linear-gradient(135deg,#fff7e8,#fff);border:1px solid #f0d7ae}.task-card strong{font-size:13px}.task-card p{margin:5px 0 0;color:#79511a;font-size:11px}
      .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu-button{min-height:92px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left}.menu-button b{display:block;color:var(--navy);font-size:14px}.menu-button span{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.45}.menu-button.primary-menu{border:0;background:linear-gradient(145deg,var(--blue),var(--navy));color:#fff}.menu-button.primary-menu b,.menu-button.primary-menu span{color:#fff}
      .athlete-summary{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.athlete-summary:first-child{border-top:0}.athlete-summary b{font-size:14px}.athlete-summary span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.pill{align-self:flex-start;padding:5px 8px;border-radius:99px;background:#e5f4ef;color:var(--success);font-size:10px;font-weight:800}
      .product-grid,.select-list{display:grid;gap:10px}.product-option,.athlete-option{position:relative}.product-option input,.athlete-option input{position:absolute;opacity:0;pointer-events:none}.product-box,.athlete-box{display:block;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.product-option input:checked+.product-box,.athlete-option input:checked+.athlete-box{border-color:var(--blue);background:#eaf5f7;box-shadow:0 0 0 2px rgba(23,107,135,.08)}.product-top,.athlete-box{display:flex;justify-content:space-between;gap:12px}.product-box b,.athlete-box b{font-size:14px}.product-box small,.athlete-box small{display:block;margin-top:5px;color:var(--muted)}.price{color:var(--blue);font-size:17px;font-weight:900}.old-price{display:block;color:var(--muted);font-size:10px;text-decoration:line-through;text-align:right}
      .shooting-card{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fbfdfe}.shooting-card h4{margin:0 0 12px;font-size:14px}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.summary-row:first-child{border-top:0}.summary-row.total{margin-top:4px;padding-top:13px;font-size:16px;font-weight:900}.discount{color:var(--success)}
      .loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(243,247,249,.94);backdrop-filter:blur(5px)}.loading.hidden{display:none}.loading-box{text-align:center}.spinner{width:46px;height:46px;margin:0 auto 13px;border:4px solid #d5e6eb;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}.loading p{margin:0;color:var(--navy);font-weight:800}@keyframes spin{to{transform:rotate(360deg)}}
      @media(max-width:430px){.grid-2{grid-template-columns:1fr}.choice-row{grid-template-columns:1fr 1fr 1fr}.card{padding:16px}}
    </style>
  </head>
  <body>
    <div id="loading" class="loading"><div class="loading-box"><div class="spinner"></div><p id="loadingText">読み込み中...</p></div></div>
    <main class="app">
      <header class="brand"><div class="brand-mark">4T</div><div><h1>4TUNE 動作分析</h1><p>走りを「感覚」から「データ」へ</p></div></header>
      <div id="screen"></div>
    </main>

    <script>
      const CONFIG=Object.freeze({
        LIFF_ID:"2011019778-43fXNNSl",
        GAS_URL:"https://script.google.com/macros/s/AKfycbyJ4ymLEm7orQhn3EcN4uAj7bFZaHQiGGEN-HcYSEcyjICs9bB7OC5GVsKH6lx8eBiiqw/exec"
      });
      const STATE={idToken:null,profile:null,data:null,products:[],submitting:false};
      const $=(selector,root=document)=>root.querySelector(selector);
      const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
      const escapeHtml=(value)=>String(value??"").replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
      function lock(message="処理中..."){ $("#loadingText").textContent=message; $("#loading").classList.remove("hidden"); }
      function unlock(){ $("#loading").classList.add("hidden"); }
      function showError(message){ const box=$("#formError")||$("#pageError"); if(box){box.textContent=String(message||"エラーが発生しました");box.classList.add("visible");box.scrollIntoView({behavior:"smooth",block:"center"});}else alert(message); }

      async function apiPost(action,payload={}){
        const response=await fetch(CONFIG.GAS_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,idToken:STATE.idToken,payload})});
        if(!response.ok) throw new Error(`通信エラー: HTTP ${response.status}`);
        const data=await response.json();
        if(!data.success) throw new Error(data.message||"処理に失敗しました");
        return data;
      }

      async function startApp(){
        lock("LINEに接続中...");
        try{
          await liff.init({liffId:CONFIG.LIFF_ID});
          if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}
          STATE.idToken=liff.getIDToken();
          if(!STATE.idToken) throw new Error("LINE認証情報を取得できません。LIFFのScopeでopenidを確認してください");
          STATE.profile=await liff.getProfile();
          lock("登録情報を確認中...");
          STATE.data=await apiPost("bootstrap");
          STATE.data.registered?renderHome():renderRegistration();
        }catch(error){console.error(error);renderFatal(error.message||"アプリを起動できませんでした");}
        finally{unlock();}
      }

      function renderFatal(message){
        $("#screen").innerHTML=`<section class="card stack"><div><h2>起動できませんでした</h2><p class="muted">設定または通信状況を確認してください</p></div><div id="pageError" class="error visible">${escapeHtml(message)}</div><button class="primary" onclick="location.reload()">もう一度試す</button></section>`;
      }

      function renderRegistration(){
        const displayName=STATE.profile?.displayName||STATE.data?.profile?.displayName||"";
        $("#screen").innerHTML=`
          <div class="stack">
            <section class="card hero"><small>FIRST REGISTRATION</small><h2>最初に利用者情報を登録します</h2><p>登録内容は後から変更できます。指導者は選手を登録せずに開始できます。</p></section>
            <form id="registrationForm" class="stack" novalidate>
              <section class="card stack">
                <div class="section-title"><div><h2>申込者情報</h2><p>このLINEアカウントを利用する方</p></div></div>
                <div class="field"><label class="required" for="applicantName">申込者名</label><input id="applicantName" maxlength="80" autocomplete="name" value="${escapeHtml(displayName)}"></div>
                <div class="field"><label class="required">申込者区分</label><div class="choice-row">
                  ${["本人","保護者","指導者"].map((type,index)=>`<label class="choice"><input type="radio" name="applicantType" value="${type}" ${index===0?"checked":""}><span>${type}</span></label>`).join("")}
                </div></div>
                <div class="grid-2">
                  <div class="field"><label for="guardianName">保護者名（任意）</label><input id="guardianName" maxlength="80"></div>
                  <div class="field"><label for="role">役職（任意）</label><input id="role" maxlength="80" placeholder="例：監督、コーチ"></div>
                </div>
              </section>

              <section class="card stack">
                <div class="section-title"><div><h2>選手情報</h2><p>複数人登録できます</p></div><button id="addAthleteButton" class="secondary" style="width:auto;min-height:38px;padding:0 12px" type="button">＋追加</button></div>
                <div id="athleteList" class="stack"></div>
                <p id="coachNote" class="notice hidden">指導者は選手を登録せずに開始できます。選手は後から追加または招待できます。</p>
              </section>

              <section class="card stack">
                <div class="notice">現在はテスト構築中です。利用規約とプライバシーポリシーの本文は、正式公開前に追加します。</div>
                <div id="formError" class="error"></div>
                <button id="submitButton" class="primary" type="submit">登録して開始する</button>
              </section>
            </form>
          </div>`;
        addAthleteRow({name:displayName});
        $("#addAthleteButton").addEventListener("click",()=>addAthleteRow());
        $$('input[name="applicantType"]').forEach((input)=>input.addEventListener("change",handleApplicantType));
        $("#applicantName").addEventListener("input",()=>{if(getApplicantType()==="本人"&&$$('.athlete-card').length===1){$('.athlete-name').value=$("#applicantName").value;}});
        $("#registrationForm").addEventListener("submit",submitRegistration);
      }

      function getApplicantType(){return $('input[name="applicantType"]:checked')?.value||"";}
      function handleApplicantType(){
        const type=getApplicantType();
        $("#coachNote").classList.toggle("hidden",type!=="指導者");
        if(type!=="指導者"&&$$('.athlete-card').length===0) addAthleteRow({name:type==="本人"?$("#applicantName").value:""});
        if(type==="本人"&&$$('.athlete-card').length===1) $('.athlete-name').value=$("#applicantName").value;
      }

      function addAthleteRow(values={}){
        const list=$("#athleteList");
        const card=document.createElement("div");
        card.className="athlete-card stack";
        card.innerHTML=`
          <div class="athlete-head"><strong>選手 <span class="athlete-number"></span></strong><button class="remove" type="button">削除</button></div>
          <div class="field"><label class="required">選手名</label><input class="athlete-name" maxlength="80" value="${escapeHtml(values.name||"")}"></div>
          <div class="grid-2">
            <div class="field"><label class="required">生年月日</label><input class="athlete-birth" type="date" max="${new Date().toISOString().slice(0,10)}"></div>
            <div class="field"><label class="required">身長（cm）</label><input class="athlete-height" type="number" inputmode="decimal" min="50" max="250" step="0.1"></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>体重（kg・任意）</label><input class="athlete-weight" type="number" inputmode="decimal" min="10" max="300" step="0.1"></div>
            <div class="field"><label class="required">所属</label><input class="athlete-affiliation" maxlength="100"></div>
          </div>
          <div class="field"><label>役職・立場（任意）</label><input class="athlete-position" maxlength="80" placeholder="例：選手、主将"></div>`;
        $(".remove",card).addEventListener("click",()=>{card.remove();renumberAthletes();handleApplicantType();});
        list.appendChild(card);renumberAthletes();
      }
      function renumberAthletes(){const cards=$$('.athlete-card');cards.forEach((card,index)=>{$('.athlete-number',card).textContent=index+1;$('.remove',card).classList.toggle("hidden",cards.length===1&&getApplicantType()!=="指導者");});}

      function collectAthletes(){return $$('.athlete-card').map((card)=>({
        name:$('.athlete-name',card).value.trim(),birthDate:$('.athlete-birth',card).value,
        height:$('.athlete-height',card).value,weight:$('.athlete-weight',card).value,
        affiliation:$('.athlete-affiliation',card).value.trim(),position:$('.athlete-position',card).value.trim()
      }));}

      async function submitRegistration(event){
        event.preventDefault();if(STATE.submitting)return;
        const error=$("#formError");error.classList.remove("visible");
        const payload={applicantName:$("#applicantName").value.trim(),applicantType:getApplicantType(),guardianName:$("#guardianName").value.trim(),role:$("#role").value.trim(),athletes:collectAthletes()};
        STATE.submitting=true;$("#submitButton").disabled=true;lock("登録しています...");
        try{STATE.data=await apiPost("registerCustomer",payload);renderHome();}
        catch(err){console.error(err);showError(err.message);}
        finally{STATE.submitting=false;unlock();const button=$("#submitButton");if(button)button.disabled=false;}
      }

      function renderHome(){
        const customer=STATE.data.customer||{};const athletes=STATE.data.athletes||[];
        $("#screen").innerHTML=`
          <div class="stack">
            <section class="card hero"><small>WELCOME</small><h2>${escapeHtml(customer.applicantName)}さん</h2><p>分析の申し込みから結果比較まで、このアプリで管理します。</p></section>
            <section class="card"><div class="profile-line"><img class="avatar" src="${escapeHtml(STATE.profile?.pictureUrl||"")}" alt=""><div><strong>${escapeHtml(customer.applicantName)}</strong><span>${escapeHtml(customer.applicantType||"")}として登録済み</span></div></div></section>
            <section class="task-card"><strong>現在、対応が必要な申し込みはありません</strong><p>申し込み状況に変化がある場合は、ここに優先表示します。</p></section>
            <section class="card"><div class="section-title"><div><h3>メニュー</h3><p>各機能は順番に接続します</p></div></div><div class="menu-grid">
              <button class="menu-button primary-menu" type="button" onclick="openApplication()"><b>新しく申し込む</b><span>最高速・スタート分析</span></button>
              <button class="menu-button" type="button" onclick="showComingSoon('申し込み状況')"><b>申し込み状況</b><span>動画・入金・分析状況</span></button>
              <button class="menu-button" type="button" onclick="showComingSoon('分析結果')"><b>分析結果</b><span>スティック・グラフ・PDF</span></button>
              <button class="menu-button" type="button" onclick="showComingSoon('比較')"><b>比較する</b><span>自分・フレンドと比較</span></button>
              <button class="menu-button" type="button" onclick="showComingSoon('共有')"><b>フレンド・指導者</b><span>招待と共有設定</span></button>
              <button class="menu-button" type="button" onclick="showComingSoon('選手管理')"><b>選手管理</b><span>選手の追加・編集</span></button>
            </div></section>
            <section class="card"><div class="section-title"><div><h3>登録選手</h3><p>${athletes.length}名</p></div></div><div>${athletes.length?athletes.map((athlete)=>`<div class="athlete-summary"><div><b>${escapeHtml(athlete.name)}</b><span>${escapeHtml(athlete.affiliation)}・${athlete.age==null?"年齢未設定":athlete.age+"歳"}・${escapeHtml(athlete.height)}cm</span></div><span class="pill">登録済み</span></div>`).join(""):'<p class="muted">登録選手はいません。指導者招待または選手管理から追加します。</p>'}</div></section>
          </div>`;
      }
      async function openApplication(){
        lock("商品情報を読み込み中...");
        try{const result=await apiPost("getProducts");STATE.products=result.products||[];if(!STATE.products.length)throw new Error("現在申し込める商品がありません");renderApplicationForm();}
        catch(error){console.error(error);alert(error.message||"商品情報を読み込めませんでした");}
        finally{unlock();}
      }
      function renderApplicationForm(){
        const athletes=STATE.data.athletes||[];if(!athletes.length){alert("先に選手を登録してください");return;}
        $("#screen").innerHTML=`<form id="applicationForm" class="stack" novalidate>
          <section class="card"><div class="section-title"><div><h2>新規申し込み</h2><p>動画確認後に振込をご案内します</p></div><button class="secondary" style="width:auto;min-height:38px;padding:0 12px" type="button" onclick="renderHome()">戻る</button></div><div class="field"><label class="required">申し込み区分</label><div class="choice-row" style="grid-template-columns:1fr 1fr"><label class="choice"><input type="radio" name="applicationType" value="個人" checked><span>個人</span></label><label class="choice"><input type="radio" name="applicationType" value="団体"><span>団体</span></label></div></div></section>
          <section class="card"><div class="section-title"><div><h3>分析内容</h3><p>現在受付中のコース</p></div></div><div class="product-grid">${STATE.products.map((product,index)=>`<label class="product-option"><input type="radio" name="productId" value="${escapeHtml(product.productId)}" ${index===0?"checked":""}><span class="product-box"><span class="product-top"><span><b>${escapeHtml(product.phase)}｜${escapeHtml(product.name)}コース</b><small>${product.plan==="プロ"?"全コマ分析＋PDFコメント":"5局面分析"}</small></span><span><span class="price">${formatYen(product.price)}</span>${product.campaignEnabled&&product.normalPrice>product.price?`<span class="old-price">${formatYen(product.normalPrice)}</span>`:""}</span></span>${product.groupDiscountEnabled?`<small>${product.groupMinimum}名以上で1人${formatYen(product.groupDiscount)}引き</small>`:""}</span></label>`).join("")}</div></section>
          <section class="card"><div class="section-title"><div><h3>対象選手</h3><p id="athleteSelectionNote">個人は1名選択</p></div></div><div class="select-list">${athletes.map((athlete,index)=>`<label class="athlete-option"><input type="checkbox" name="athleteId" value="${escapeHtml(athlete.athleteId)}" ${index===0?"checked":""}><span class="athlete-box"><span><b>${escapeHtml(athlete.name)}</b><small>${escapeHtml(athlete.affiliation)}</small></span><span class="pill">選択</span></span></label>`).join("")}</div></section>
          <section class="card"><div class="section-title"><div><h3>撮影情報</h3><p>選手ごとに入力</p></div></div><div id="shootingList" class="stack"></div></section>
          <section class="card stack"><div class="section-title"><div><h3>料金確認</h3><p>申し込み時点の金額を保存します</p></div></div><div id="priceSummary"></div><div class="notice">この段階では振込不要です。動画を確認後、LINEで振込をご案内します。</div><div id="formError" class="error"></div><button id="applicationSubmit" class="primary" type="submit">この内容で申し込む</button></section>
        </form>`;
        $$('input[name="applicationType"],input[name="productId"],input[name="athleteId"]').forEach((input)=>input.addEventListener("change",handleApplicationChange));
        $("#applicationForm").addEventListener("submit",submitApplication);handleApplicationChange();
      }
      function handleApplicationChange(event){
        const type=$('input[name="applicationType"]:checked')?.value||"個人";const inputs=$$('input[name="athleteId"]');
        if(type==="個人"){if(event?.target?.name==="athleteId"&&event.target.checked)inputs.forEach((input)=>{if(input!==event.target)input.checked=false;});if(!inputs.some((input)=>input.checked)&&inputs[0])inputs[0].checked=true;$("#athleteSelectionNote").textContent="個人は1名選択";}else{$("#athleteSelectionNote").textContent="団体は2名以上。5名以上で団体割";}
        renderShootingInputs();updatePriceSummary();
      }
      function selectedAthletes(){const ids=new Set($$('input[name="athleteId"]:checked').map((input)=>input.value));return(STATE.data.athletes||[]).filter((athlete)=>ids.has(athlete.athleteId));}
      function selectedProduct(){const id=$('input[name="productId"]:checked')?.value;return STATE.products.find((product)=>product.productId===id)||null;}
      function renderShootingInputs(){
        const old={};$$('.shooting-card').forEach((card)=>{old[card.dataset.athleteId]={shootingDate:$('.shooting-date',card)?.value||"",location:$('.shooting-location',card)?.value||"",fps:$('.shooting-fps',card)?.value||"",direction:$('.shooting-direction',card)?.value||"",notes:$('.shooting-notes',card)?.value||""};});const today=new Date().toISOString().slice(0,10);
        $("#shootingList").innerHTML=selectedAthletes().map((athlete)=>{const v=old[athlete.athleteId]||{};return`<div class="shooting-card" data-athlete-id="${escapeHtml(athlete.athleteId)}"><h4>${escapeHtml(athlete.name)}</h4><div class="grid-2"><div class="field"><label class="required">撮影日</label><input class="shooting-date" type="date" max="${today}" value="${escapeHtml(v.shootingDate||"")}"></div><div class="field"><label class="required">撮影場所</label><input class="shooting-location" maxlength="120" value="${escapeHtml(v.location||"")}"></div></div><div class="grid-2"><div class="field"><label class="required">フレームレート</label><select class="shooting-fps"><option value="">選択</option>${[30,60,120,240].map((fps)=>`<option value="${fps}" ${String(v.fps)===String(fps)?"selected":""}>${fps}fps</option>`).join("")}</select></div><div class="field"><label class="required">進行方向</label><select class="shooting-direction"><option value="">選択</option><option ${v.direction==="左から右"?"selected":""}>左から右</option><option ${v.direction==="右から左"?"selected":""}>右から左</option></select></div></div><div class="field"><label>補足事項（任意）</label><textarea class="shooting-notes" maxlength="500">${escapeHtml(v.notes||"")}</textarea></div></div>`;}).join("")||'<p class="muted">対象選手を選択してください</p>';
      }
      function calculateClientPrice(){const product=selectedProduct(),athletes=selectedAthletes(),type=$('input[name="applicationType"]:checked')?.value||"個人";if(!product)return null;const groupApplied=type==="団体"&&product.groupDiscountEnabled&&athletes.length>=product.groupMinimum;const groupTotal=groupApplied?product.groupDiscount*athletes.length:0;const campaignTotal=product.campaignEnabled?Math.max(0,product.normalPrice-product.price)*athletes.length:0;return{product,count:athletes.length,groupApplied,groupTotal,campaignTotal,total:Math.max(0,product.price*athletes.length-groupTotal)};}
      function updatePriceSummary(){const price=calculateClientPrice();if(!price){$("#priceSummary").innerHTML="";return;}$("#priceSummary").innerHTML=`<div class="summary-row"><span>${escapeHtml(price.product.name)} × ${price.count}名</span><b>${formatYen(price.product.price*price.count)}</b></div>${price.campaignTotal?`<div class="summary-row discount"><span>キャンペーン割引</span><b>通常価格より−${formatYen(price.campaignTotal)}</b></div>`:""}${price.groupApplied?`<div class="summary-row discount"><span>団体割</span><b>−${formatYen(price.groupTotal)}</b></div>`:""}<div class="summary-row total"><span>予定金額</span><b>${formatYen(price.total)}</b></div>`;}
      function collectApplicationAthletes(){return $$('.shooting-card').map((card)=>({athleteId:card.dataset.athleteId,shootingDate:$('.shooting-date',card).value,location:$('.shooting-location',card).value.trim(),fps:$('.shooting-fps',card).value,direction:$('.shooting-direction',card).value,notes:$('.shooting-notes',card).value.trim()}));}
      async function submitApplication(event){event.preventDefault();if(STATE.submitting)return;$("#formError").classList.remove("visible");const payload={applicationType:$('input[name="applicationType"]:checked')?.value||"",productId:$('input[name="productId"]:checked')?.value||"",athletes:collectApplicationAthletes()};STATE.submitting=true;$("#applicationSubmit").disabled=true;lock("申し込みを登録中...");try{const result=await apiPost("createApplication",payload);renderApplicationComplete(result.application);}catch(error){console.error(error);showError(error.message);}finally{STATE.submitting=false;unlock();const button=$("#applicationSubmit");if(button)button.disabled=false;}}
      function renderApplicationComplete(application){$("#screen").innerHTML=`<div class="stack"><section class="card hero"><small>APPLICATION ACCEPTED</small><h2>申し込みを受け付けました</h2><p>続けて、選手ごとに分析動画を提出してください。</p></section><section class="card stack"><div><b>申込ID</b><p style="margin:5px 0 0;color:var(--blue);font-weight:900">${escapeHtml(application.applicationId)}</p></div><div class="summary-row"><span>${escapeHtml(application.phase)}｜${escapeHtml(application.productName)}</span><b>${application.count}名</b></div>${application.groupDiscountApplied?`<div class="summary-row discount"><span>団体割</span><b>−${formatYen(application.groupDiscountTotal)}</b></div>`:""}<div class="summary-row total"><span>予定金額</span><b>${formatYen(application.total)}</b></div><div class="notice">まだ振り込まないでください。動画確認後に振込先と確定金額をご案内します。</div></section><section class="card stack"><div class="section-title"><div><h3>動画を提出</h3><p>Googleアカウントへのログインが必要です</p></div></div>${application.athletes.map((athlete)=>`<button class="primary" type="button" data-upload-url="${escapeHtml(athlete.uploadUrl)}">${escapeHtml(athlete.name)}の動画を提出</button>`).join("")}<button class="secondary" type="button" onclick="reloadHome()">ホームへ戻る</button></section></div>`;$$('[data-upload-url]').forEach((button)=>button.addEventListener("click",()=>openUploadForm(button.dataset.uploadUrl)));}
      function openUploadForm(url){if(window.liff?.openWindow)liff.openWindow({url,external:true});else window.open(url,"_blank","noopener");}
      async function reloadHome(){lock("ホームを更新中...");try{STATE.data=await apiPost("bootstrap");renderHome();}catch(error){alert(error.message);}finally{unlock();}}
      function formatYen(value){return `${Math.round(Number(value)||0).toLocaleString("ja-JP")}円`;}
      function showComingSoon(name){alert(`${name}は次の工程で実装します`);}
      window.addEventListener("DOMContentLoaded",startApp);
    </script>
  </body>
